 "Wǒ shì zhèr de xīn gōngchéngshī.", "我是这儿的新工程师。"], ["Saya adalah engineer yang bertanggung jawab atas mesin ini.", "Wǒ shì fùzé zhè tái jī de gōngchéngshī.", "我是负责这台机的工程师。"]]}, {"label": "Kurang umum: Lebih sering dipakai 工艺工程师 (Mainland) atau 制程工程师 (Taiwan). Kalimat ini jarang diucapkan dalam percakapan umum.", "id": "Saya adalah Process Engineer", "py": "wǒ shì gōngyì gōngchéngshī", "hz": "我是工艺工程师", "words": "我 (wǒ): saya, 是 (shì): adalah, 工艺 (gōngyì): proses / teknologi produksi, 工程师 (gōngchéngshī): insinyur", "note": "Sudah sesuai gaya Mainland. (Taiwan: 制程工程师 zhìchéng gōngchéngshī)", "warn": false, "ex": [["Saya adalah process engineer di lini PLC.", "Wǒ shì PLC xiàn de gōngyì gōngchéngshī.", "我是PLC线的工艺工程师。"], ["Saya adalah process engineer untuk coupling.", "Wǒ shì ǒuhé gōngxù de gōngyì gōngchéngshī.", "我是耦合工序的工艺工程师。"], ["Saya adalah process engineer yang menangani yield.", "Wǒ shì fùzé liánglǜ de gōngyì gōngchéngshī.", "我是负责良率的工艺工程师。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "saya coba", "py": "wǒ shì shì", "hz": "我试试", "words": "我 (wǒ): saya, 试 (shì): coba, 试 (shì): coba", "note": "", "warn": false, "ex": [["Biar saya coba dulu.", "Ràng wǒ xiān shìyíxià.", "让我先试一下。"], ["Saya coba cara baru ini.", "Wǒ shìshi zhè ge xīn fāngfǎ.", "我试试这个新方法。"], ["Saya coba perbaiki mesinnya.", "Wǒ shìshi xiūlǐ zhè tái jī.", "我试试修理这台机。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Saya mengerti", "py": "wǒ dǒng le", "hz": "我懂了", "words": "我 (wǒ): saya, 懂 (dǒng): mengerti, 了 (le): partikel selesai", "note": "", "warn": false, "ex": [["Saya mengerti sekarang.", "Wǒ xiànzài dǒng le.", "我现在懂了。"], ["Saya mengerti, terima kasih.", "Wǒ dǒng le, xièxie.", "我懂了，谢谢。"], ["Saya mengerti prosedurnya.", "Wǒ dǒng cāozuò guīchéng le.", "我懂操作规程了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Saya sedang belajar bahasa mandarin", "py": "wǒ zài xué Zhōngwén", "hz": "我在学中文", "words": "我 (wǒ): saya, 在 (zài): sedang, 学 (xué): belajar, 中文 (Zhōngwén): bahasa Mandarin", "note": "", "warn": false, "ex": [["Saya belajar bahasa Mandarin tiap malam.", "Wǒ měi tiān wǎnshang dōu zài xué Zhōngwén.", "我每天晚上都在学中文。"], ["Saya sedang belajar bahasa Mandarin untuk bisnis.", "Wǒ zài wèi shāngwù xué Zhōngwén.", "我在为商务学中文。"], ["Dia juga sedang belajar bahasa Mandarin.", "Tā yě zài xué Zhōngwén.", "他也在学中文。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Saya tidak mengerti", "py": "wǒ bù dǒng", "hz": "我不懂", "words": "我 (wǒ): saya, 不 (bù): tidak, 懂 (dǒng): mengerti", "note": "", "warn": false, "ex": [["Maaf, saya tidak mengerti.", "Duìbuqǐ, wǒ bù dǒng.", "对不起，我不懂。"], ["Saya tidak mengerti kalimat itu.", "Wǒ bù dǒng nà jù huà.", "我不懂那句话。"], ["Saya tidak mengerti, tolong jelaskan.", "Wǒ bù dǒng, qǐng jiěshì yíxià.", "我不懂，请解释一下。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "saya tidak tahu", "py": "wǒ bù zhīdào", "hz": "我不知道", "words": "我 (wǒ): saya, 不 (bù): tidak, 知道 (zhīdào): tahu", "note": "", "warn": false, "ex": [["Saya tidak tahu jawabannya.", "Wǒ bù zhīdào dá'àn.", "我不知道答案。"], ["Maaf, saya tidak tahu.", "Duìbuqǐ, wǒ bù zhīdào.", "对不起，我不知道。"], ["Saya tidak tahu siapa yang mengambil.", "Wǒ bù zhīdào shéi ná le.", "我不知道谁拿了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Screening/Penyortiran", "py": "shāixuǎn", "hz": "筛选", "words": "筛 (shāi): ayak, 选 (xuǎn): pilih, 筛选 (shāixuǎn): menyortir / screening", "note": "", "warn": false, "ex": [["Screening dilakukan sebelum pengiriman.", "Shāixuǎn zài fāhuò qián jìnxíng.", "筛选在发货前进行。"], ["Hasil screening harus dicatat.", "Shāixuǎn de jiéguǒ yào jìlù.", "筛选的结果要记录。"], ["Produk hasil screening sudah dipisahkan.", "Shāixuǎn hòu de chǎnpǐn yǐjīng fēnkāi le.", "筛选后的产品已经分开了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "sebelas", "py": "shíyī", "hz": "十一", "words": "十 (shí): sepuluh, 一 (yī): satu", "note": "", "warn": false, "ex": [["Ada sebelas orang di tim.", "Tuánduì yǒu shíyī gè rén.", "团队有十一个人。"], ["Sebelas tambah sembilan sama dengan dua puluh.", "Shíyī jiā jiǔ děngyú èrshí.", "十一加九等于二十。"], ["Saya bekerja sebelas jam sehari.", "Wǒ měi tiān gōngzuò shíyī xiǎoshí.", "我每天工作十一小时。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "sedikit", "py": "yìdiǎn", "hz": "一点", "words": "一点 (yìdiǎn): sedikit", "note": "", "warn": false, "ex": [["Tolong tambah sedikit lagi.", "Qǐng zài jiā yìdiǎn.", "请再加一点。"], ["Saya cuma butuh sedikit waktu.", "Wǒ zhǐ xūyào yìdiǎn shíjiān.", "我只需要一点时间。"], ["Hari ini yang datang sedikit.", "Jīntiān lái de rén hěn shǎo.", "今天来的人很少。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Sekarang", "py": "xiànzài", "hz": "现在", "words": "现 (xiàn): kini, 在 (zài): berada, 现在 (xiànzài): sekarang", "note": "", "warn": false, "ex": [["Sekarang jam sepuluh.", "Xiànzài shí diǎn.", "现在十点。"], ["Sekarang kita mulai rapat.", "Xiànzài wǒmen kāishǐ kāi huì.", "现在我们开始开会。"], ["Sekarang saya sedang di pabrik.", "Xiànzài wǒ zài gōngchǎng.", "现在我在工厂。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Selamat Malam", "py": "wǎnshang hǎo", "hz": "晚上好", "words": "晚上 (wǎnshang): malam, 好 (hǎo): baik", "note": "", "warn": false, "ex": [["Selamat malam, Pak.", "Wǎnshang hǎo, xiānsheng.", "晚上好，先生。"], ["Selamat malam semua.", "Dàjiā wǎnshang hǎo.", "大家晚上好。"], ["Selamat malam, sampai jumpa besok.", "Wǎnshang hǎo, míngtiān jiàn.", "晚上好，明天见。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Selamat Pagi", "py": "zǎoshang hǎo", "hz": "早上好", "words": "早上 (zǎoshang): pagi, 好 (hǎo): baik", "note": "", "warn": false, "ex": [["Selamat pagi, Pak Lin.", "Zǎoshang hǎo, Lín jīnglǐ.", "早上好，林经理。"], ["Selamat pagi semua, mari mulai kerja.", "Dàjiā zǎoshang hǎo, kāishǐ gōngzuò ba.", "大家早上好，开始工作吧。"], ["Selamat pagi, sudah sarapan?", "Zǎoshang hǎo, chī zǎofàn le ma?", "早上好，吃早饭了吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Selamat Sore", "py": "xiàwǔ hǎo", "hz": "下午好", "words": "下午 (xiàwǔ): sore / siang, 好 (hǎo): baik", "note": "", "warn": false, "ex": [["Selamat sore, bagaimana kabarmu?", "Xiàwǔ hǎo, nǐ hǎo ma?", "下午好，你好吗？"], ["Selamat sore semua.", "Dàjiā xiàwǔ hǎo.", "大家下午好。"], ["Selamat sore, sudah pulang kerja?", "Xiàwǔ hǎo, xiàbān le ma?", "下午好，下班了吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Selasa", "py": "xīngqī'èr", "hz": "星期二", "words": "星期 (xīngqī): minggu / hari, 二 (èr): dua", "note": "", "warn": false, "ex": [["Rapat hari Selasa jam sepuluh.", "Xīngqī'èr shàngwǔ shí diǎn kāi huì.", "星期二上午十点开会。"], ["Hari Selasa ada pengiriman besar.", "Xīngqī'èr yǒu dà pīliàng fāhuò.", "星期二有大批发货。"], ["Selasa depan saya cuti.", "Xià xīngqī'èr wǒ xiūjià.", "下星期二我休假。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "sembilan", "py": "jiǔ", "hz": "九", "words": "九 (jiǔ): sembilan", "note": "", "warn": false, "ex": [["Sembilan orang sudah hadir.", "Jiǔ ge rén yǐjīng dào le.", "九个人已经到了。"], ["Sembilan dikurangi tiga sama dengan enam.", "Jiǔ jiǎn sān děngyú liù.", "九减三等于六。"], ["Sekarang jam sembilan.", "Xiànzài jiǔ diǎn.", "现在九点。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Semuanya sama saja", "py": "Dōu yíyàng", "hz": "都一样。", "words": "都 (dōu): semua, 一样 (yíyàng): sama", "note": "", "warn": false, "ex": [["Mau yang merah atau biru, semuanya sama saja.", "Yào hóng de háishì lán de, dōu yíyàng.", "要红的还是蓝的，都一样。"], ["Harganya beda sedikit, tapi semuanya sama saja.", "Jiàgé yǒu diǎn bù tóng, dàn dōu yíyàng.", "价格有点不同，但都一样。"], ["Pilih mesin mana pun, semuanya sama saja.", "Xuǎn nǎ tái jī dōu yíyàng.", "选哪台机都一样。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Senin", "py": "xīngqīyī", "hz": "星期一", "words": "星期 (xīngqī): minggu / hari, 一 (yī): satu", "note": "", "warn": false, "ex": [["Rapat hari Senin jam sembilan.", "Xīngqīyī jiǔ diǎn kāi huì.", "星期一九点开会。"], ["Hari Senin mesin mulai produksi.", "Xīngqīyī jīqì kāishǐ shēngchǎn.", "星期一机器开始生产。"], ["Senin depan saya masuk shift malam.", "Xià xīngqīyī wǒ shàng yè bān.", "下星期一我上夜班。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "September", "py": "jiǔyuè", "hz": "九月", "words": "九 (jiǔ): sembilan, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Target September sudah ditetapkan.", "Jiǔyuè de mùbiāo yǐjīng quèdìng le.", "九月的目标已经确定了。"], ["Kami libur panjang bulan September.", "Wǒmen jiǔyuè yǒu cháng jià.", "我们九月有长假。"], ["Kontrak ini berakhir September.", "Zhè fèn hétóng jiǔyuè dàoqī.", "这份合同九月到期。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "sepuluh", "py": "shí", "hz": "十", "words": "十 (shí): sepuluh", "note": "", "warn": false, "ex": [["Ada sepuluh kotak di gudang.", "Cāngkù lǐ yǒu shí ge xiāngzi.", "仓库里有十个箱子。"], ["Tolong tunggu sepuluh menit.", "Qǐng děng shí fēnzhōng.", "请等十分钟。"], ["Saya kerja sepuluh jam hari ini.", "Jīntiān wǒ gōngzuò le shí xiǎoshí.", "今天我工作了十小时。"]]}, {"label": "Umum: Umum; untuk sopan dengan orang yang lebih tua/baru kenal, native pakai 您贵姓?", "id": "Siapa nama kamu?", "py": "Nǐ jiào shénme míngzi?", "hz": "你叫什么名字？", "words": "你 (nǐ): kamu, 叫 (jiào): dipanggil, 什么 (shénme): apa, 名字 (míngzi): nama", "note": "Pinyin dilengkapi tanda nada", "warn": false, "ex": [["Halo, siapa nama kamu?", "Nǐ hǎo, nǐ jiào shénme míngzi?", "你好，你叫什么名字？"], ["Maaf, siapa nama kamu?", "Duìbuqǐ, nǐ jiào shénme míngzi?", "对不起，你叫什么名字？"], ["Siapa nama kamu, dari bagian mana?", "Nǐ jiào shénme míngzi, shì nǎ ge bù mén de?", "你叫什么名字，是哪个部门的？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Siapa orangnya?", "py": "Shuí a?", "hz": "谁啊？", "words": "谁 (shuí / shéi): siapa, 啊 (a): partikel penegas di akhir kalimat (memperhalus nada bicara)", "note": "Format E diseragamkan (\"=\" → \":\")", "warn": false, "ex": [["Siapa orangnya? Saya tidak kenal.", "Shuí a? Wǒ bú rènshi.", "谁啊？我不认识。"], ["Tadi ada yang ketuk pintu, siapa orangnya?", "Gānggāng yǒu rén qiāo mén, shuí a?", "刚才有人敲门，谁啊？"], ["Siapa orangnya yang masuk ruang produksi?", "Shuí a, shì shuí jìn le shēngchǎn shì?", "谁啊，是谁进了生产室？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "siapa?", "py": "shéi?", "hz": "谁？", "words": "谁 (shéi): siapa", "note": "", "warn": false, "ex": [["Siapa yang bertanggung jawab?", "Shéi fùzé?", "谁负责？"], ["Siapa yang datang?", "Shéi lái le?", "谁来了？"], ["Siapa yang mengambil alat ini?", "Shéi ná le zhè ge gōngjù?", "谁拿了这个工具？"]]}, {"label": "Kurang umum: 穿 kurang tepat untuk \"pasang komponen\"; lebih lazim 装零件 (zhuāng língjiàn).", "id": "Slide Parts/Pemasangan Komponen", "py": "chuān língjiàn", "hz": "穿零件", "words": "穿 (chuān): memasukkan / menembus, 零件 (língjiàn): komponen / part", "note": "", "warn": false, "ex": [["Pasang komponen slide ke posisi yang benar.", "Zhuāng huádòng língjiàn dào zhèngquè wèizhì.", "装滑动零件到正确位置。"], ["Komponen slide harus dipasang dengan hati-hati.", "Huádòng língjiàn yào xiǎoxīn ānzhuāng.", "滑动零件要小心安装。"], ["Setelah slide parts, cek kembali.", "Zhuāng wán huádòng língjiàn, zài jiǎnchá yí cì.", "装完滑动零件，再检查一次。"]]}, {"label": "Umum di pabrik: Istilah pabrik; wajar dipakai di lingkungan kerja, tidak di percakapan umum.", "id": "Stasiun Pemeriksaan", "py": "jiǎnyàn gōngwèi", "hz": "检验工位", "words": "检 (jiǎn): periksa, 验 (yàn): uji, 工位 (gōngwèi): stasiun", "note": "", "warn": false, "ex": [["Produk harus lewat stasiun pemeriksaan.", "Chǎnpǐn yào jīngguò jiǎnyàn gōngwèi.", "产品要经过检验工位。"], ["Stasiun pemeriksaan ada di lantai dua.", "Jiǎnyàn gōngwèi zài èr lóu.", "检验工位在二楼。"], ["Operator stasiun pemeriksaan sedang istirahat.", "Jiǎnyàn gōngwèi de cāozuòyuán zài xiūxi.", "检验工位的操作员在休息。"]]}, {"label": "Umum di pabrik: Istilah pabrik; wajar dipakai di lingkungan kerja, tidak di percakapan umum.", "id": "Stasiun Pengemasan", "py": "bāozhuāng gōngwèi", "hz": "包装工位", "words": "包 (bāo): bungkus, 装 (zhuāng): kemas, 工位 (gōngwèi): stasiun", "note": "", "warn": false, "ex": [["Produk dipindahkan ke stasiun pengemasan.", "Chǎnpǐn bān dào bāozhuāng gōngwèi.", "产品搬到包装工位。"], ["Stasiun pengemasan butuh tambahan orang.", "Bāozhuāng gōngwèi xūyào zēngjiā rénshǒu.", "包装工位需要增加人手。"], ["Di stasiun pengemasan ada kotak kosong.", "Bāozhuāng gōngwèi yǒu kōng xiāngzi.", "包装工位有空箱子。"]]}, {"label": "Umum di pabrik: Istilah pabrik; wajar dipakai di lingkungan kerja, tidak di percakapan umum.", "id": "Stasiun Pengujian", "py": "cèshì gōngwèi", "hz": "测试工位", "words": "测 (cè): ukur, 试 (shì): uji, 工位 (gōngwèi): stasiun", "note": "", "warn": false, "ex": [["Produk harus dites di stasiun pengujian.", "Chǎnpǐn yào zài cèshì gōngwèi cèshì.", "产品要在测试工位测试。"], ["Stasiun pengujian sedang dipakai.", "Cèshì gōngwèi zhèng zài shǐyòng.", "测试工位正在使用。"], ["Stasiun pengujian nomor tiga rusak.", "Dì sān hào cèshì gōngwèi huài le.", "三号测试工位坏了。"]]}, {"label": "Umum di pabrik: Istilah pabrik; wajar dipakai di lingkungan kerja, tidak di percakapan umum.", "id": "Stasiun Perakitan", "py": "zǔzhuāng gōngwèi", "hz": "组装工位", "words": "组 (zǔ): rakit, 装 (zhuāng): pasang, 工位 (gōngwèi): stasiun", "note": "", "warn": false, "ex": [["Komponen dibawa ke stasiun perakitan.", "Língjiàn bān dào zǔzhuāng gōngwèi.", "零件搬到组装工位。"], ["Stasiun perakitan mulai jam tujuh.", "Zǔzhuāng gōngwèi qī diǎn kāishǐ.", "组装工位七点开始。"], ["Operator stasiun perakitan sudah terlatih.", "Zǔzhuāng gōngwèi de cāozuòyuán yǐjīng péixùn guò le.", "组装工位的操作员已经培训过了。"]]}, {"label": "Kurang umum: 已经 bisa dipakai, tetapi native lebih sering memakai 了 atau 好了 untuk menyatakan sudah selesai.", "id": "Sudah", "py": "yǐjīng", "hz": "已经", "words": "已经 (yǐjīng): sudah", "note": "", "warn": false, "ex": [["Sudah makan?", "Chī le ma?", "吃了吗？"], ["Pekerjaannya sudah selesai.", "Gōngzuò yǐjīng wánchéng le.", "工作已经完成了。"], ["Saya sudah kirim laporannya.", "Wǒ yǐjīng fā le bàogào.", "我已经发了报告。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Sudah agak paham", "py": "míngbái yìdiǎn le", "hz": "明白一点了", "words": "明白 (míngbái): paham, 一点 (yìdiǎn): sedikit, 了 (le): partikel perubahan", "note": "", "warn": false, "ex": [["Saya sudah agak paham sekarang.", "Wǒ xiànzài míngbái yìdiǎn le.", "我现在明白一点了。"], ["Sudah agak paham, tapi masih ada yang bingung.", "Míngbái yìdiǎn le, dàn hái yǒu yìxiē bù qīngchu.", "明白一点了，但还有些不清楚。"], ["Setelah dijelaskan, saya sudah agak paham.", "Jīngguò jiěshì, wǒ míngbái yìdiǎn le.", "经过解释，我明白一点了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Sudah belum?", "py": "hǎo le ma?", "hz": "好了吗？", "words": "好 (hǎo): beres, 了 (le): partikel selesai, 吗 (ma): partikel tanya", "note": "", "warn": false, "ex": [["Laporannya sudah belum?", "Bàogào hǎo le ma?", "报告好了吗？"], ["Pekerjaannya sudah belum? Saya tunggu.", "Gōngzuò hǎo le ma? Wǒ děng nǐ.", "工作好了吗？我等你。"], ["Sudah belum, kita mau berangkat.", "Hǎo le ma? Wǒmen yào chūfā le.", "好了吗？我们要出发了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Sudah paham", "py": "míngbái le", "hz": "明白了", "words": "明白 (míngbái): paham, 了 (le): partikel selesai", "note": "", "warn": false, "ex": [["Baik, saya sudah paham.", "Hǎo, wǒ míngbái le.", "好，我明白了。"], ["Sudah paham semua?", "Dàjiā dōu míngbái le ma?", "大家都明白了吗？"], ["Sudah paham cara kerjanya?", "Míngbái zěnme zuò le ma?", "明白怎么做了吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Sudah paham, terima kasih", "py": "míngbái le, xièxie", "hz": "明白了，谢谢", "words": "明白了 (míngbái le): sudah paham, 谢谢 (xièxie): terima kasih", "note": "", "warn": false, "ex": [["Sudah paham, terima kasih atas penjelasannya.", "Míngbái le, xièxie nǐ de jiěshì.", "明白了，谢谢你的解释。"], ["Sudah paham, terima kasih banyak.", "Míngbái le, duō xièxie.", "明白了，多谢。"], ["Sudah paham, terima kasih sudah membantu.", "Míngbái le, xièxie nǐ de bāngzhù.", "明白了，谢谢你的帮助。"]]}, {"label": "Umum: Umum, tetapi lebih lazim 懂了吗？ dalam percakapan.", "id": "Sudah Paham?", "py": "míngbái le ma?", "hz": "明白了吗？", "words": "明白 (míngbái): paham, 了 (le): partikel selesai, 吗 (ma): partikel tanya", "note": "D56: tanda tanya diganti full-width (？)", "warn": false, "ex": [["Sudah paham? Kalau belum, tanya saja.", "Míngbái le ma? Rúguǒ hái méi míngbái, jiù wèn ba.", "明白了吗？如果还没明白，就问吧。"], ["Sudah paham prosedurnya?", "Míngbái cāozuò guīchéng le ma?", "明白操作规程了吗？"], ["Sudah paham cara memakai alatnya?", "Míngbái zěnme yòng zhè ge gōngjù le ma?", "明白怎么用这个工具了吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "sudah tidak ada", "py": "Méiyǒu le", "hz": "没有了", "words": "没有了 (méiyǒu le): sudah tidak ada, 没 (méi): tidak, 有 (yǒu): ada, 了 (le): partikel perubahan", "note": "", "warn": false, "ex": [["Stok label sudah tidak ada.", "Biāoqiān méiyǒu le.", "标签没有了。"], ["Maaf, kopinya sudah tidak ada.", "Duìbuqǐ, kāfēi méiyǒu le.", "对不起，咖啡没有了。"], ["Barang ini sudah tidak ada di gudang.", "Zhè ge dōngxi cāngkù lǐ méiyǒu le.", "这个东西仓库里没有了。"]]}, {"label": "Umum di pabrik: Istilah industri, dipakai di lingkungan kerja.", "id": "Surface Treatment/Perawatan Permukaan", "py": "biǎomiàn chǔlǐ", "hz": "表面处理", "words": "表面 (biǎomiàn): permukaan, 处理 (chǔlǐ): perlakuan / penanganan", "note": "", "warn": false, "ex": [["Surface treatment dilakukan sebelum coating.", "Biǎomiàn chǔlǐ zài túcéng qián jìnxíng.", "表面处理在涂层前进行。"], ["Hasil surface treatment harus rata.", "Biǎomiàn chǔlǐ de jiéguǒ yào píngzhěng.", "表面处理的结果要平整。"], ["Mesin surface treatment sedang dibersihkan.", "Biǎomiàn chǔlǐ jī zhèng zài qīngxǐ.", "表面处理机正在清洗。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tahu", "py": "zhīdào", "hz": "知道", "words": "知 (zhī): tahu, 道 (dào): hal / cara, 知道 (zhīdào): tahu", "note": "", "warn": false, "ex": [["Saya tahu jawabannya.", "Wǒ zhīdào dá'àn.", "我知道答案。"], ["Kamu tahu di mana alatnya?", "Nǐ zhīdào gōngjù zài nǎr ma?", "你知道工具在哪儿吗？"], ["Saya tidak tahu, tapi saya cari tahu.", "Wǒ bù zhīdào, dàn wǒ qù dǎting yíxià.", "我不知道，但我去打听一下。"]]}, {"label": "Kurang umum: 哪一年 bisa dipakai, tetapi native lebih sering bertanya dengan 哪年 atau 什么时候.", "id": "Tahun berapa?", "py": "nǎ yī nián?", "hz": "哪一年？", "words": "哪 (nǎ): yang mana, 一 (yī): satu, 年 (nián): tahun", "note": "", "warn": false, "ex": [["Tahun berapa sekarang?", "Xiànzài shì nǎ yī nián?", "现在是哪一年？"], ["Mesin ini dibuat tahun berapa?", "Zhè tái jī shì nǎ yì nián zhìzào de?", "这台机是哪一年制造的？"], ["Tahun berapa kamu mulai kerja?", "Nǐ shì nǎ yì nián kāishǐ gōngzuò de?", "你是哪一年开始工作的？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tahun depan", "py": "míngnián", "hz": "明年", "words": "明 (míng): berikutnya, 年 (nián): tahun", "note": "", "warn": false, "ex": [["Tahun depan saya mau kuliah.", "Míngnián wǒ xiǎng shàng dàxué.", "明年我想上大学。"], ["Rencana tahun depan sudah dibuat.", "Míngnián de jìhuà yǐjīng zhìdìng le.", "明年的计划已经制定了。"], ["Tahun depan kita pindah pabrik.", "Míngnián wǒmen bān gōngchǎng.", "明年我们搬工厂。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Tahun dua ribu dua puluh enam", "py": "èr líng èr liù nián", "hz": "二零二六年", "words": "二 (èr): dua, 零 (líng): nol, 二 (èr): dua, 六 (liù): enam, 年 (nián): tahun", "note": "Tahun dibaca per angka", "warn": false, "ex": [["Laporan ini dibuat tahun dua ribu dua puluh enam.", "Zhè fèn bàogào shì èr líng èr liù nián zhìzuò de.", "这份报告是二零二六年制作的。"], ["Tahun dua ribu dua puluh enam, target kita naik.", "Èr líng èr liù nián, wǒmen mùbiāo shì zēngzhǎng.", "二零二六年，我们的目标是增长。"], ["Data ini dari tahun dua ribu dua puluh enam.", "Zhè xiē shùjù shì èr líng èr liù nián de.", "这些数据是二零二六年的。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tahun ini", "py": "jīnnián", "hz": "今年", "words": "今 (jīn): ini, 年 (nián): tahun", "note": "", "warn": false, "ex": [["Tahun ini produksi naik.", "Jīnnián chǎnliàng zēngjiā le.", "今年产量增加了。"], ["Tahun ini saya ikut pelatihan.", "Jīnnián wǒ cānjiā le péixùn.", "今年我参加了培训。"], ["Tahun ini target kita tinggi.", "Jīnnián wǒmen de mùbiāo hěn gāo.", "今年我们的目标很高。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tahun lalu", "py": "qùnián", "hz": "去年", "words": "去 (qù): lalu, 年 (nián): tahun", "note": "", "warn": false, "ex": [["Tahun lalu saya masih di Shanghai.", "Qùnián wǒ hái zài Shànghǎi.", "去年我还在上海。"], ["Tahun lalu pabrik ini baru dibuka.", "Qùnián zhè jiā gōngchǎng gānggāng kāi zhāng.", "去年这家工厂刚开张。"], ["Produksi tahun lalu lebih rendah.", "Qùnián de chǎnliàng gèng dī.", "去年的产量更低。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Tanggal berapa?", "py": "jīntiān jǐ hào?", "hz": "今天几号？", "words": "今天 (jīntiān): hari ini, 几 (jǐ): berapa, 号 (hào): tanggal", "note": "", "warn": false, "ex": [["Rapat tanggal berapa?", "Huìyì shì jǐ hào?", "会议是几号？"], ["Kirim laporannya tanggal berapa?", "Bàogào jǐ hào fā?", "报告几号发？"], ["Gajian tanggal berapa?", "Jǐ hào fā gōngzī?", "几号发工资？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Teman Saya", "py": "wǒ de péngyou", "hz": "我的朋友", "words": "我 (wǒ): saya, 的 (de): milik, 朋友 (péngyou): teman", "note": "", "warn": false, "ex": [["Itu teman saya.", "Nà shì wǒ de péngyou.", "那是我的朋友。"], ["Teman saya bekerja di pabrik sebelah.", "Wǒ de péngyou zài pángbiān de gōngchǎng gōngzuò.", "我的朋友在旁边的工厂工作。"], ["Teman saya ikut pelatihan bulan ini.", "Wǒ de péngyou zhè ge yuè cānjiā le péixùn.", "我的朋友这个月参加了培训。"]]}, {"label": "Formal: Formal/tulisan. Lisan sehari-hari: 谢谢你的帮助.", "id": "terima kasih atas bantuan Anda", "py": "Xièxiè nín de bāngzhù.", "hz": "谢谢您的帮助。", "words": "谢谢 (xièxie): terima kasih, 您 (nín): Anda, 的 (de): milik, 帮助 (bāngzhù): bantuan", "note": "", "warn": false, "ex": [["Terima kasih atas bantuan Anda, Pak.", "Xièxie nín de bāngzhù, xiānsheng.", "谢谢您的帮助，先生。"], ["Terima kasih atas bantuan Anda kemarin.", "Xièxie nín zuótiān de bāngzhù.", "谢谢您昨天的帮助。"], ["Terima kasih atas bantuan Anda, sangat membantu.", "Xièxie nín de bāngzhù, fēicháng yǒu yòng.", "谢谢您的帮助，非常有用。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Terima kasih", "py": "xièxie", "hz": "谢谢", "words": "谢 (xiè): terima kasih, 谢 (xie): terima kasih", "note": "", "warn": false, "ex": [["Terima kasih, sudah dikirim.", "Xièxie, yǐjīng fā le.", "谢谢，已经发了。"], ["Terima kasih banyak untuk hari ini.", "Jīntiān fēicháng xièxie nǐ.", "今天非常谢谢你。"], ["Terima kasih sudah menunggu.", "Xièxie nǐ děng wǒ.", "谢谢你等我。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak", "py": "bù / bú shì", "hz": "不 / 不是", "words": "不 (bù): tidak, 是 (shì): adalah", "note": "", "warn": false, "ex": [["Saya tidak mau.", "Wǒ bú yào.", "我不要。"], ["Tidak, itu bukan punya saya.", "Bù, nà bú shì wǒ de.", "不，那不是我的。"], ["Tidak apa-apa.", "Méi guānxi.", "没关系。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak ada", "py": "méi yǒu", "hz": "没有", "words": "没 (méi): tidak, 有 (yǒu): ada", "note": "", "warn": false, "ex": [["Di gudang tidak ada orang.", "Cāngkù lǐ méiyǒu rén.", "仓库里没有人。"], ["Tidak ada masalah.", "Méiyǒu wèntí.", "没有问题。"], ["Tidak ada stok hari ini.", "Jīntiān méiyǒu huòcún.", "今天没有库存。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak apa-apa", "py": "méi guānxi", "hz": "没关系", "words": "没 (méi): tidak, 关系 (guānxi): hubungan / masalah, 没关系 (méi guānxi): tidak apa-apa", "note": "", "warn": false, "ex": [["Maaf terlambat, tidak apa-apa.", "Duìbuqǐ chídào le, méi guānxi.", "对不起迟到了，没关系。"], ["Tidak apa-apa, kita lanjut besok.", "Méi guānxi, wǒmen míngtiān zài jìnxíng.", "没关系，我们明天再进行。"], ["Tidak apa-apa, saya bisa sendiri.", "Méi guānxi, wǒ zìjǐ néng zuò.", "没关系，我自己能做。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak apa-apa?", "py": "méi shì?", "hz": "没事？", "words": "没 (méi): tidak, 事 (shì): urusan / masalah, 没事 (méi shì): tidak apa-apa", "note": "", "warn": false, "ex": [["Kamu terluka, tidak apa-apa?", "Nǐ shòushāng le, méi shì ma?", "你受伤了，没事吗？"], ["Mesinnya mati tiba-tiba, tidak apa-apa?", "Jī qì tūrán guān le, méi shì ma?", "机器突然关了，没事吗？"], ["Kamu lelah? Tidak apa-apa?", "Nǐ lèi le ma? Méi shì ma?", "你累了吗？没事吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak bisa", "py": "bù huì / bù néng", "hz": "不会 / 不能", "words": "不 (bù): tidak, 会 (huì): bisa, 能 (néng): bisa", "note": "", "warn": false, "ex": [["Saya tidak bisa datang besok.", "Wǒ míngtiān bù néng lái.", "我明天不能来。"], ["Dia tidak bisa berbahasa Mandarin.", "Tā bú huì shuō Zhōngwén.", "他不会说中文。"], ["Mesin ini tidak bisa dipakai.", "Zhè tái jī bù néng yòng.", "这台机不能用。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak boleh", "py": "bù kěyǐ", "hz": "不可以", "words": "不 (bù): tidak, 可以 (kěyǐ): boleh", "note": "", "warn": false, "ex": [["Tidak boleh makan di area produksi.", "Shēngchǎn qūyù bù kěyǐ chī dōngxi.", "生产区域不可以吃东西。"], ["Tidak boleh terlambat.", "Bù kěyǐ chídào.", "不可以迟到。"], ["Tidak boleh masuk tanpa izin.", "Méiyǒu xǔkě bù kěyǐ jìnqù.", "没有许可不可以进去。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak mau", "py": "bú yào", "hz": "不要", "words": "不 (bù): tidak, 要 (yào): mau", "note": "", "warn": false, "ex": [["Saya tidak mau makan itu.", "Wǒ bú yào chī nà ge.", "我不要吃那个。"], ["Dia tidak mau pindah shift.", "Tā bú yào huàn bān.", "他不要换班。"], ["Kalau kamu tidak mau, saya saja.", "Rúguǒ nǐ bú yào, wǒ lái ba.", "如果你不要，我来吧。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak mungkin", "py": "bù kěnéng", "hz": "不可能", "words": "不 (bù): tidak, 可 (kě): dapat, 能 (néng): mungkin, 可能 (kěnéng): mungkin", "note": "", "warn": false, "ex": [["Itu tidak mungkin terjadi.", "Nà bù kěnéng fāshēng.", "那不可能发生。"], ["Tidak mungkin selesai hari ini.", "Jīntiān bù kěnéng wánchéng.", "今天不可能完成。"], ["Tidak mungkin dia lupa.", "Tā bù kěnéng wàng le.", "他不可能忘了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak punya", "py": "méi yǒu", "hz": "没有", "words": "没 (méi): tidak, 有 (yǒu): punya / ada", "note": "", "warn": false, "ex": [["Saya tidak punya uang.", "Wǒ méiyǒu qián.", "我没有钱。"], ["Dia tidak punya pengalaman.", "Tā méiyǒu jīngyàn.", "他没有经验。"], ["Kami tidak punya stok.", "Wǒmen méiyǒu huòcún.", "我们没有库存。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tidak tahu", "py": "bù zhīdào", "hz": "不知道", "words": "不 (bù): tidak, 知道 (zhīdào): tahu", "note": "", "warn": false, "ex": [["Saya tidak tahu harganya.", "Wǒ bù zhīdào jiàgé.", "我不知道价格。"], ["Maaf, saya benar-benar tidak tahu.", "Duìbuqǐ, wǒ zhēn de bù zhīdào.", "对不起，我真的不知道。"], ["Dia tidak tahu jalannya.", "Tā bù zhīdào lù.", "他不知道路。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tiga", "py": "sān", "hz": "三", "words": "三 (sān): tiga", "note": "", "warn": false, "ex": [["Ada tiga mesin di sini.", "Zhèr yǒu sān tái jī.", "这儿有三台机。"], ["Dua tambah satu sama dengan tiga.", "Èr jiā yī děngyú sān.", "二加一等于三。"], ["Tiga orang sudah pulang.", "Sān ge rén huí qù le.", "三个人回去了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tiga belas", "py": "shísān", "hz": "十三", "words": "十 (shí): sepuluh, 三 (sān): tiga", "note": "", "warn": false, "ex": [["Tanggal tiga belas libur.", "Shísān hào fàngjià.", "十三号放假。"], ["Ada tiga belas kotak.", "Yǒu shísān ge xiāngzi.", "有十三个箱子。"], ["Lantai tiga belas tidak dipakai.", "Shísān lóu bù yòng le.", "十三楼不用了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Tolong bantu", "py": "qǐng bāngmáng", "hz": "请帮忙", "words": "请 (qǐng): tolong / mohon, 帮 (bāng): bantu, 忙 (máng): pekerjaan / sibuk, 帮忙 (bāngmáng): membantu", "note": "", "warn": false, "ex": [["Tolong bantu saya angkat kotak ini.", "Qǐng bāng máng bǎ zhè ge xiāngzi nálái.", "请帮忙把这个箱子拿来。"], ["Saya perlu dibantu, operatornya sedikit.", "Wǒ xūyào bāng máng, cāozuòyuán tài shǎo le.", "我需要帮忙，操作员太少了。"], ["Terima kasih sudah tolong bantu.", "Xièxie nǐ de bāngmáng.", "谢谢你的帮忙。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Tolong bantu saya", "py": "bāng wǒ", "hz": "帮我", "words": "帮 (bāng): bantu, 我 (wǒ): saya", "note": "Lebih sopan: 请帮我 qǐng bāng wǒ", "warn": false, "ex": [["Tolong bantu saya, ini berat.", "Bāng wǒ yíxià, zhè ge hěn zhòng.", "帮我一下，这个很重。"], ["Tolong bantu saya cek data ini.", "Bāng wǒ jiǎnchá yíxià zhè xiē shùjù.", "帮我检查一下这些数据。"], ["Tolong bantu saya membawa ini ke gudang.", "Bāng wǒ bǎ zhè ge názǒu dào cāngkù.", "帮我把这个拿到仓库。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tolong ulangi", "py": "qǐng zài shuō yí biàn", "hz": "请再说一遍", "words": "请 (qǐng): tolong, 再 (zài): lagi, 说 (shuō): berbicara, 一遍 (yí biàn): sekali", "note": "", "warn": false, "ex": [["Maaf, tolong ulangi.", "Duìbuqǐ, qǐng zài shuō yí biàn.", "对不起，请再说一遍。"], ["Tolong ulangi nomor mesinnya.", "Qǐng zài shuō yí biàn jī qì hàomǎ.", "请再说一遍机器号码。"], ["Saya tidak dengar, tolong ulangi.", "Wǒ méi tīng qīngchu, qǐng zài shuō yí biàn.", "我没听清楚，请再说一遍。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tujuh", "py": "qī", "hz": "七", "words": "七 (qī): tujuh", "note": "", "warn": false, "ex": [["Ada tujuh orang di shift malam.", "Yè bān yǒu qī ge rén.", "夜班有七个人。"], ["Tujuh hari lagi selesai.", "Qī tiān hòu wánchéng.", "七天后完成。"], ["Nomor mesinnya tujuh.", "Jī qì hàomǎ shì qī.", "机器号码是七。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Tunggu dulu", "py": "děng yíxià", "hz": "等一下", "words": "等 (děng): tunggu, 一下 (yíxià): sebentar / sekali", "note": "", "warn": false, "ex": [["Tunggu dulu, saya belum siap.", "Děng yíxià, wǒ hái méi zhǔnbèi hǎo.", "等一下，我还没准备好。"], ["Tunggu dulu, jangan pergi.", "Děng yíxià, bié zǒu.", "等一下，别走。"], ["Tunggu dulu, saya ambil dokumennya.", "Děng yíxià, wǒ qù ná wénjiàn.", "等一下，我去拿文件。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Tunggu sebentar", "py": "qǐng shāo děng", "hz": "请稍等", "words": "请 (qǐng): mohon, 稍 (shāo): sedikit, 等 (děng): tunggu", "note": "Lebih sopan dari 等一下", "warn": false, "ex": [["Tunggu sebentar, dia sedang rapat.", "Qǐng shāo děng, tā zhèng zài kāi huì.", "请稍等，他正在开会。"], ["Tunggu sebentar di ruang tunggu.", "Qǐng zài děngdàishì shāo děng.", "请在等待室稍等。"], ["Tunggu sebentar, pesanan Anda sedang diproses.", "Qǐng shāo děng, nín de dìngdān zhèng zài chǔlǐ.", "请稍等，您的订单正在处理。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tunggu sebentar", "py": "Děng yíxià", "hz": "等一下", "words": "等 (děng): tunggu, 一下 (yíxià): sebentar", "note": "", "warn": false, "ex": [["Tunggu sebentar, saya datang.", "Děng yíxià, wǒ lái le.", "等一下，我来了。"], ["Tunggu sebentar, hasilnya belum keluar.", "Děng yíxià, jiéguǒ hái méi chūlái.", "等一下，结果还没出来。"], ["Tunggu sebentar ya, saya ambil air.", "Děng yíxià, wǒ qù ná diǎn shuǐ.", "等一下，我去拿点水。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "tutup", "py": "guānshang", "hz": "关上", "words": "关 (guān): tutup, 上 (shang): penanda hasil tindakan, 关上 (guānshang): menutup", "note": "Untuk menutup pintu/penutup", "warn": false, "ex": [["Tolong tutup pintunya.", "Qǐng guānshàng mén.", "请关上门。"], ["Tutup botolnya dengan rapat.", "Bǎ píng gài jǐn guānshàng.", "把瓶盖紧关上。"], ["Jangan lupa tutup mesin setelah dipakai.", "Yòng wán bié wàng le guānshàng jī qì.", "用完别忘了关上机器。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Uang", "py": "qián", "hz": "钱", "words": "钱 (qián): uang", "note": "", "warn": false, "ex": [["Uangnya ada di laci.", "Qián zài chōutì lǐ.", "钱在抽屉里。"], ["Saya tidak punya uang kecil.", "Wǒ méiyǒu língqián.", "我没有零钱。"], ["Uang ini palsu.", "Zhè qián shì jiǎ de.", "这钱是假的。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Untuk kapan?", "py": "shénme shíhou yào?", "hz": "什么时候要？", "words": "什么时候 (shénme shíhou): kapan, 要 (yào): perlu / butuh", "note": "Maksud: dibutuhkan kapan (deadline)", "warn": false, "ex": [["Kamu butuh ini untuk kapan?", "Nǐ shénme shíhou yào zhè ge?", "你什么时候要这个？"], ["Barangnya dibutuhkan untuk kapan?", "Dōngxi shénme shíhou yào?", "东西什么时候要？"], ["Laporan ini dibutuhkan untuk kapan?", "Zhè fèn bàogào shénme shíhou yào?", "这份报告什么时候要？"]]}, {"label": "Kurang umum: Native pabrik lebih sering 紫外曝光 (zǐwài pùguāng). 二次曝光 berarti \"eksposur kedua\".", "id": "UV Exposure/Paparan UV", "py": "èrcì pùguāng", "hz": "二次曝光", "words": "二次 (èrcì): kedua kali, 曝光 (pùguāng): eksposur / penyinaran", "note": "Harfiah \"eksposur kedua\". Padanan literal UV exposure: 紫外曝光 zǐwài pùguāng", "warn": false, "ex": [["Setelah UV exposure, produk harus dicek.", "Èrcì pùguāng hòu, chǎnpǐn yào jiǎnchá.", "二次曝光后，产品要检查。"], ["Mesin UV exposure sedang dikalibrasi.", "Èrcì pùguāng jī zhèng zài jiàozhǔn.", "二次曝光机正在校准。"], ["Hasil UV exposure harus stabil.", "Èrcì pùguāng de jiéguǒ yào wěndìng.", "二次曝光的结果要稳定。"]]}, {"label": "Bukan kalimat: Ini penjelasan, bukan kalimat yang dipakai dalam percakapan. Sebaiknya diganti kalimat aslinya.", "id": "Wǒ berarti \"saya\", bù tài berarti \"kurang begitu\" atau \"tidak begitu\", dan lǐjiě / míngbái berarti \"paham\" atau \"mengerti\"", "py": "Wǒ bù tài lǐjiě.", "hz": "我不太理解。", "words": "我 (wǒ): saya, 不 (bù): tidak, 太 (tài): terlalu, 理解 (lǐjiě): mengerti", "note": "", "warn": false, "ex": [["Saya kurang mengerti.", "Wǒ bù tài lǐjiě.", "我不太理解。"], ["Maaf, saya belum mengerti penjelasanmu.", "Duìbuqǐ, wǒ hái méi lǐjiě nǐ de jiěshì.", "对不起，我还没理解你的解释。"], ["Saya kurang begitu paham, mohon dijelaskan lagi.", "Wǒ bù tài lǐjiě, qǐng zài jiěshì yí cì.", "我不太理解，请再解释一次。"]]}, {"label": "Bukan kalimat: Ini penjelasan, bukan kalimat yang dipakai dalam percakapan. Sebaiknya diganti kalimat aslinya.", "id": "Wǒ berarti \"saya\", bù tài berarti \"kurang begitu\" atau \"tidak begitu\", dan lǐjiě / míngbái berarti \"paham\" atau \"mengerti\"", "py": "Wǒ bú tài míngbái", "hz": "我不太明白", "words": "我 (wǒ): saya, 不 (bú): tidak, 太 (tài): terlalu, 明白 (míngbái): paham", "note": "", "warn": false, "ex": [["Saya masih kurang paham.", "Wǒ hái bú tài míngbái.", "我还不太明白。"], ["Saya tidak begitu mengerti caranya.", "Wǒ bú tài dǒng zěnme zuò.", "我不太懂怎么做。"], ["Mohon jelaskan lagi, saya kurang paham.", "Qǐng zài jiěshì yí cì, wǒ bú tài míngbái.", "请再解释一次，我不太明白。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Ya, ini saja", "py": "shì de, jiù zhè ge", "hz": "是的，就这个。", "words": "是的 (shì de): ya, 就 (jiù): hanya, 这个 (zhè ge): ini", "note": "", "warn": false, "ex": [["Ya, ini saja, terima kasih.", "Shì de, jiù zhè ge, xièxie.", "是的，就这个，谢谢。"], ["Ya, ini saja untuk hari ini.", "Shì de, jīntiān jiù zhè xiē.", "是的，今天就这些。"], ["Ya, ini saja, tidak perlu yang lain.", "Shì de, jiù zhè ge, bú yòng qítā de le.", "是的，就这个，不用其他的了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Saya akan pergi biztrip ke China", "py": "wǒ yào qù Zhōngguó chūchāi", "hz": "我要去中国出差。", "words": "我 (wǒ): saya, 要 (yào): akan, 去 (qù): pergi, 中国 (Zhōngguó): China, 出差 (chūchāi): dinas / perjalanan bisnis", "note": "REVIEW: Bisa dipakai, natural. \"Biztrip\" tidak dipakai native; gunakan 出差 (chūchāi). Pakai 去 (qù), bukan 到 (dào = sampai). 中国 (Zhōngguó) lebih umum dari \"Cina\". Untuk menyebut waktu: 我下个月要去中国出差。 (bulan depan).", "warn": false, "ex": [["Minggu depan saya akan pergi biztrip ke China.", "Xià ge xīngqī wǒ yào qù Zhōngguó chūchāi.", "下个星期我要去中国出差。"], ["Besok saya akan pergi biztrip ke Shanghai.", "Míngtiān wǒ yào qù Shànghǎi chūchāi.", "明天我要去上海出差。"], ["Bos saya akan pergi biztrip ke China bulan depan.", "Wǒ lǎobǎn xià ge yuè yào qù Zhōngguó chūchāi.", "我老板下个月要去中国出差。"]]}, {"label": "Umum: Mandarin tidak membedakan sana dan situ; keduanya 那儿.", "id": "sana", "py": "nàbiān / nàr", "hz": "那边 / 那儿", "words": "那 (nà): itu / sana, 儿 (r): akhiran tempat", "note": "", "warn": false, "ex": [["Tolong letakkan itu sana.", "Qǐng bǎ nà ge fàng nàbiān.", "请把那个放那边。"], ["Kantinnya ada di sana.", "Shítáng zài nàbiān.", "食堂在那边。"], ["Sana ramai sekali.", "Nàbiān hěn rènao.", "那边很热闹。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "sini", "py": "zhèbiān / zhèr", "hz": "这边 / 这儿", "words": "这 (zhè): ini / sini, 儿 (r): akhiran tempat", "note": "", "warn": false, "ex": [["Kemarilah sini.", "Guòlái zhèbiān.", "过来这边。"], ["Taruh barangnya sini saja.", "Dōngxi fàng zhèbiān jiù xíng le.", "东西放这边就行了。"], ["Ada apa di sini?", "Zhèbiān yǒu shénme?", "这边有什么？"]]}, {"label": "Umum: Mandarin tidak membedakan sana dan situ; keduanya 那儿.", "id": "situ", "py": "nàbiān / nàr", "hz": "那边 / 那儿", "words": "那 (nà): itu / situ, 儿 (r): akhiran tempat", "note": "Mandarin tidak membedakan sana dan situ; keduanya 那儿.", "warn": false, "ex": [["Kamu duduk situ saja.", "Nǐ zuò nàbiān ba.", "你坐那边吧。"], ["Sampahnya ada di situ.", "Lājī zài nàbiān.", "垃圾在那边。"], ["Tadi saya lihat dia di situ.", "Gānggāng wǒ zài nàbiān kàn jiàn tā le.", "刚才我在那边看见他了。"]]}, {"label": "Umum: Sama dengan kesitu; Mandarin 去那儿.", "id": "kesana", "py": "qù nàr", "hz": "去那儿", "words": "去 (qù): pergi, 那儿 (nàr): sana", "note": "", "warn": false, "ex": [["Saya mau kesana sekarang.", "Wǒ xiànzài yào qù nàr.", "我现在要去那儿。"], ["Ayo kita kesana bersama.", "Wǒmen yìqǐ qù nàr ba.", "我们一起去那儿吧。"], ["Kamu bisa kesana naik apa?", "Nǐ zěnme qù nàr?", "你怎么去那儿？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "kesini", "py": "lái zhèr", "hz": "来这儿", "words": "来 (lái): datang, 这儿 (zhèr): sini", "note": "", "warn": false, "ex": [["Tolong kesini sebentar.", "Qǐng lái zhèr yíxià.", "请来这儿一下。"], ["Dia akan kesini besok.", "Tā míngtiān lái zhèr.", "他明天来这儿。"], ["Kenapa kamu tadi tidak kesini?", "Nǐ gānggāng wèishénme méi lái zhèr?", "你刚才为什么没来这儿？"]]}, {"label": "Umum: Sama dengan kesana; Mandarin 去那儿.", "id": "kesitu", "py": "qù nàr", "hz": "去那儿", "words": "去 (qù): pergi, 那儿 (nàr): situ", "note": "Sama dengan kesana; Mandarin tidak membedakan.", "warn": false, "ex": [["Saya jalan kesitu dulu.", "Wǒ xiān qù nàr.", "我先去那儿。"], ["Dia pergi kesitu tadi.", "Tā gānggāng qù nàr le.", "他刚才去那儿了。"], ["Mau ke sana, lewat jalan itu, kesitu.", "Yào qù nàr, zǒu nà tiáo lù qù nàr.", "要去那儿，走那条路去那儿。"]]}, {"label": "Umum: Wajar. Di percakapan sehari-hari lebih lazim 这个多少钱？", "id": "Berapa harga barang ini?", "py": "zhè ge dōngxi duōshao qián?", "hz": "这个东西多少钱？", "words": "这个 (zhè ge): ini, 东西 (dōngxi): barang, 多少 (duōshao): berapa, 钱 (qián): uang / harga", "note": "", "warn": false, "ex": [["Tolong beritahu berapa harga barang ini.", "Qǐng gàosu wǒ zhè ge dōngxi duōshao qián.", "请告诉我这个东西多少钱。"], ["Barang ini harganya berapa, bisa kurang?", "Zhè ge dōngxi duōshao qián, kěyǐ piányi yìdiǎn ma?", "这个东西多少钱，可以便宜一点吗？"], ["Berapa harga barang ini untuk pesanan besar?", "Zhè ge dōngxi dà dìngdān duōshao qián?", "这个东西大订单多少钱？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Satu kuai (yuan)", "py": "yī kuài", "hz": "一块", "words": "一 (yī): satu, 块 (kuài): yuan (sehari-hari)", "note": "Dipakai sehari-hari. 元 (yuán) untuk tulisan/formal.", "warn": false, "ex": [["Harganya satu kuai.", "Jiàgé shì yí kuài.", "价格是一块。"], ["Saya bayar satu kuai.", "Wǒ fù yí kuài qián.", "我付一块钱。"], ["Kembaliannya satu kuai.", "Zhǎo nǐ yí kuài.", "找你一块。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Lima kuai", "py": "wǔ kuài", "hz": "五块", "words": "五 (wǔ): lima, 块 (kuài): yuan", "note": "", "warn": false, "ex": [["Harganya lima kuai.", "Jiàgé shì wǔ kuài.", "价格是五块。"], ["Minumannya lima kuai saja.", "Yǐnliào zhǐ yào wǔ kuài.", "饮料只要五块。"], ["Lima kuai, terima kasih.", "Wǔ kuài, xièxie.", "五块，谢谢。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Sepuluh kuai", "py": "shí kuài", "hz": "十块", "words": "十 (shí): sepuluh, 块 (kuài): yuan", "note": "", "warn": false, "ex": [["Makan siangnya sepuluh kuai.", "Wǔfàn shí kuài qián.", "午饭十块钱。"], ["Ongkos taksi sepuluh kuai.", "Dǎchē fèi shì shí kuài.", "打车费是十块。"], ["Sepuluh kuai, ini kembaliannya.", "Shí kuài, zhè shì zhǎo nǐ de qián.", "十块，这是找你的钱。"]]}, {"label": "Umum (sehari-hari): 毛 sering dipakai dalam percakapan sehari-hari (1 mao = 0,1 yuan).", "id": "Satu mao (10 fen)", "py": "yī máo", "hz": "一毛", "words": "一 (yī): satu, 毛 (máo): 0,1 yuan", "note": "", "warn": false, "ex": [["Kembaliannya satu mao.", "Zhǎo nǐ yì máo.", "找你一毛。"], ["Harganya dua kuai satu mao.", "Jiàgé shì liǎng kuài yì máo.", "价格是两块一毛。"], ["Satu mao itu sepuluh fen.", "Yì máo shì shí fēn.", "一毛是十分。"]]}, {"label": "Jarang: Fen hampir tidak dipakai dalam transaksi sehari-hari.", "id": "Satu fen", "py": "yī fēn", "hz": "一分", "words": "一 (yī): satu, 分 (fēn): 0,01 yuan (sen)", "note": "", "warn": false, "ex": [["Satu fen itu sangat kecil.", "Yì fēn qián hěn shǎo.", "一分钱很少。"], ["Di pasar sekarang hampir tidak ada yang pakai satu fen.", "Xiànzài shìchǎng shàng jīhū méiyǒu rén yòng yì fēn qián.", "现在市场上几乎没有人用一分钱。"], ["Harganya tepat sepuluh kuai, tanpa satu fen.", "Jiàgé zhèng hǎo shí kuài, yì fēn yě bú chà.", "价格正好十块，一分也不差。"]]}, {"label": "Formal: Formal/tulisan. Sehari-hari native pakai 块.", "id": "Satu yuan (formal)", "py": "yī yuán", "hz": "一元", "words": "一 (yī): satu, 元 (yuán): yuan (formal)", "note": "", "warn": false, "ex": [["Harga tiket satu yuan.", "Piàojià shì yī yuán.", "票价是一元。"], ["Nilai uangnya tertulis satu yuan.", "Qián shàng xiězhe yī yuán.", "钱上写着一元。"], ["Pajak sebesar satu yuan.", "Shuì'é shì yī yuán.", "税额是一元。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "enam belas (16)", "py": "shíliù", "hz": "十六", "words": "十 (shí): sepuluh, 六 (liù): enam", "note": "", "warn": false, "ex": [["Ada enam belas orang di ruangan.", "Fángjiān lǐ yǒu shíliù ge rén.", "房间里有十六个人。"], ["Umurnya e function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}

function copy(text,btn){
  function done(){var t=btn.textContent;btn.textContent="Tersalin";btn.classList.add("ok");setTimeout(function(){btn.textContent=t;btn.classList.remove("ok")},1200)}
  function fb(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
}
function hl(parent,text,toks){
  if(!toks.length){parent.textContent=text;return}
  var n=norm(text);
  if(n.length!==text.length){parent.textContent=text;return}
  var mask=new Array(text.length).fill(false);
  toks.forEach(function(t){var re=new RegExp(esc(t),"g"),m;while((m=re.exec(n))){for(var k=0;k<t.length;k++)mask[m.index+k]=true;if(m.index===re.lastIndex)re.lastIndex++}});
  var i=0;
  while(i<text.length){
    var j=i;while(j<text.length&&mask[j]===mask[i])j++;
    var seg=text.slice(i,j);
    if(mask[i]){var m=document.createElement("mark");m.textContent=seg;parent.appendChild(m)}else parent.appendChild(document.createTextNode(seg));
    i=j;
  }
}
function tone(l){return /^Bukan/.test(l)?"r":/hati-hati|^Kurang|^Jarang/.test(l)?"y":/pabrik|^Formal/.test(l)?"b":"g"}
function line(label,text,toks,cls){
  var r=el("div","row"),b=el("div"),t=el("div",cls);
  hl(t,text,toks);b.appendChild(t);r.appendChild(b);
  var c=el("button","cp","Salin");c.type="button";c.setAttribute("aria-label","Salin "+label);c.onclick=function(){copy(text,c)};r.appendChild(c);
  return r;
}
function render(){
  var toks=norm($("q").value).split(/\s+/).filter(Boolean);
  var res=rows.filter(function(o){return toks.every(function(t){return o.hay.indexOf(t)>-1})});
  $("info").textContent=res.length+" dari "+rows.length+" entri";
  var L=$("list");L.textContent="";
  if(!res.length){L.appendChild(el("div","empty","Tidak ada hasil. Coba kata kunci lain."));return}
  var frag=document.createDocumentFragment();
  res.slice(0,100).forEach(function(o){
    var c=el("div","card");
    if(o.label)c.appendChild(el("div","lb "+tone(o.label),o.label));
    c.appendChild(line("Indonesia",o.id,toks,"id"));
    var h=line("Hanzi",o.hz,toks,"hz");
    var p=el("div","py");hl(p,o.py,toks);h.firstChild.appendChild(p);
    c.appendChild(h);
    if(o.words){var w=el("div","meta");w.textContent=o.words;c.appendChild(w)}
    if(o.note){var n=el("div","meta");n.textContent=o.note;c.appendChild(n)}
    if(o.ex&&o.ex.length){
      var box=el("div","exs");box.appendChild(el("div","exh","Contoh kalimat"));
      o.ex.forEach(function(e){
        var it=el("div","ex"),a=el("div","ex-id"),b=el("div","ex-py"),z=el("div","ex-hz");
        a.textContent=e[0];b.textContent=e[1];z.textContent=e[2];
        it.appendChild(a);it.appendChild(b);it.appendChild(z);box.appendChild(it);
      });
      box.hidden=true;
      c.appendChild(box);
      var idEl=c.querySelector(".id");
      if(idEl){
        idEl.classList.add("tog");idEl.setAttribute("role","button");idEl.setAttribute("tabindex","0");
        idEl.setAttribute("aria-expanded","false");
        var flip=function(){box.hidden=!box.hidden;idEl.classList.toggle("open",!box.hidden);idEl.setAttribute("aria-expanded",String(!box.hidden))};
        idEl.onclick=flip;
        idEl.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
      }
    }
    frag.appendChild(c);
  });
  L.appendChild(frag);
  if(res.length>100)L.appendChild(el("div","empty","Menampilkan 100 pertama. Persempit pencarian untuk hasil lain."));
}

function wordsOf(o){
  var out=[],m,r1=/([一-鿿][一-鿿A-Za-z0-9\/]*)\s*\(([^)]+)\)\s*:/g,r2=/([^,=()]+?)\s*\(([^)]*[一-鿿][^)]*)\)\s*=/g;
  while((m=r1.exec(o.words||""))){out.push([m[1],m[2].trim()])}
  if(out.length)return out;
  while((m=r2.exec(o.words||""))){out.push([m[2].trim(),m[1].trim()])}
  return out;
}
var all=DECK.filter(function(o){return o.id&&o.py&&o.hz});
all.forEach(function(o){o.w=wordsOf(o)});
var poolB=all.filter(function(o){return o.w.length>=2});
function poolOf(){return mode==="b"?poolB:all}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function same(a,b){return norm(a).replace(/\s+/g,"")===norm(b).replace(/\s+/g,"")}
function nextItem(){if(!deck.length)deck=shuf(poolOf());return deck.pop()}
function score(n){$("sc").textContent=(n>SES?"Sesi selesai":"Soal "+n+" dari "+SES)+" · Benar "+st.ok;$("pgf").style.width=Math.min(st.all,SES)/SES*100+"%"}
function newSession(){st={ok:0,all:0};deck=[];ask()}
function setMode(m){
  mode=m;
  Array.prototype.forEach.call(document.querySelectorAll(".mode"),function(b){b.setAttribute("aria-pressed",b.dataset.m===m)});
  newSession();
}
(function(){
  var box=$("modes");
  Object.keys(MODES).forEach(function(k){
    var b=el("button","mode");b.type="button";b.dataset.m=k;b.setAttribute("aria-pressed",k===mode);
    b.appendChild(el("b",null,MODES[k].t));b.appendChild(el("span",null,MODES[k].d));
    b.onclick=function(){setMode(k)};box.appendChild(b);
  });
})();
/* pilihan jawaban yang mirip dengan soal */
function chars(s){var o={};String(s||"").replace(/[一-鿿]/g,function(c){o[c]=1});return o}
function jac(a,b){var i=0,u=0,k;for(k in a){u++;if(b[k])i++}for(k in b)if(!a[k])u++;return u?i/u:0}
function toks(s){var o={};norm(s).split(/[^a-z0-9]+/).forEach(function(w){if(w.length>2)o[w]=1});return o}
function sim(q,d){
  var s=0;
  if(d.sit&&d.sit===q.sit)s+=2;
  s+=jac(chars(q.hz),chars(d.hz))*5;
  s+=jac(toks(q.id),toks(d.id))*4;
  s+=jac(toks(q.py),toks(d.py))*2;
  if(/[?？]/.test(q.hz)===/[?？]/.test(d.hz))s+=1;
  s+=Math.max(0,1-Math.abs(q.hz.length-d.hz.length)/6);
  return s+Math.random()*0.8;
}
function pickOpts(q){
  var cq=chars(q.hz),tq=toks(q.id);
  /* buang kandidat yang hampir sama artinya dengan soal (bisa ikut benar) */
  var base=poolOf().filter(function(d){return d!==q&&d.hz!==q.hz&&d.py!==q.py&&!same(d.id,q.id)&&!(q.hz.length>3&&jac(cq,chars(d.hz))>=.7)&&!(Object.keys(tq).length>1&&jac(tq,toks(d.id))>=.7)});
  var ranked;
  if(q.val!=null){
    var nums=base.filter(function(d){return d.val!=null&&d.grp===q.grp});
    if(nums.length>=3)ranked=nums.sort(function(a,b){return Math.abs(a.val-q.val)-Math.abs(b.val-q.val)+(Math.random()-.5)*.9}).slice(0,6);
  }
  if(!ranked&&q.grp){
    var same_g=base.filter(function(d){return d.grp===q.grp});
    if(same_g.length>=6)base=same_g;
  }
  if(!ranked)ranked=base.map(function(d){return[sim(q,d),d]}).sort(function(a,b){return b[0]-a[0]}).slice(0,10).map(function(x){return x[1]});
  ranked=shuf(ranked.slice(0,mode==="a"?8:8));
  var opts=[q],seen=[q];
  function dup(s,c){return mode==="a"?same(s.hz,c.hz):same(s.id,c.id)}
  for(var i=0;i<ranked.length&&opts.length<4;i++){
    if(seen.some(function(s){return dup(s,ranked[i])}))continue;
    opts.push(ranked[i]);seen.push(ranked[i]);
  }
  if(opts.length<4){ /* cadangan: acak dari pool */
    shuf(poolOf()).forEach(function(d){if(opts.length<4&&d!==q&&!seen.some(function(s){return dup(s,d)})){opts.push(d);seen.push(d)}});
  }
  return shuf(opts);
}
function summary(){
  var box=$("quiz");box.textContent="";box._pick=null;score(SES+1);
  box.appendChild(el("div","ask","Sesi selesai"));
  box.appendChild(el("p","qt id","Benar "+st.ok+" dari "+SES+" ("+Math.round(st.ok/SES*100)+"%)"));
  var n=el("button","next","Mulai sesi baru");n.type="button";n.onclick=newSession;box.appendChild(n);n.focus();
}
function hzpy(h,p,cls){var s=el("span",cls||"hp");s.appendChild(el("span","oh",h));s.appendChild(el("span","oy",p));return s}
function ask(){
  if(st.all>=SES){summary();return}
  score(st.all+1);
  var q=nextItem(),M=MODES[mode],box=$("quiz");box.textContent="";
  box.appendChild(el("div","ask",M.ask));
  if(mode==="a"){box.appendChild(el("p","qt id",q.id))}
  else if(mode==="b"){
    var wd=el("div","wd");
    q.w.forEach(function(w){var c=el("div","w");c.appendChild(el("div","wh",w[0]));c.appendChild(el("div","wp",w[1]));wd.appendChild(c)});
    box.appendChild(wd);
  }else{box.appendChild(el("p","qt hz",q.hz));box.appendChild(el("p","qt py",q.py))}
  var opts=pickOpts(q);

  var wrap=el("div","opts"),btns=[],done=false,res=el("div","res");
  opts.forEach(function(o,i){
    var b=el("button","opt "+(mode==="a"?"ap":"id"));b.type="button";
    b.appendChild(el("span","k",String(i+1)));
    var t=el("span","t");
    if(mode==="a"){t.appendChild(el("span","oh",o.hz));t.appendChild(el("span","oy",o.py))}else t.textContent=o.id;
    b.appendChild(t);b.onclick=function(){pick(i)};
    btns.push(b);wrap.appendChild(b);
  });
  function pick(i){
    if(done)return;done=true;st.all++;
    var good=opts[i]===q;if(good)st.ok++;
    btns.forEach(function(b,k){b.disabled=true;if(opts[k]===q)b.classList.add("ok");else if(k===i)b.classList.add("no")});
    res.appendChild(el("div","v",good?"Benar.":"Belum tepat."));
    res.appendChild(el("div","hz",q.hz));
    res.appendChild(el("div","py",q.py));
    res.appendChild(el("div","id",q.id));
    if(q.words)res.appendChild(el("div","meta",q.words));
    if(q.note)res.appendChild(el("div","meta",q.note));
    var n=el("button","next",st.all>=SES?"Lihat hasil":"Soal berikutnya");n.type="button";n.onclick=ask;res.appendChild(n);
    score(st.all);n.focus();
  }
  box.appendChild(wrap);box.appendChild(res);
  box._pick=pick;
}
document.addEventListener("keydown",function(e){
  if($("p2").hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=4&&$("quiz")._pick){$("quiz")._pick(n-1)}
});
$("rs").onclick=newSession;
if(all.length>=4){ask()}else $("quiz").appendChild(el("div","empty","Data belum cukup untuk kuis."));
})();
</script>
