<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamus Mandarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#F1F3F4;--line:#DADCE0;--ink:#202124;--mute:#5F6368;--blue:#4285F4;--red:#EA4335;--yel:#FBBC05;--grn:#34A853;--pri:#202124;--pri-ink:#ffffff;--link:#1A73E8;--pyc:#1A73E8;--ok:#188038;--ok-bg:#E6F4EA;--err:#C5221F;--err-bg:#FCE8E6;--mark:#FEEFC3;--hz:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;--font:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.hd{max-width:860px;margin:0 auto;padding:28px 20px 16px}
h1{margin:0;font:700 40px/1.15 var(--font);color:var(--ink)}
h1 .c0,h1 .c1,h1 .c2,h1 .c3{color:var(--ink)}
h1::after{content:"";display:block;width:72px;height:6px;border-radius:3px;background:linear-gradient(90deg,#4285F4 25%,#EA4335 0 50%,#FBBC05 0 75%,#34A853 0);margin-top:12px}
.wrap{max-width:860px;margin:0 auto;padding:8px 20px 48px}
.tabs{display:inline-flex;gap:6px}
.tab{font:700 16px var(--font);background:var(--card);color:var(--mute);border:0;border-radius:999px;padding:6px 20px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--blue);color:#ffffff}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{position:sticky;top:0;background:#ffffff;padding:14px 0 8px;z-index:2}
#q{width:100%;font:inherit;padding:11px 16px;border:2px solid var(--line);border-radius:12px;background:#ffffff;color:var(--ink)}
#q:focus{border-color:var(--blue);outline:none}
#q::placeholder{color:#80868B}
#info{color:var(--mute);font-size:15px;margin:8px 2px 0}
.card{background:var(--card);border-radius:16px;border-left:8px solid var(--blue);padding:16px 20px;margin-top:12px}
.card:has(.lb.g){border-left-color:var(--grn)}
.card:has(.lb.b){border-left-color:var(--blue)}
.card:has(.lb.y){border-left-color:var(--yel)}
.card:has(.lb.r){border-left-color:var(--red)}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:#ffffff;border-radius:10px;padding:8px 14px}
.row+.row{margin-top:6px}
.id{font-size:18px;font-weight:400;color:var(--ink)}
.hz{font:700 24px/1.3 var(--hz);color:var(--ink)}
.py{color:var(--pyc);font-weight:700;font-size:16px}
.meta{color:var(--mute);font-size:15px;margin-top:8px}
.lb{display:inline-block;font:700 14px/1 var(--font);border-radius:999px;padding:5px 12px;margin-bottom:10px;color:#ffffff}
.lb.g{background:var(--grn)}
.lb.b{background:var(--blue)}
.lb.y{background:var(--yel);color:var(--ink)}
.lb.r{background:var(--red)}
button.cp{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:700 14px var(--font);cursor:pointer;min-width:76px}
button.cp:hover{background:var(--line)}
button.cp.ok{background:var(--ok-bg);color:var(--ok)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:40px 12px;font-size:16px}
.score{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:15px;margin-top:12px}
.pg{height:6px;background:var(--card);border-radius:999px;margin-top:10px;overflow:hidden}
#pgf{height:100%;width:0;background:linear-gradient(90deg,#4285F4,#34A853);border-radius:999px;transition:width .3s}
.ask{color:var(--mute);font-size:15px;font-weight:700}
.qt{margin:6px 0 0;word-break:break-word}
.qt.hz{font:700 34px/1.3 var(--hz);color:var(--ink)}
.qt.py{font:700 22px/1.4 var(--font);color:var(--pyc)}
.qt.id{font:400 22px/1.4 var(--font);color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:#ffffff;color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font);background:var(--card);color:var(--mute)}
.opt .t{word-break:break-word}
.opt.hz .t{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt.py .t{color:var(--pyc);font-weight:700}
.opt.ok{background:var(--ok-bg);border-color:var(--grn)}
.opt.ok .t{color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--red)}
.opt.no .t{color:var(--err)}
.opt:disabled{cursor:default}
.res{margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
.res .v{font-weight:700;margin-bottom:6px}
button.next{margin-top:14px;background:var(--blue);color:#ffffff;border:0;border-radius:999px;padding:9px 22px;font:700 16px var(--font);cursor:pointer}
button.next:hover{background:#1A73E8}
button.lnk{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;font-size:15px;font-weight:700}
@media (max-width:480px){.hd,.wrap{padding-left:16px;padding-right:16px}h1{font-size:32px}.hz{font-size:22px}.qt.hz{font-size:30px}}
.exs{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.exh{font:700 13px var(--font);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ex{padding:8px 14px;margin-top:6px;background:#ffffff;border-radius:10px}
.ex:last-child{padding-bottom:8px}
.ex-id{color:var(--ink);font-size:16px}
.ex-py{color:var(--pyc);font-size:15px;font-weight:700}
.ex-hz{color:var(--ink);font:700 18px/1.45 var(--hz)}
.id.tog{cursor:pointer;display:inline-block}
.id.tog::after{content:" \25BE";color:#80868B;font-size:13px}
.id.tog.open::after{content:" \25B4"}
.id.tog:hover{color:var(--link)}
.exs[hidden]{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--mute);margin-top:14px}
.legend b{font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mode{text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mode b{font:700 15px var(--font);color:var(--mute)}
.mode span{font-size:14px;line-height:1.3}
.mode[aria-pressed="true"]{background:#E8F0FE;border-color:var(--blue)}
.mode[aria-pressed="true"] b{color:var(--blue)}
.opt.ap .t{display:flex;flex-direction:column}
.opt .oh{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt .oy{color:var(--pyc);font-weight:700;font-size:15px}
.opt.ok .oh,.opt.ok .oy{color:var(--ok)}.opt.no .oh,.opt.no .oy{color:var(--err)}
.opt.id .t{font-size:17px}
.wd{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.w{background:#ffffff;border-radius:10px;padding:6px 12px;text-align:center}
.wh{font:700 28px/1.3 var(--hz);color:var(--ink)}
.wp{color:var(--pyc);font-weight:700;font-size:15px}
@media (max-width:560px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:center;gap:10px}}
.nav{background:#202124;position:sticky;top:0;z-index:5}
.nav div{max-width:860px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
.nav a{color:#DADCE0;text-decoration:none;font:700 16px var(--font);padding:13px 16px 10px;border-bottom:4px solid transparent}
.nav a:hover{color:#ffffff}
.nav a.on{color:#ffffff;border-bottom-color:#4285F4}
.bar{top:48px}
</style>
</head>

<header class="hd"><h1>Kamus Mandarin</h1><div class="legend"><span style="color:#202124"><b>Indonesia</b></span><span style="color:#1A73E8"><b>Pinyin</b></span><span style="color:#202124"><b>Hanzi</b></span></div></header>
<div class="wrap">
<div class="tabs" role="tablist">
<button class="tab" role="tab" id="t1" aria-selected="true" aria-controls="p1">Kamus</button>
<button class="tab" role="tab" id="t2" aria-selected="false" aria-controls="p2">Latihan</button>
</div>
<section id="p1" role="tabpanel" aria-labelledby="t1">
<div class="bar">
<input id="q" type="search" placeholder="Cari kata: Indonesia, pinyin, atau hanzi…" autocomplete="off">
<div id="info"></div>
</div>
<div id="list"></div>

</section>
</div>
<script>
(function(){
var DATA=[{"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "\"apakah oke?\" atau \"apakah bisa?\"", "py": "Xíng ma?", "hz": "行吗？", "words": "行 (xíng): oke / bisa, 吗 (ma): partikel tanya", "note": "", "warn": false, "ex": [["Kita makan siang jam dua, oke?", "Wǒmen liǎng diǎn chī wǔfàn, xíng ma?", "我们两点吃午饭，行吗？"], ["Kamu pulang dulu, besok saja, oke?", "Nǐ xiān huí qù, míngtiān zài shuō, xíng ma?", "你先回去，明天再说，行吗？"], ["Laporan ini bisa selesai besok, apakah oke?", "Zhè fèn bàogào míngtiān néng wán, xíng ma?", "这份报告明天能完成，行吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "\"Hampir sama\" atau \"Kurang lebih sama\"", "py": "Chàbuduō", "hz": "差不多", "words": "差不多 (chàbuduō): hampir sama; 差 (chà): kurang, 不多 (bùduō): tidak banyak", "note": "", "warn": false, "ex": [["Dua produk ini hampir sama.", "Zhè liǎng ge chǎnpǐn chàbuduō.", "这两个产品差不多。"], ["Hasil tes kami hampir sama.", "Wǒmen de cèshì jiéguǒ chàbuduō.", "我们的测试结果差不多。"], ["Harganya hampir sama dengan kemarin.", "Jiàgé hé zuótiān chàbuduō.", "价格和昨天差不多。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "2 Orang", "py": "liǎng gè rén", "hz": "两个人", "words": "两 (liǎng): dua, 个 (gè): kata penggolong, 人 (rén): orang", "note": "Sebelum kata penggolong pakai 两, bukan 二", "warn": false, "ex": [["Ada dua orang di ruang QC.", "Zhìjiǎn shì yǒu liǎng gè rén.", "质检室有两个人。"], ["Kami butuh dua orang untuk shift malam.", "Yè bān xūyào liǎng gè rén.", "夜班需要两个人。"], ["Tolong siapkan meja untuk dua orang.", "Qǐng zhǔnbèi liǎng gè rén de zhuōzi.", "请准备两个人的桌子。"]]}, {"label": "Umum di pabrik: Dibaca \"sān D cèshì\"; dipakai di komunikasi kerja.", "id": "3D Test/Pengujian 3D", "py": "3D cèshì", "hz": "3D测试", "words": "3D (sān D): tiga dimensi, 测试 (cèshì): pengujian", "note": "Dibaca \"sān D cèshì\"", "warn": false, "ex": [["Mesin 3D test sedang dipakai.", "3D cèshì jī zhèng zài yòng.", "3D测试机正在用。"], ["Hasil 3D test sudah keluar.", "3D cèshì de jiéguǒ chūlái le.", "3D测试的结果出来了。"], ["Setelah optic test, lanjut 3D test.", "Guāngxué cèshì yǐhòu, jìxù 3D cèshì.", "光学测试以后，继续3D测试。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ada", "py": "yǒu", "hz": "有", "words": "有 (yǒu): ada / punya", "note": "", "warn": false, "ex": [["Di sini ada kursi kosong.", "Zhèr yǒu kòng yǐzi.", "这儿有空椅子。"], ["Saya ada waktu sore ini.", "Wǒ jīntiān xiàwǔ yǒu shíjiān.", "我今天下午有时间。"], ["Ada masalah di mesin nomor dua.", "Èr hào jī yǒu wèntí.", "二号机有问题。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ada apa?", "py": "yǒu shénme shì?", "hz": "有什么事？", "words": "有 (yǒu): ada, 什么 (shénme): apa, 事 (shì): urusan / masalah", "note": "", "warn": false, "ex": [["Ada apa? Kenapa kamu terlihat sedih?", "Yǒu shénme shì? Nǐ zěnme kànqǐlái hěn nánguò?", "有什么事？你怎么看起来很难过？"], ["Ada apa di sana?", "Nàbiān yǒu shénme shì?", "那边有什么事？"], ["Ada apa, kok ramai sekali?", "Yǒu shénme shì, zěnme zhème rènao?", "有什么事，怎么这么热闹？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ada tidak?", "py": "yǒu méiyǒu?", "hz": "有没有？", "words": "有 (yǒu): ada, 没有 (méiyǒu): tidak ada", "note": "", "warn": false, "ex": [["Ada tidak kertas?", "Yǒu méiyǒu zhǐ?", "有没有纸？"], ["Ada tidak yang lebih murah?", "Yǒu méiyǒu piányi yìdiǎn de?", "有没有便宜一点的？"], ["Laporan yang kemarin ada tidak?", "Zuótiān de bàogào yǒu méiyǒu?", "昨天的报告有没有？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ada tidak?", "py": "yǒu méiyǒu?", "hz": "有没有", "words": "有 (yǒu): ada, 没有 (méiyǒu): tidak ada", "note": "", "warn": false, "ex": [["Ada tidak orang yang bisa bantu?", "Yǒu méiyǒu rén néng bāng máng?", "有没有人能帮忙？"], ["Ada tidak data bulan Agustus?", "Yǒu méiyǒu bāyuè de shùjù?", "有没有八月的数据？"], ["Ada tidak tempat parkir di sini?", "Zhèr yǒu méiyǒu tíngchē de dìfang?", "这儿有没有停车的地方？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ada?", "py": "yǒu ma?", "hz": "有吗？", "words": "有 (yǒu): ada, 吗 (ma): partikel tanya", "note": "", "warn": false, "ex": [["Ada? Saya tidak dengar.", "Yǒu ma? Wǒ méi tīngjiàn.", "有吗？我没听见。"], ["Masih ada stok, ada?", "Hái yǒu huòcún ma?", "还有库存吗？"], ["Ada orang di dalam?", "Lǐmiàn yǒu rén ma?", "里面有人吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Agustus", "py": "bāyuè", "hz": "八月", "words": "八 (bā): delapan, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Produksi bulan Agustus naik.", "Bāyuè de chǎnliàng shàngshēng le.", "八月的产量上升了。"], ["Laporan Agustus sudah dikirim.", "Bāyuè de bàogào yǐjīng fā chūqù le.", "八月的报告已经发出去了。"], ["Kami mulai shift baru pada Agustus.", "Wǒmen bāyuè kāishǐ xīn de bān.", "我们八月开始新的班。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "apakah boleh?", "py": "Kěyǐ ma?", "hz": "可以吗？", "words": "Kěyǐ berarti \"boleh\" atau \"bisa\", dan ma adalah partikel tanya di akhir kalimat.", "note": "", "warn": false, "ex": [["Saya pulang lebih awal, apakah boleh?", "Wǒ zǎo diǎn huí qù, kěyǐ ma?", "我早点回去，可以吗？"], ["Boleh saya pinjam pena?", "Wǒ kěyǐ jiè yì zhī bǐ ma?", "我可以借一支笔吗？"], ["Apakah boleh foto di area produksi?", "Shēngchǎn qūyù kěyǐ pāizhào ma?", "生产区域可以拍照吗？"]]}, {"label": "Kurang umum: Kalimat panjang; native biasanya cukup 这样做对吗？", "id": "Apakah cara mengerjakannya seperti ini sudah benar?", "py": "Zhèyàng zuò duì ma?", "hz": "这样做对吗？", "words": "Zhèyàng (这样) = Begini / seperti ini, Zuò (做) = Mengerjakan / membuat, Duì (对) = Benar, Ma (吗) = Partikel tanya di akhir kalimat", "note": "", "warn": false, "ex": [["Saya isi kolom dengan cara ini, apakah sudah benar?", "Wǒ zhèyàng tián lán, zhèyàng zuò duì ma?", "我这样填栏，这样做对吗？"], ["Saya cuci komponen dengan cara ini, sudah benar?", "Wǒ zhèyàng xǐ língjiàn, zhèyàng zuò duì ma?", "我这样洗零件，这样做对吗？"], ["Cara kalibrasi seperti ini sudah benar?", "Zhèyàng jiàozhǔn zuò duì ma?", "这样校准做对吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Apakah ini benar?", "py": "zhèyàng duì ma?", "hz": "这样对吗？", "words": "这样 (zhèyàng): seperti ini, 对 (duì): benar, 吗 (ma): partikel tanya", "note": "", "warn": false, "ex": [["Apakah ini benar? Saya sudah cek dua kali.", "Zhèyàng duì ma? Wǒ jiǎnchále liǎng cì.", "这样对吗？我检查了两次。"], ["Apakah ini benar? Tolong cek lagi.", "Zhèyàng duì ma? Qǐng zài jiǎnchá yíxià.", "这样对吗？请再检查一下。"], ["Apakah ini benar, sesuai SOP?", "Zhèyàng duì ma, fúhé SOP ma?", "这样对吗，符合SOP吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Apakah masih ada?", "py": "Hái yǒu ma?", "hz": "还有吗?", "words": "hái (还) berarti \"masih\", dan yǒu (有) berarti \"ada\".", "note": "", "warn": false, "ex": [["Masih ada stok kertas?", "Hái yǒu zhǐ de kùcún ma?", "还有纸的库存吗？"], ["Masih ada waktu sebelum rapat.", "Kāihuì qián hái yǒu shíjiān.", "开会前还有时间。"], ["Masih ada beberapa barang yang belum dikirim.", "Hái yǒu yìxiē dōngxi méi fāchū.", "还有一些东西没发出。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "apakah seperti ini?", "py": "shì zhèyàng ma?", "hz": "是这样吗？", "words": "是 (shì): adalah, 这样 (zhèyàng): seperti ini, 吗 (ma): partikel tanya", "note": "", "warn": false, "ex": [["Apakah seperti ini? Saya tekan tombol merah.", "Shì zhèyàng ma? Wǒ àn le hóngsè de ànniǔ.", "是这样吗？我按了红色的按钮。"], ["Jadi maksudmu seperti ini?", "Suǒyǐ nǐ de yìsi shì zhèyàng ma?", "所以你的意思是这样吗？"], ["Apakah seperti ini saat alarm berbunyi?", "Bàojǐng xiǎng de shíhou shì zhèyàng ma?", "报警响的时候是这样吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Apakah yang ini?", "py": "shì zhè ge ma?", "hz": "是这个吗？", "words": "是 (shì): adalah, 这个 (zhè ge): yang ini, 吗 (ma): partikel tanya", "note": "", "warn": false, "ex": [["Apakah yang ini? Yang biru itu?", "Shì zhè ge ma? Shì nà ge lánsè de ma?", "是这个吗？是那个蓝色的吗？"], ["Apakah yang ini barang yang rusak?", "Shì zhè ge huài le de dōngxi ma?", "是这个坏了的东西吗？"], ["Apakah yang ini sudah diperiksa?", "Shì zhè ge yǐjīng jiǎnchá guò le ma?", "是这个已经检查过了吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "April", "py": "sìyuè", "hz": "四月", "words": "四 (sì): empat, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Kontrak kerja kami mulai April.", "Wǒmen de hétóng sìyuè kāishǐ.", "我们的合同四月开始。"], ["Pelatihan dilakukan bulan April.", "Péixùn zài sìyuè jìnxíng.", "培训在四月进行。"], ["Target April sudah tercapai.", "Sìyuè de mùbiāo yǐjīng dádào le.", "四月的目标已经达到了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Are you Okay/kamu tidak apa-apa?", "py": "nǐ méi shì ba?", "hz": "你没事吧？", "words": "你 (nǐ): kamu, 没事 (méi shì): tidak apa-apa, 吧 (ba): partikel pelembut kalimat", "note": "", "warn": false, "ex": [["Kamu tidak apa-apa? Wajahmu pucat.", "Nǐ méi shì ba? Nǐ liǎnsè hěn bái.", "你没事吧？你脸色很白。"], ["Tadi kamu jatuh, kamu tidak apa-apa?", "Nǐ gānggāng shuāidǎo le, nǐ méi shì ba?", "你刚才摔倒了，你没事吧？"], ["Kamu tidak apa-apa kan, tidak terluka?", "Nǐ méi shì ba, méi shòushāng ba?", "你没事吧，没受伤吧？"]]}, {"label": "Umum di pabrik: Istilah pabrik untuk perakitan konektor.", "id": "Assembly Housing/Perakitan Konektor", "py": "liánjiēqì zǔzhuāng", "hz": "连接器组装", "words": "连接器 (liánjiēqì): konektor, 组装 (zǔzhuāng): perakitan", "note": "", "warn": false, "ex": [["Lini perakitan konektor ada di lantai dua.", "Liánjiēqì zǔzhuāng xiàn zài èr lóu.", "连接器组装线在二楼。"], ["Proses assembly housing harus hati-hati.", "Liánjiēqì zǔzhuāng yào xiǎoxīn.", "连接器组装要小心。"], ["Hasil assembly housing sudah dicek.", "Liánjiēqì zǔzhuāng de jiéguǒ yǐjīng jiǎnchá le.", "连接器组装的结果已经检查了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "atau (kalimat pernyataan)", "py": "huòzhě", "hz": "或者", "words": "或 (huò): atau / mungkin, 者 (zhě): hal / penanda, 或者 (huòzhě): atau (digunakan pada kalimat pernyataan)", "note": "", "warn": false, "ex": [["Kita makan di kantin atau di luar.", "Wǒmen zài shítáng huòzhě zài wàimiàn chī.", "我们在食堂或者在外面吃。"], ["Besok saya ke pabrik atau kirim email saja.", "Míngtiān wǒ qù gōngchǎng huòzhě fā diànzǐ yóujiàn.", "明天我去工厂或者发电子邮件。"], ["Kamu bisa hubungi saya lewat telepon atau pesan.", "Nǐ kěyǐ dǎ diànhuà huòzhě fā xiāoxi lián xì wǒ.", "你可以打电话或者发消息联系我。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "atau (kalimat tanya)", "py": "háishì", "hz": "还是", "words": "还 (hái): masih, 是 (shì): adalah, 还是 (háishì): atau (digunakan pada kalimat pilihan/pertanyaan)", "note": "", "warn": false, "ex": [["Kamu mau makan nasi atau mie?", "Nǐ chī mǐfàn háishì miàn?", "你吃米饭还是面？"], ["Pakai mesin A atau mesin B?", "Yòng A jī háishì B jī?", "用A机还是B机？"], ["Kita pulang sekarang atau nanti?", "Wǒmen xiànzài huí qù háishì děng yíxià?", "我们现在回去还是等一下？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Bahasa Mandarin", "py": "Zhōngwén / Hànyǔ", "hz": "中文 / 汉语", "words": "中文 (Zhōngwén): bahasa Mandarin, 汉语 (Hànyǔ): bahasa Han / Mandarin", "note": "", "warn": false, "ex": [["Saya sedang belajar bahasa Mandarin.", "Wǒ zài xué Zhōngwén.", "我在学中文。"], ["Dia bisa berbicara bahasa Mandarin.", "Tā huì shuō Zhōngwén.", "他会说中文。"], ["Bahasa Mandarin itu sulit tapi menarik.", "Hànyǔ hěn nán, dàn hěn yǒu yìsi.", "汉语很难，但很有意思。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Baik", "py": "hǎo", "hz": "好", "words": "好 (hǎo): baik", "note": "", "warn": false, "ex": [["Baik, saya akan kerjakan sekarang.", "Hǎo, wǒ xiànzài jiù zuò.", "好，我现在就做。"], ["Hasilnya baik sekali.", "Jiéguǒ hěn hǎo.", "结果很好。"], ["Kondisi mesin baik.", "Jī qì zhuàngkuàng hěn hǎo.", "机器状况很好。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Baik, Mr. Ben", "py": "Hǎo de, Mr. Ben", "hz": "好的，Mr. Ben", "words": "好的 (hǎo de): baik / oke; Mr. Ben: nama (tidak diterjemahkan)", "note": "", "warn": false, "ex": [["Baik, Mr. Ben, saya kirim laporannya sore ini.", "Hǎo de, Mr. Ben, wǒ jīntiān xiàwǔ fā bàogào.", "好的，Mr. Ben，我今天下午发报告。"], ["Baik, Mr. Ben, saya tunggu instruksinya.", "Hǎo de, Mr. Ben, wǒ děngzhe nín de zhǐshì.", "好的，Mr. Ben，我等着您的指示。"], ["Baik, Mr. Ben, sampai jumpa besok.", "Hǎo de, Mr. Ben, míngtiān jiàn.", "好的，Mr. Ben，明天见。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "baik, saya paham", "py": "hǎo de, wǒ míngbái le", "hz": "好的，我明白了", "words": "好的 (hǎo de): baik / oke, 我 (wǒ): saya, 明白 (míngbái): paham, 了 (le): partikel selesai", "note": "", "warn": false, "ex": [["Baik, saya paham prosesnya.", "Hǎo de, wǒ míngbái liúchéng le.", "好的，我明白流程了。"], ["Baik, saya paham, saya kerjakan.", "Hǎo de, wǒ míngbái le, wǒ zuò.", "好的，我明白了，我做。"], ["Baik, saya paham maksud Bapak.", "Hǎo de, wǒ míngbái nín de yìsi le.", "好的，我明白您的意思了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "banyak", "py": "duō", "hz": "多", "words": "多 (duō): banyak", "note": "", "warn": false, "ex": [["Hari ini pesanannya banyak sekali.", "Jīntiān dìngdān hěn duō.", "今天订单很多。"], ["Terima kasih banyak atas bantuanmu.", "Duō xiè nǐ de bāng máng.", "多谢你的帮忙。"], ["Ada banyak barang rusak di bagian ini.", "Zhè ge bùfen yǒu hěn duō huài de dōngxi.", "这个部分有很多坏的东西。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "baru", "py": "xīn", "hz": "新", "words": "新 (xīn): baru", "note": "", "warn": false, "ex": [["Mesin ini baru.", "Zhè tái jī shì xīn de.", "这台机是新的。"], ["Saya baru masuk kerja bulan lalu.", "Wǒ shàng ge yuè cái lái shàngbān.", "我上个月才来上班。"], ["Operator baru sedang belajar.", "Xīn cāozuòyuán zhèng zài xuéxí.", "新操作员正在学习。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "bekas", "py": "èrshǒu", "hz": "二手", "words": "二手 (èrshǒu): barang bekas / second-hand", "note": "", "warn": false, "ex": [["Mesin ini bekas, harganya murah.", "Zhè tái jī shì èrshǒu de, jiàgé hěn piányi.", "这台机是二手的，价格很便宜。"], ["Kami beli alat bekas dari supplier.", "Wǒmen cóng gōngyìngshāng mǎi le èrshǒu shèbèi.", "我们从供应商买了二手设备。"], ["Komponen bekas dipisah dari yang baru.", "Èrshǒu língjiàn gēn xīn de fēn kāi fàng.", "二手零件跟新的分开放。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Belum", "py": "hái méi", "hz": "还没", "words": "还 (hái): masih, 没 (méi): belum", "note": "", "warn": false, "ex": [["Laporan sudah selesai? Belum.", "Bàogào wán le ma? Hái méi.", "报告完了吗？还没。"], ["Saya belum makan.", "Wǒ hái méi chī fàn.", "我还没吃饭。"], ["Belum ada hasilnya.", "Hái méiyǒu jiéguǒ.", "还没有结果。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "benar", "py": "duì", "hz": "对", "words": "对 (duì): benar", "note": "", "warn": false, "ex": [["Jawabanmu benar.", "Nǐ de dá'àn duì le.", "你的答案对了。"], ["Benar, data ini sudah sesuai.", "Duì, zhè xiē shùjù fúhé le.", "对，这些数据符合了。"], ["Itu benar sekali.", "Nà hěn duì.", "那很对。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "benar / iya benar", "py": "duì de", "hz": "对的", "words": "对 (duì): benar, 的 (de): partikel penegas, 对的 (duì de): benar / iya", "note": "", "warn": false, "ex": [["Iya benar, begitu caranya.", "Duì de, jiù shì zhèyàng.", "对的，就是这样。"], ["Benar, angkanya sudah sesuai.", "Duì de, shùzì duì le.", "对的，数字对了。"], ["Iya benar, kamu tidak salah.", "Duì de, nǐ méi cuò.", "对的，你没错。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "berapa harganya?", "py": "duōshao qián?", "hz": "多少钱？", "words": "多少 (duōshao): berapa, 钱 (qián): uang / harga", "note": "Pinyin dikoreksi dari \"duìshǎo qián\"", "warn": false, "ex": [["Berapa harganya?", "Duōshao qián?", "多少钱？"], ["Berapa harganya untuk 10 pcs?", "Shí ge duōshao qián?", "十个多少钱？"], ["Tolong beritahu saya berapa harganya.", "Qǐng gàosu wǒ duōshao qián.", "请告诉我多少钱。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Besar", "py": "dà", "hz": "大", "words": "大 (dà): besar", "note": "", "warn": false, "ex": [["Ukuran kotaknya besar.", "Hézi de chǐcun hěn dà.", "盒子的尺寸很大。"], ["Ini mesin yang besar.", "Zhè shì yí tái hěn dà de jī.", "这是一台很大的机。"], ["Ruangan ini besar sekali.", "Zhè ge fángjiān hěn dà.", "这个房间很大。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Besok", "py": "míngtiān", "hz": "明天", "words": "明 (míng): esok, 天 (tiān): hari, 明天 (míngtiān): besok", "note": "", "warn": false, "ex": [["Besok kita rapat jam sembilan.", "Míngtiān wǒmen jiǔ diǎn kāi huì.", "明天我们九点开会。"], ["Besok saya cuti.", "Míngtiān wǒ xiūjià.", "明天我休假。"], ["Kirim laporannya besok pagi.", "Míngtiān zǎoshang bǎ bàogào fā guòlái.", "明天早上把报告发过来。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "bisa", "py": "huì / néng", "hz": "会 / 能", "words": "会 (huì): bisa (karena keahlian/pembelajaran), 能 (néng): bisa (karena kemampuan/kondisi)", "note": "", "warn": false, "ex": [["Saya bisa berbahasa Mandarin sedikit.", "Wǒ huì shuō yìdiǎn Zhōngwén.", "我会说一点中文。"], ["Mesin ini bisa dipakai besok.", "Zhè tái jī míngtiān néng yòng.", "这台机明天能用。"], ["Kamu bisa datang jam berapa?", "Nǐ jǐ diǎn néng lái?", "你几点能来？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "bisakah kamu ulangi?", "py": "nǐ néng zài shuō yí biàn ma?", "hz": "你能再说一遍吗？", "words": "你 (nǐ): kamu, 能 (néng): bisa, 再 (zài): lagi, 说 (shuō): berbicara, 一遍 (yí biàn): sekali, 吗 (ma): partikel tanya", "note": "Diubah ke bentuk tanya agar sesuai kolom B. Bentuk perintah (\"tolong ulangi\"): lihat baris 142", "warn": false, "ex": [["Maaf, bisakah kamu ulangi?", "Duìbuqǐ, nǐ néng zài shuō yí biàn ma?", "对不起，你能再说一遍吗？"], ["Saya tidak dengar, bisakah kamu ulangi?", "Wǒ méi tīng qīngchu, nǐ néng zài shuō yí biàn ma?", "我没听清楚，你能再说一遍吗？"], ["Bisakah kamu ulangi angka yang tadi?", "Nǐ néng zài shuō yí biàn gāngcái de shùzì ma?", "你能再说一遍刚才的数字吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "boleh", "py": "kěyǐ", "hz": "可以", "words": "可 (kě): dapat, 以 (yǐ): boleh, 可以 (kěyǐ): boleh", "note": "", "warn": false, "ex": [["Di sini boleh merokok?", "Zhèr kěyǐ chōuyān ma?", "这儿可以抽烟吗？"], ["Boleh saya pulang sekarang?", "Wǒ xiànzài kěyǐ huí qù ma?", "我现在可以回去吗？"], ["Di area produksi tidak boleh makan.", "Zài shēngchǎn qūyù bù kěyǐ chī dōngxi.", "在生产区域不可以吃东西。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "buka", "py": "dǎkāi", "hz": "打开", "words": "打 (dǎ): melakukan, 开 (kāi): buka, 打开 (dǎkāi): membuka", "note": "Untuk membuka benda/file/pintu", "warn": false, "ex": [["Tolong buka pintu itu.", "Qǐng dǎkāi nà ge mén.", "请打开那个门。"], ["Saya buka file laporan.", "Wǒ dǎkāi le bàogào wénjiàn.", "我打开了报告文件。"], ["Buka mesinnya, sekarang.", "Xiànzài dǎkāi jī qì.", "现在打开机器。"]]}, {"label": "Umum: Umum dalam percakapan.", "id": "bukan", "py": "bú shì", "hz": "不是", "words": "不 (bú): tidak, 是 (shì): adalah", "note": "", "warn": false, "ex": [["Ini bukan punya saya.", "Zhè bú shì wǒ de.", "这不是我的。"], ["Dia bukan operator, dia supervisor.", "Tā bú shì cāozuòyuán, tā shì zhǔguǎn.", "他不是操作员，他是主管。"], ["Bukan begitu caranya.", "Bú shì zhèyàng zuò de.", "不是这样做的。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "bulan depan", "py": "xià ge yuè", "hz": "下个月", "words": "下 (xià): berikutnya, 个 (gè): kata penggolong, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Bulan depan kita mulai produksi baru.", "Xià ge yuè wǒmen kāishǐ xīn de shēngchǎn.", "下个月我们开始新的生产。"], ["Saya akan cuti bulan depan.", "Xià ge yuè wǒ yào xiūjià.", "下个月我要休假。"], ["Target bulan depan lebih tinggi.", "Xià ge yuè de mùbiāo gèng gāo.", "下个月的目标更高。"]]}, {"label": "Umum di pabrik: 老化 dipakai di industri untuk aging/burn-in.", "id": "Burn-in Process/Proses Burn-in", "py": "lǎohuà", "hz": "老化", "words": "老 (lǎo): tua, 化 (huà): proses menjadi, 老化 (lǎohuà): penuaan / burn-in", "note": "Di manufaktur 老化 = aging / burn-in test", "warn": false, "ex": [["Proses burn-in dilakukan selama 24 jam.", "Lǎohuà gōngxù zài èrshísì xiǎoshí nèi jìnxíng.", "老化工序在二十四小时内进行。"], ["Hasil burn-in sudah keluar.", "Lǎohuà de jiéguǒ chūlái le.", "老化的结果出来了。"], ["Mesin burn-in sudah penuh.", "Lǎohuà jī mǎn le.", "老化机满了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Cable Cutting/Pemotongan Kabel", "py": "cáixiàn", "hz": "裁线", "words": "裁 (cái): potong, 线 (xiàn): kabel / kawat, 裁线 (cáixiàn): pemotongan kabel", "note": "", "warn": false, "ex": [["Mesin cable cutting sudah dibersihkan.", "Cáixiàn jī yǐjīng qīngxǐ le.", "裁线机已经清洗了。"], ["Panjang kabel harus benar saat cable cutting.", "Cáixiàn shí xiànchǎng yào zhèngquè.", "裁线时线长要正确。"], ["Operator cable cutting ada di shift pagi.", "Cáixiàn cāozuòyuán zài zǎo bān.", "裁线操作员在早班。"]]}, {"label": "Umum di pabrik: 测试 bersifat umum; native biasanya menyebut nama proses yang spesifik.", "id": "Core Test/Pengujian Core", "py": "cèshì", "hz": "测试", "words": "测 (cè): ukur, 试 (shì): uji, 测试 (cèshì): pengujian", "note": "", "warn": false, "ex": [["Core test harus dilakukan sebelum packaging.", "Cèshì yào zài bāozhuāng zhīqián jìnxíng.", "测试要在包装之前进行。"], ["Hasil core test sudah keluar.", "Cèshì jiéguǒ chūlái le.", "测试结果出来了。"], ["Mesin core test sedang rusak.", "Cèshì jī huài le.", "测试机坏了。"]]}, {"label": "Umum di pabrik: Istilah optik/industri, wajar dipakai di lingkungan kerja.", "id": "Coupling/Penyambungan", "py": "ǒuhé", "hz": "耦合", "words": "耦 (ǒu): berpasangan, 合 (hé): menyatu, 耦合 (ǒuhé): coupling / penyambungan", "note": "", "warn": false, "ex": [["Proses coupling harus presisi.", "Ǒuhé gōngxù yào zhǔnquè.", "耦合工序要准确。"], ["Hasil coupling dicek setiap jam.", "Ǒuhé jiéguǒ měi xiǎoshí jiǎnchá yí cì.", "耦合结果每小时检查一次。"], ["Coupling loss masih di bawah standar.", "Ǒuhé sǔnhào hái zài biāozhǔn yǐxià.", "耦合损耗还在标准以下。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Curing/Pengerasan Lem", "py": "gùhuà", "hz": "固化", "words": "固 (gù): keras / padat, 化 (huà): proses menjadi, 固化 (gùhuà): curing / pengerasan", "note": "", "warn": false, "ex": [["Lem perlu waktu curing sepuluh menit.", "Jiāo xūyào gùhuà shí fēnzhōng.", "胶需要固化十分钟。"], ["Setelah curing, produk harus diperiksa.", "Gùhuà hòu, chǎnpǐn yào jiǎnchá.", "固化后，产品要检查。"], ["Mesin curing sedang panas.", "Gùhuà jī zhèng zài rè.", "固化机正在热。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "delapan", "py": "bā", "hz": "八", "words": "八 (bā): delapan", "note": "", "warn": false, "ex": [["Ada delapan orang di tim.", "Tuánduì yǒu bā gè rén.", "团队有八个人。"], ["Shift ini delapan jam.", "Zhè ge bān shì bā xiǎoshí.", "这个班是八小时。"], ["Nomor mesinnya delapan.", "Jī qì de hàomǎ shì bā.", "机器的号码是八。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Desember", "py": "shí'èryuè", "hz": "十二月", "words": "十二 (shí'èr): dua belas, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Liburan akhir tahun di bulan Desember.", "Niánzhōng jiàqī zài shí'èr yuè.", "年终假期在十二月。"], ["Laporan tahunan dikirim bulan Desember.", "Niándù bàogào zài shí'èr yuè fā chū.", "年度报告在十二月发出。"], ["Kami selesai proyek ini pada Desember.", "Wǒmen shí'èr yuè wánchéng le zhè ge xiàngmù.", "我们十二月完成了这个项目。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Di mana?", "py": "zài nǎr?", "hz": "在哪儿？", "words": "在 (zài): di, 哪儿 (nǎr): mana", "note": "", "warn": false, "ex": [["Di mana toilet?", "Cèsuǒ zài nǎr?", "厕所在哪儿？"], ["Dokumennya di mana?", "Wénjiàn zài nǎr?", "文件在哪儿？"], ["Kamu di mana sekarang?", "Nǐ xiànzài zài nǎr?", "你现在在哪儿？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "dia", "py": "tā", "hz": "他 / 她", "words": "他 (tā): dia (laki-laki), 她 (tā): dia (perempuan)", "note": "", "warn": false, "ex": [["Dia operator baru.", "Tā shì xīn cāozuòyuán.", "他是新操作员。"], ["Dia sudah pulang.", "Tā yǐjīng huí qù le.", "她已经回去了。"], ["Dia sedang rapat sekarang.", "Tā xiànzài zài kāi huì.", "他现在在开会。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "dua", "py": "èr", "hz": "二", "words": "二 (èr): dua", "note": "", "warn": false, "ex": [["Dua orang sudah datang.", "Liǎng ge rén lái le.", "两个人来了。"], ["Saya punya dua anak.", "Wǒ yǒu liǎng ge háizi.", "我有两个孩子。"], ["Dua tambah dua sama dengan empat.", "Èr jiā èr děngyú sì.", "二加二等于四。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "dua belas", "py": "shí'èr", "hz": "十二", "words": "十 (shí): sepuluh, 二 (èr): dua", "note": "", "warn": false, "ex": [["Ada dua belas botol di kotak itu.", "Nà ge hézi lǐ yǒu shí'èr píng.", "那个盒子里有十二瓶。"], ["Shift saya mulai jam dua belas.", "Wǒ de bān shí'èr diǎn kāishǐ.", "我的班十二点开始。"], ["Ada dua belas item yang belum dicek.", "Hái yǒu shí'èr xiàng méi jiǎnchá.", "还有十二项没检查。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "empat", "py": "sì", "hz": "四", "words": "四 (sì): empat", "note": "", "warn": false, "ex": [["Ada empat mesin di lini ini.", "Zhè tiáo xiàn yǒu sì tái jī.", "这条线有四台机。"], ["Empat orang tidak hadir hari ini.", "Jīntiān yǒu sì ge rén méi lái.", "今天有四个人没来。"], ["Empat dikali dua sama dengan delapan.", "Sì chéng èr děngyú bā.", "四乘二等于八。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "empat belas", "py": "shísì", "hz": "十四", "words": "十 (shí): sepuluh, 四 (sì): empat", "note": "", "warn": false, "ex": [["Ada empat belas file di folder ini.", "Zhè ge wénjiànjiā lǐ yǒu shísì ge wénjiàn.", "这个文件夹里有十四个文件。"], ["Tanggal empat belas adalah hari libur.", "Shísì hào shì jiàrì.", "十四号是假日。"], ["Saya bekerja empat belas hari berturut-turut.", "Wǒ liánxù gōngzuò le shísì tiān.", "我连续工作了十四天。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "enam", "py": "liù", "hz": "六", "words": "六 (liù): enam", "note": "", "warn": false, "ex": [["Ada enam orang di ruang rapat.", "Huìyìshì lǐ yǒu liù gè rén.", "会议室里有六个人。"], ["Enam dikurangi dua sama dengan empat.", "Liù jiǎn èr děngyú sì.", "六减二等于四。"], ["Saya bekerja enam hari seminggu.", "Wǒ yí ge xīngqī gōngzuò liù tiān.", "我一个星期工作六天。"]]}, {"label": "Umum di pabrik: 封装 adalah istilah standar di industri.", "id": "Encapsulation/Pengemasan Komponen", "py": "fēngzhuāng", "hz": "封装", "words": "封 (fēng): segel / tutup rapat, 装 (zhuāng): pasang / kemas, 封装 (fēngzhuāng): encapsulation", "note": "", "warn": false, "ex": [["Proses encapsulation dilakukan di ruang bersih.", "Fēngzhuāng gōngxù zài jiégànjìng shì jìnxíng.", "封装工序在洁净室进行。"], ["Setelah encapsulation, produk dites ulang.", "Fēngzhuāng hòu, chǎnpǐn chóngxīn cèshì.", "封装后，产品重新测试。"], ["Mesin encapsulation perlu dibersihkan.", "Fēngzhuāng jī xūyào qīngxǐ.", "封装机需要清洗。"]]}, {"label": "Umum di pabrik: Istilah pabrik; dipakai di dokumen/komunikasi kerja.", "id": "End Face Final Inspection/Inspeksi Akhir Permukaan Ujung Serat", "py": "duānmiàn zhōngjiǎn", "hz": "端面终检", "words": "端面 (duānmiàn): permukaan ujung, 终检 (zhōngjiǎn): inspeksi akhir (终 zhōng: akhir, 检 jiǎn: periksa)", "note": "", "warn": false, "ex": [["Setelah end face final inspection, produk siap dikirim.", "Duānmiàn zhōngjiǎn hòu, chǎnpǐn kěyǐ fāhuò.", "端面终检后，产品可以发货。"], ["Hasil end face final inspection harus dicatat.", "Duānmiàn zhōngjiǎn de jiéguǒ yào jìlù.", "端面终检的结果要记录。"], ["Operator end face final inspection ada dua orang.", "Duānmiàn zhōngjiǎn cāozuòyuán yǒu liǎng gè rén.", "端面终检操作员有两个人。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "End Face Inspection/Inspeksi Permukaan Ujung Serat", "py": "duānmiàn jiǎnchá", "hz": "端面检查", "words": "端面 (duānmiàn): permukaan ujung (end face), 检查 (jiǎnchá): inspeksi", "note": "", "warn": false, "ex": [["Lakukan end face inspection sebelum coupling.", "Ǒuhé qián jìnxíng duānmiàn jiǎnchá.", "耦合前进行端面检查。"], ["Hasil end face inspection ada yang tidak lolos.", "Duānmiàn jiǎnchá yǒu yìxiē bù hégé.", "端面检查有一些不合格。"], ["Mikroskop untuk end face inspection sudah dikalibrasi.", "Yòng yú duānmiàn jiǎnchá de xiǎnwēijìng yǐjīng jiàozhǔn le.", "用于端面检查的显微镜已经校准了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Februari", "py": "èryuè", "hz": "二月", "words": "二 (èr): dua, 月 (yuè): bulan", "note": "Pada kolom B tertulis \"Fabruari\" → seharusnya \"Februari\"", "warn": false, "ex": [["Proyek ini selesai pada bulan Februari.", "Zhè ge xiàngmù èryuè wánchéng.", "这个项目二月完成。"], ["Libur Imlek biasanya di bulan Februari.", "Chūnjié tōngcháng zài èryuè.", "春节通常在二月。"], ["Pelatihan dimulai Februari tahun depan.", "Míngnián èryuè kāishǐ péixùn.", "明年二月开始培训。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Fiber splitting/Pemisahan Fiber", "py": "fēnxiān", "hz": "分纤", "words": "分 (fēn): pisah, 纤 (xiān): serat / fiber, 分纤 (fēnxiān): pemisahan fiber", "note": "", "warn": false, "ex": [["Fiber splitting harus hati-hati agar tidak patah.", "Fēnxiān yào xiǎoxīn, bié duàn le.", "分纤要小心，别断了。"], ["Hasil fiber splitting sudah dicek.", "Fēnxiān de jiéguǒ yǐjīng jiǎnchá le.", "分纤的结果已经检查了。"], ["Mesin fiber splitting sedang dipakai.", "Fēnxiān jī zhèng zài yòng.", "分纤机正在用。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Fiber Stripping/Pengupasan Serat", "py": "bāoxiān", "hz": "剥纤", "words": "剥 (bāo): kupas, 纤 (xiān): serat / fiber, 剥纤 (bāoxiān): pengupasan serat", "note": "剥 dibaca bāo (lisan) atau bō (formal); di pabrik umumnya bāo", "warn": false, "ex": [["Fiber stripping dilakukan sebelum pemotongan.", "Bāoxiān zài qiēduàn qián jìnxíng.", "剥纤在切断前进行。"], ["Gunakan alat fiber stripping yang tajam.", "Yòng jiānlì de bāoxiān qì.", "用尖利的剥纤器。"], ["Setelah fiber stripping, serat dibersihkan.", "Bāoxiān hòu, bǎ xiān qīngxǐ gānjìng.", "剥纤后，把纤清洗干净。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Glue Injection/Injeksi Lem", "py": "zhùjiāo", "hz": "注胶", "words": "注 (zhù): tuang / injeksi, 胶 (jiāo): lem, 注胶 (zhùjiāo): injeksi lem", "note": "", "warn": false, "ex": [["Glue injection harus sesuai takaran.", "Zhùjiāo yào àn fènliàng jìnxíng.", "注胶要按份量进行。"], ["Mesin glue injection sedang dibersihkan.", "Zhùjiāo jī zhèng zài qīngxǐ.", "注胶机正在清洗。"], ["Setelah glue injection, produk dimasukkan oven.", "Zhùjiāo hòu, bǎ chǎnpǐn fàng jìn hōngxiāng.", "注胶后，把产品放进烘箱。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Guru", "py": "lǎoshī", "hz": "老师", "words": "老 (lǎo): tua / senior, 师 (shī): guru, 老师 (lǎoshī): guru", "note": "", "warn": false, "ex": [["Dia guru bahasa Mandarin saya.", "Tā shì wǒ de Zhōngwén lǎoshī.", "他是我的中文老师。"], ["Guru itu sangat sabar.", "Nà wèi lǎoshī hěn yǒu nàixīn.", "那位老师很有耐心。"], ["Saya bertanya kepada guru.", "Wǒ wèn lǎoshī.", "我问老师。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Halo", "py": "nǐ hǎo", "hz": "你好", "words": "你 (nǐ): kamu, 好 (hǎo): baik", "note": "", "warn": false, "ex": [["Halo, apa kabar?", "Nǐ hǎo, nǐ hǎo ma?", "你好，你好吗？"], ["Halo, selamat datang di pabrik.", "Nǐ hǎo, huānyíng lái dào gōngchǎng.", "你好，欢迎来到工厂。"], ["Halo, apakah ini Pak Wang?", "Nǐ hǎo, shì Wáng xiānsheng ma?", "你好，是王先生吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Hari apa?", "py": "jīntiān xīngqī jǐ?", "hz": "今天星期几？", "words": "今天 (jīntiān): hari ini, 星期 (xīngqī): minggu / hari, 几 (jǐ): berapa", "note": "", "warn": false, "ex": [["Besok hari apa?", "Míngtiān xīngqī jǐ?", "明天星期几？"], ["Rapatnya hari apa?", "Huìyì shì xīngqī jǐ?", "会议是星期几？"], ["Hari ini hari apa?", "Jīntiān xīngqī jǐ?", "今天星期几？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "hari ini", "py": "jīntiān", "hz": "今天", "words": "今天 (jīntiān): hari ini", "note": "", "warn": false, "ex": [["Hari ini saya libur.", "Jīntiān wǒ xiūxi.", "今天我休息。"], ["Hari ini cuacanya panas.", "Jīntiān tiānqì hěn rè.", "今天天气很热。"], ["Hari ini target produksi tercapai.", "Jīntiān de shēngchǎn mùbiāo wánchéng le.", "今天的生产目标完成了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Hasilnya sama saja", "py": "Jiéguǒ dōu yíyàng", "hz": "结果都一样", "words": "结果 (jiéguǒ): hasil, 都 (dōu): semua, 一样 (yíyàng): sama", "note": "", "warn": false, "ex": [["Mau pakai merek A atau B, hasilnya sama saja.", "Yòng A pái háishì B pái, jiéguǒ dōu yíyàng.", "用A牌还是B牌，结果都一样。"], ["Dicek dua kali atau sekali, hasilnya sama saja.", "Jiǎnchá liǎng cì huòzhě yí cì, jiéguǒ dōu yíyàng.", "检查两次或一次，结果都一样。"], ["Pakai kertas atau digital, hasilnya sama saja.", "Yòng zhǐ háishì diànzǐ, jiéguǒ dōu yíyàng.", "用纸还是电子，结果都一样。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "I am okay/saya tidak apa-apa", "py": "wǒ méi shì", "hz": "我没事", "words": "我 (wǒ): saya, 没事 (méi shì): tidak apa-apa", "note": "", "warn": false, "ex": [["Saya tidak apa-apa, jangan khawatir.", "Wǒ méi shì, bié dānxīn.", "我没事，别担心。"], ["Saya tidak apa-apa, hanya sedikit lelah.", "Wǒ méi shì, zhǐshì yǒu diǎn lèi.", "我没事，只是有点累。"], ["Tadi saya jatuh, tapi saya tidak apa-apa.", "Gāngcái wǒ shuāidǎo le, dàn wǒ méi shì.", "刚才我摔倒了，但我没事。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ini", "py": "zhè / zhè gè", "hz": "这 / 这个", "words": "这 (zhè): ini, 个 (gè): kata penggolong umum", "note": "", "warn": false, "ex": [["Ini milik saya.", "Zhè shì wǒ de.", "这是我的。"], ["Ini laporan yang kemarin.", "Zhè shì zuótiān de bàogào.", "这是昨天的报告。"], ["Ini harga yang benar.", "Zhè shì zhèngquè de jiàgé.", "这是正确的价格。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ini apa?", "py": "zhè shì shénme?", "hz": "这是什么？", "words": "这 (zhè): ini, 是 (shì): adalah, 什么 (shénme): apa", "note": "", "warn": false, "ex": [["Ini apa?", "Zhè shì shénme?", "这是什么？"], ["Ini apa, kok warnanya merah?", "Zhè shì shénme, zěnme shì hóngsè de?", "这是什么，怎么是红色的？"], ["Ini apa di dalam kotak?", "Hézi lǐ de zhè shì shénme?", "盒子里的这是什么？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Ini berapa? (menanyakan harga)", "py": "zhè duōshao qián?", "hz": "这多少钱？", "words": "这 (zhè): ini, 多少 (duōshao): berapa, 钱 (qián): harga / uang", "note": "", "warn": false, "ex": [["Ini berapa harganya?", "Zhè duōshao qián?", "这多少钱？"], ["Ini berapa, kok mahal sekali?", "Zhè duōshao qián, zěnme zhème guì?", "这多少钱，怎么这么贵？"], ["Saya mau beli ini, berapa?", "Wǒ xiǎng mǎi zhè ge, duōshao qián?", "我想买这个，多少钱？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Ini saja?", "py": "jiù zhè ge ma?", "hz": "就这个吗？", "words": "就 (jiù): hanya, 这个 (zhè ge): ini, 吗 (ma): partikel tanya", "note": "", "warn": false, "ex": [["Mau pesan ini saja?", "Jiù yào zhè ge ma?", "就要这个吗？"], ["Belanjanya ini saja?", "Mǎi de jiù zhè xiē ma?", "买的就这些吗？"], ["Cukup ini saja?", "Jiù zhè ge gòu le ma?", "就这个够了吗？"]]}, {"label": "Kurang umum: Istilah ini tidak baku di pabrik; cek istilah yang dipakai tim.", "id": "Inner shell cleaning/Pembersihan Selongsong Dalam", "py": "nèiké qīngxǐ", "hz": "内壳清洗", "words": "内 (nèi): dalam, 壳 (ké): selongsong / cangkang, 清洗 (qīngxǐ): pembersihan / cuci", "note": "", "warn": false, "ex": [["Inner shell cleaning dilakukan sebelum assembly.", "Nèiké qīngxǐ zài zǔzhuāng qián jìnxíng.", "内壳清洗在组装前进行。"], ["Hasil inner shell cleaning harus bersih.", "Nèiké qīngxǐ de jiéguǒ yào gānjìng.", "内壳清洗的结果要干净。"], ["Mesin inner shell cleaning sudah diperbaiki.", "Nèiké qīngxǐ jī yǐjīng xiūlǐ hǎo le.", "内壳清洗机已经修理好了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "itu", "py": "nà / nà gè", "hz": "那 / 那个", "words": "那 (nà): itu, 个 (gè): kata penggolong umum", "note": "", "warn": false, "ex": [["Itu punya siapa?", "Nà shì shéi de?", "那是谁的？"], ["Itu bukan masalah.", "Nà bú shì wèntí.", "那不是问题。"], ["Ambil itu di meja.", "Bǎ nà ge ná dào zhuōzi shàng.", "把那个拿到桌子上。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "iya", "py": "shì / duì", "hz": "是 / 对", "words": "是 (shì): iya / adalah, 对 (duì): benar / iya", "note": "", "warn": false, "ex": [["Iya, saya tahu.", "Duì, wǒ zhīdào.", "对，我知道。"], ["Iya, sudah saya kirim.", "Shì, wǒ yǐjīng fā le.", "是，我已经发了。"], ["Iya, benar begitu.", "Duì, jiù shì zhèyàng.", "对，就是这样。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Jam berapa sekarang?", "py": "xiànzài jǐ diǎn le?", "hz": "现在几点了？", "words": "现在 (xiànzài): sekarang, 几 (jǐ): berapa, 点 (diǎn): jam, 了 (le): partikel", "note": "", "warn": false, "ex": [["Permisi, jam berapa sekarang?", "Qǐngwèn, xiànzài jǐ diǎn le?", "请问，现在几点了？"], ["Jam berapa sekarang, kita sudah telat?", "Xiànzài jǐ diǎn le, wǒmen chídào le ma?", "现在几点了，我们迟到了吗？"], ["Jam berapa sekarang? Rapat mulai jam tiga.", "Xiànzài jǐ diǎn le? Huìyì sān diǎn kāishǐ.", "现在几点了？会议三点开始。"]]}, {"label": "Umum (tulisan): Dipakai di tulisan/kalender; lisan sehari-hari lebih sering 一月 (sama) tapi tanggal biasanya dibaca 号.", "id": "Januari", "py": "yīyuè", "hz": "一月", "words": "一 (yī): satu, 月 (yuè): bulan", "note": "Nama bulan = angka + 月", "warn": false, "ex": [["Kontrak baru mulai bulan Januari.", "Xīn hétóng yīyuè kāishǐ.", "新合同一月开始。"], ["Pabrik libur pada bulan Januari.", "Gōngchǎng yīyuè fàngjià.", "工厂一月放假。"], ["Laporan tahunan dibuat pada bulan Januari.", "Niándù bàogào yīyuè zhìzuò.", "年度报告一月制作。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Juli", "py": "qīyuè", "hz": "七月", "words": "七 (qī): tujuh, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Produksi besar di bulan Juli.", "Qīyuè shēngchǎn hěn duō.", "七月生产很多。"], ["Libur panjang bulan Juli.", "Qīyuè yǒu cháng jià.", "七月有长假。"], ["Audit dilakukan Juli nanti.", "Qīyuè jìnxíng shěnjì.", "七月进行审计。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Jumat", "py": "xīngqīwǔ", "hz": "星期五", "words": "星期 (xīngqī): minggu / hari, 五 (wǔ): lima", "note": "", "warn": false, "ex": [["Rapat mingguan hari Jumat.", "Měi zhōu de huìyì zài xīngqīwǔ.", "每周的会议在星期五。"], ["Saya pulang lebih awal hari Jumat.", "Xīngqīwǔ wǒ zǎo diǎn xià bān.", "星期五我早点下班。"], ["Laporan harus dikirim paling lambat hari Jumat.", "Bàogào zuì wǎn xīngqīwǔ yào fā chū.", "报告最晚星期五要发出。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Juni", "py": "liùyuè", "hz": "六月", "words": "六 (liù): enam, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Kami mulai pelatihan bulan Juni.", "Wǒmen liùyuè kāishǐ péixùn.", "我们六月开始培训。"], ["Produksi naik sejak Juni.", "Cóng liùyuè qǐ, chǎnliàng zēngjiā le.", "从六月起，产量增加了。"], ["Liburan sekolah bulan Juni.", "Xuéxiào zài liùyuè fàngjià.", "学校在六月放假。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "kami", "py": "wǒmen", "hz": "我们", "words": "我 (wǒ): saya, 们 (men): penanda jamak", "note": "", "warn": false, "ex": [["Kami sudah selesai mengerjakannya.", "Wǒmen zuò wán le.", "我们做完了。"], ["Kami akan rapat jam dua.", "Wǒmen liǎng diǎn kāi huì.", "我们两点开会。"], ["Kami dari tim QC.", "Wǒmen shì zhìjiǎn tuánduì de.", "我们是质检团队的。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Kamis", "py": "xīngqīsì", "hz": "星期四", "words": "星期 (xīngqī): minggu / hari, 四 (sì): empat", "note": "", "warn": false, "ex": [["Rapat diundur ke hari Kamis.", "Huìyì tuīchí dào xīngqīsì.", "会议推迟到星期四。"], ["Kamis depan saya cuti.", "Xià ge xīngqīsì wǒ xiūjià.", "下个星期四我休假。"], ["Kamis sore kita evaluasi.", "Xīngqīsì xiàwǔ wǒmen pínggū.", "星期四下午我们评估。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "kamu", "py": "nǐ", "hz": "你", "words": "你 (nǐ): kamu", "note": "", "warn": false, "ex": [["Kamu sudah makan?", "Nǐ chī fàn le ma?", "你吃饭了吗？"], ["Kamu mau ke mana?", "Nǐ yào qù nǎr?", "你要去哪儿？"], ["Kamu bisa membantu saya?", "Nǐ néng bāng wǒ ma?", "你能帮我吗？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "kamu hebat", "py": "nǐ zhēn bàng", "hz": "你真棒", "words": "你 (nǐ): kamu, 真 (zhēn): sungguh, 棒 (bàng): hebat / keren", "note": "Pujian santai, sangat umum", "warn": false, "ex": [["Kamu hebat, hasilnya bagus sekali!", "Nǐ zhēn bàng, jiéguǒ hěn hǎo!", "你真棒，结果很好！"], ["Kerjaanmu hebat, terus semangat!", "Nǐ de gōngzuò zhēn bàng, jiāyóu!", "你的工作真棒，加油！"], ["Presentasimu hebat sekali.", "Nǐ de bàogào zuò de zhēn bàng.", "你报告做得真棒。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "kamu Jago", "py": "nǐ hěn lìhai", "hz": "你很厉害", "words": "你 (nǐ): kamu, 很 (hěn): sangat, 厉害 (lìhai): jago / hebat", "note": "厉害 = jago / hebat (skill)", "warn": false, "ex": [["Kamu jago sekali memperbaiki mesin.", "Nǐ xiūlǐ jī qì hěn lìhai.", "你修理机器很厉害。"], ["Kamu jago bahasa Mandarin ya?", "Nǐ Hànyǔ hěn lìhai ba?", "你汉语很厉害吧？"], ["Kamu jago sekali di bidang ini.", "Nǐ zài zhè ge lǐngyù hěn lìhai.", "你在这个领域很厉害。"]]}, {"label": "Umum (hati-hati): Bisa dipakai, tetapi terdengar seperti sindiran atau pertanyaan pribadi; hindari di percakapan biasa.", "id": "Kamu kaya", "py": "nǐ hěn yǒuqián", "hz": "你很有钱", "words": "你 (nǐ): kamu, 很 (hěn): sangat, 有钱 (yǒuqián): kaya / punya uang", "note": "", "warn": false, "ex": [["Kamu kaya ya, rumahmu besar.", "Nǐ hěn yǒuqián ba, nǐ de fángzi hěn dà.", "你很有钱吧，你的房子很大。"], ["Dia bilang kamu kaya.", "Tā shuō nǐ hěn yǒuqián.", "他说你很有钱。"], ["Walaupun kamu kaya, kamu tetap rendah hati.", "Suīrán nǐ hěn yǒuqián, dàn hěn qiānxū.", "虽然你很有钱，但很谦虚。"]]}, {"label": "Cukup umum: Dipakai untuk memuji kemampuan kerja; lebih lazim 你很厉害 atau 你很能干.", "id": "kamu pandai", "py": "nǐ hěn nénggàn", "hz": "你很能干", "words": "你 (nǐ): kamu, 很 (hěn): sangat, 能干 (nénggàn): pandai / cakap bekerja", "note": "能干 = pandai/cakap dalam bekerja", "warn": false, "ex": [["Kamu pandai bekerja dengan tim.", "Nǐ hěn nénggàn, néng hé tuánduì hézuò.", "你很能干，能和团队合作。"], ["Kamu pandai sekali mengatur jadwal.", "Nǐ ānpái rìchéng hěn nénggàn.", "你安排日程很能干。"], ["Dia pandai memperbaiki mesin.", "Tā hěn nénggàn, huì xiū jī qì.", "他很能干，会修机器。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "kamu pintar", "py": "nǐ hěn cōngmíng", "hz": "你很聪明", "words": "你 (nǐ): kamu, 很 (hěn): sangat, 聪明 (cōngmíng): pintar", "note": "", "warn": false, "ex": [["Kamu pintar, cepat sekali belajarnya.", "Nǐ hěn cōngmíng, xuéxí hěn kuài.", "你很聪明，学习很快。"], ["Anak itu pintar sekali.", "Nà ge háizi hěn cōngmíng.", "那个孩子很聪明。"], ["Kamu pintar menyelesaikan masalah ini.", "Nǐ hěn cōngmíng, jiějué le zhè ge wèntí.", "你很聪明，解决了这个问题。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Kapan?", "py": "shénme shíhou?", "hz": "什么时候？", "words": "什么 (shénme): apa, 时候 (shíhou): waktu", "note": "", "warn": false, "ex": [["Kita mulai kapan?", "Wǒmen shénme shíhou kāishǐ?", "我们什么时候开始？"], ["Kapan laporannya selesai?", "Bàogào shénme shíhou wán?", "报告什么时候完？"], ["Kapan kamu pulang?", "Nǐ shénme shíhou huí jiā?", "你什么时候回家？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "ke mana?", "py": "qù nǎr?", "hz": "去哪儿？", "words": "去 (qù): pergi, 哪儿 (nǎr): mana", "note": "", "warn": false, "ex": [["Kamu mau pergi ke mana?", "Nǐ yào qù nǎr?", "你要去哪儿？"], ["Mau ke mana sekarang?", "Xiànzài qù nǎr?", "现在去哪儿？"], ["Ke mana perginya minggu depan?", "Xià ge xīngqī qù nǎr?", "下个星期去哪儿？"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Kecil", "py": "xiǎo", "hz": "小", "words": "小 (xiǎo): kecil", "note": "Pinyin dilengkapi tanda nada", "warn": false, "ex": [["Ukuran produk ini kecil.", "Zhè ge chǎnpǐn de chǐcun hěn xiǎo.", "这个产品的尺寸很小。"], ["Anak itu masih kecil.", "Nà ge háizi hái hěn xiǎo.", "那个孩子还很小。"], ["Ruangannya terlalu kecil.", "Fángjiān tài xiǎo le.", "房间太小了。"]]}, {"label": "Umum (barang): Untuk barang, 旧 wajar. Untuk durasi (\"sudah lama\"), native pakai 很久 (hěn jiǔ) atau 长时间.", "id": "lama", "py": "jiù", "hz": "旧", "words": "旧 (jiù): lama / bekas (untuk barang)", "note": "", "warn": false, "ex": [["Mesin ini sudah lama, sering rusak.", "Zhè tái jī hěn jiù le, chángcháng huài.", "这台机很旧了，常常坏。"], ["Baju ini sudah lama, tapi masih bagus.", "Zhè jiàn yīfu hěn jiù le, dàn hái hěn hǎo.", "这件衣服很旧了，但还很好。"], ["Kertas lama dipisahkan dari yang baru.", "Jiù zhǐ hé xīn zhǐ fēnkāi fàng.", "旧纸和新纸分开放。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "lima", "py": "wǔ", "hz": "五", "words": "五 (wǔ): lima", "note": "", "warn": false, "ex": [["Ada lima orang di shift pagi.", "Zǎo bān yǒu wǔ gè rén.", "早班有五个人。"], ["Lima tambah tiga sama dengan delapan.", "Wǔ jiā sān děngyú bā.", "五加三等于八。"], ["Lima menit lagi rapat dimulai.", "Wǔ fēnzhōng hòu huìyì kāishǐ.", "五分钟后会议开始。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "lima belas", "py": "shíwǔ", "hz": "十五", "words": "十 (shí): sepuluh, 五 (wǔ): lima", "note": "", "warn": false, "ex": [["Ada lima belas kotak di gudang.", "Cāngkù lǐ yǒu shíwǔ ge xiāngzi.", "仓库里有十五个箱子。"], ["Lima belas menit lagi istirahat.", "Shíwǔ fēnzhōng hòu xiūxi.", "十五分钟后休息。"], ["Tanggal lima belas gajian.", "Shíwǔ hào fā gōngzī.", "十五号发工资。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Lusa", "py": "hòutiān", "hz": "后天", "words": "后 (hòu): setelah, 天 (tiān): hari, 后天 (hòutiān): lusa", "note": "", "warn": false, "ex": [["Lusa saya ke Shenzhen.", "Hòutiān wǒ qù Shēnzhèn.", "后天我去深圳。"], ["Laporannya lusa baru jadi.", "Bàogào hòutiān cái wánchéng.", "报告后天才完成。"], ["Lusa kita evaluasi hasilnya.", "Hòutiān wǒmen pínggū jiéguǒ.", "后天我们评估结果。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "maaf", "py": "duìbùqǐ", "hz": "对不起", "words": "对不起 (duìbuqǐ): maaf", "note": "", "warn": false, "ex": [["Maaf, saya terlambat.", "Duìbuqǐ, wǒ chídào le.", "对不起，我迟到了。"], ["Maaf, saya tidak bisa datang.", "Duìbuqǐ, wǒ bù néng lái.", "对不起，我不能来。"], ["Maaf sudah menunggu lama.", "Duìbuqǐ, ràng nǐ děng le hěn jiǔ.", "对不起，让你等了很久。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Mahal", "py": "guì", "hz": "贵", "words": "贵 (guì): mahal", "note": "", "warn": false, "ex": [["Harga mesin ini mahal sekali.", "Zhè tái jī de jiàgé hěn guì.", "这台机的价格很贵。"], ["Sayur di pasar sekarang "Saya kurang begitu paham angka ini.", "Wǒ bú tài míngbái zhè xiē shùzì.", "我不太明白这些数字。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "mati", "py": "guān", "hz": "关", "words": "关 (guān): mematikan / menutup", "note": "Contoh: 关机 (guānjī) matikan mesin, 关灯 (guān dēng) matikan lampu", "warn": false, "ex": [["Tolong matikan mesinnya.", "Qǐng guān diào jī qì.", "请关掉机器。"], ["Matikan lampu, tolong.", "Qǐng guān dēng.", "请关灯。"], ["Mesin itu mati tiba-tiba.", "Nà tái jī tūrán guān le.", "那台机突然关了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "mau", "py": "yào", "hz": "要", "words": "要 (yào): mau / ingin", "note": "", "warn": false, "ex": [["Saya mau kopi.", "Wǒ yào kāfēi.", "我要咖啡。"], ["Kamu mau pulang sekarang?", "Nǐ xiànzài yào huí qù ma?", "你现在要回去吗？"], ["Saya mau belajar bahasa Mandarin.", "Wǒ yào xué Zhōngwén.", "我要学中文。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Mei", "py": "wǔyuè", "hz": "五月", "words": "五 (wǔ): lima, 月 (yuè): bulan", "note": "", "warn": false, "ex": [["Pameran besar diadakan bulan Mei.", "Dà zhǎnlǎn zài wǔyuè jǔxíng.", "大展览在五月举行。"], ["Produksi bulan Mei naik.", "Wǔyuè de chǎnliàng zēngjiā le.", "五月的产量增加了。"], ["Liburan Mei sudah dekat.", "Wǔyuè de jiàqī kuài dào le.", "五月的假期快到了。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "mengerti", "py": "dǒng", "hz": "懂", "words": "懂 (dǒng): mengerti", "note": "", "warn": false, "ex": [["Saya mengerti maksudmu.", "Wǒ dǒng nǐ de yìsi.", "我懂你的意思。"], ["Kamu mengerti instruksinya?", "Nǐ dǒng zhǐshì ma?", "你懂指示吗？"], ["Dia tidak mengerti bahasa Mandarin.", "Tā bù dǒng Zhōngwén.", "他不懂中文。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "mereka", "py": "tāmen", "hz": "他们 / 她们", "words": "他 (tā): dia (laki-laki), 她 (tā): dia (perempuan), 们 (men): penanda jamak", "note": "", "warn": false, "ex": [["Mereka sudah pulang.", "Tāmen yǐjīng huí jiā le.", "他们已经回家了。"], ["Mereka operator baru.", "Tāmen shì xīn cāozuòyuán.", "他们是新操作员。"], ["Tolong beritahu mereka.", "Qǐng gàosu tāmen.", "请告诉他们。"]]}, {"label": "Umum: 星期天 lebih lazim diucapkan daripada 星期日 (tulisan/formal).", "id": "Minggu", "py": "xīngqīrì / xīngqītiān", "hz": "星期日 / 星期天", "words": "星期 (xīngqī): minggu / hari, 日 (rì) / 天 (tiān): hari / matahari", "note": "Bisa juga 周日 (zhōurì), 周 = singkatan 星期", "warn": false, "ex": [["Hari Minggu kita libur.", "Xīngqītiān wǒmen xiūxi.", "星期天我们休息。"], ["Saya kerja sampai hari Minggu.", "Wǒ gōngzuò dào xīngqītiān.", "我工作到星期天。"], ["Minggu ini pesanan sangat banyak.", "Zhè ge xīngqī dìngdān hěn duō.", "这个星期订单很多。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "minggu depan", "py": "xià ge xīngqī", "hz": "下个星期", "words": "下 (xià): berikutnya, 个 (gè): kata penggolong, 星期 (xīngqī): minggu", "note": "", "warn": false, "ex": [["Minggu depan saya cuti.", "Xià ge xīngqī wǒ xiūjià.", "下个星期我休假。"], ["Kita rapat minggu depan.", "Wǒmen xià ge xīngqī kāi huì.", "我们下个星期开会。"], ["Laporan minggu depan harus selesai.", "Xià ge xīngqī de bàogào yào wánchéng.", "下个星期的报告要完成。"]]}, {"label": "Umum (sopan): Sopan, sering dipakai di layanan/kantor. Di percakapan biasa cukup 等一下.", "id": "Mohon tunggu sebentar", "py": "Qǐng shāo děng", "hz": "请稍等", "words": "请 (qǐng): mohon, 稍 (shāo): sedikit, 等 (děng): tunggu", "note": "", "warn": false, "ex": [["Mohon tunggu sebentar, saya cek dulu.", "Qǐng shāo děng, wǒ xiān jiǎnchá yíxià.", "请稍等，我先检查一下。"], ["Mohon tunggu sebentar di sini.", "Qǐng zài zhèr shāo děng.", "请在这儿稍等。"], ["Mohon tunggu sebentar, pimpinan sedang rapat.", "Qǐng shāo děng, lǐngdǎo zhèng zài kāi huì.", "请稍等，领导正在开会。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Murah", "py": "piányi", "hz": "便宜", "words": "便宜 (piányi): murah", "note": "", "warn": false, "ex": [["Harga di toko ini murah.", "Zhè jiā diàn de jiàgé hěn piányi.", "这家店的价格很便宜。"], ["Barang ini murah dan bagus.", "Zhè ge dōngxi piányi yòu hǎo.", "这个东西便宜又好。"], ["Saya cari barang yang murah.", "Wǒ zhǎo piányi de dōngxi.", "我找便宜的东西。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Murid", "py": "xuésheng", "hz": "学生", "words": "学 (xué): belajar, 生 (shēng): orang yang, 学生 (xuésheng): murid / pelajar", "note": "", "warn": false, "ex": [["Murid saya sudah bisa berbicara Mandarin.", "Wǒ de xuésheng yǐjīng huì shuō Zhōngwén le.", "我的学生已经会说中文了。"], ["Murid itu rajin sekali.", "Nà ge xuésheng hěn qínfèn.", "那个学生很勤奋。"], ["Murid-murid sedang belajar di kelas.", "Xuéshengmen zài jiàoshì lǐ xuéxí.", "学生们在教室里学习。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Nama saya", "py": "wǒ jiào ……", "hz": "我叫……", "words": "我 (wǒ): saya, 叫 (jiào): bernama / dipanggil", "note": "Ganti …… dengan nama kamu", "warn": false, "ex": [["Nama saya Lin.", "Wǒ jiào Lín.", "我叫林。"], ["Nama saya Lin, saya dari bagian QC.", "Wǒ jiào Lín, wǒ shì zhìjiǎn bù de.", "我叫林，我是质检部的。"], ["Nama saya Lin, senang bertemu Anda.", "Wǒ jiào Lín, hěn gāoxìng rènshi nín.", "我叫林，很高兴认识您。"]]}, {"label": "Kurang umum: Kata \"station\" dan \"PIC\" bukan istilah native; lebih wajar 各工位名称 (nama tiap stasiun kerja).", "id": "nama setiap station di PIC", "py": "gègè gōngwèi de míngchēng", "hz": "各个工位的名称", "words": "各个 (gègè): setiap, 工位 (gōngwèi): stasiun kerja / pos, 的 (de): dari/milik, 名称 (míngchēng): nama", "note": "", "warn": false, "ex": [["Tolong cek nama setiap station di PIC.", "Qǐng jiǎnchá měi ge gōngwèi de míngchēng.", "请检查每个工位的名称。"], ["Nama setiap station harus dicatat.", "Měi ge gōngwèi de míngchēng yào jìlù.", "每个工位的名称要记录。"], ["Saya perlu daftar nama setiap station.", "Wǒ xūyào měi ge gōngwèi de míngchēng qīngdān.", "我需要每个工位的名称清单。"]]}, {"label": "Umum: sering dipakai native dalam percakapan sehari-hari.", "id": "Negara", "py": "guójiā", "hz": "国家", "words": "国 (guó): negara, 家 (jiā): rumah / keluarga, 国家 (guójiā): negara", "note": "", "warn": false, "ex": [["Ne
