<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30H Belajar Mandarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<!--STYLE-->
<style>
#xmx{border:0;background:rgba(241,243,244,.8);color:var(--mute);width:36px;height:36px;border-radius:999px;font-size:16px;cursor:pointer}
.xk{display:block;margin:0 0 6px;color:var(--mute);font-size:15px}
.ge{align-items:center}.ge .gt{display:flex;flex-direction:column;gap:2px}.ge .xz{font:700 22px/1.3 var(--hz);color:var(--ink)}.ge .xp{color:var(--pyc);font-weight:700;font-size:15px}.ge .xi{color:var(--mute);font-size:15px}
#quiz{touch-action:pan-y}@keyframes slL{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}@keyframes slR{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}#quiz.sl{animation:slL .25s ease-out}#quiz.sr{animation:slR .25s ease-out}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}.acts .next,.acts button.alt2{margin-top:0}.acts button.alt2{background:#ffffff;color:var(--blue)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:14px}
.dy{font:700 16px var(--font);color:#ffffff;border:3px solid transparent;border-radius:12px;padding:8px 0;cursor:pointer}
.dy.b{background:#4285F4}.dy.r{background:#EA4335}.dy.y{background:#FBBC05;color:#202124}.dy.g{background:#34A853}
.dy[aria-pressed="true"]{border-color:#202124;box-shadow:0 0 0 2px #ffffff inset}
.dinfo{margin-top:14px;font-size:17px}
.dinfo small{display:block;color:var(--mute);font-size:15px}
.sub{color:var(--mute);margin:8px 0 0;font-size:16px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
button.alt2{margin-top:14px;background:var(--card);color:var(--ink);border:0;border-radius:999px;padding:9px 22px;font:700 16px var(--font);cursor:pointer}
</style>
</head>
<body>
<header class="hd"><h1>30H Belajar</h1><p class="sub">Latihan per hari: Indonesia → Pinyin &amp; Hanzi. Tiap hari hanya menguji kosakata hari itu.</p></header>
<div class="wrap">
<div class="tabs"><a class="tab" href="index.html">Kamus</a><a class="tab" href="index.html#latihan">Latihan</a><a class="tab" aria-selected="true" aria-current="page" href="deck.html">30H Belajar</a><button class="tab" type="button" id="t3" aria-haspopup="dialog" aria-expanded="false" aria-label="Panduan pengucapan pinyin" title="Pengucapan pinyin"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></button></div>
<div class="days" id="days" role="group" aria-label="Pilih hari"></div>
<div class="dinfo" id="dinfo"></div>
<div class="score"><span id="sc"></span><button class="lnk" id="rs" type="button">Ulangi hari ini</button></div>
<div class="pg"><div id="pgf"></div></div>
<div class="card" id="quiz"></div>
</div>
<div class="pm" id="pm" role="dialog" aria-modal="true" aria-labelledby="pmt" hidden>
<div class="pmc"><div class="pmh"><h2 id="pmt">Pengucapan pinyin</h2><button type="button" id="pmx" aria-label="Tutup">✕</button></div><div class="pmb" id="pmb"></div></div>
</div>
<div class="pm" id="xm" role="dialog" aria-modal="true" aria-labelledby="xmt" hidden>
<div class="pmc"><div class="pmh"><h2 id="xmt">Contoh kalimat</h2><button type="button" id="xmx" aria-label="Tutup">✕</button></div><div class="pmb" id="xmb"></div></div>
</div>
<script>
(function(){
var DECK=[];
var DAYS=[];
var PG=[];
function $(i){return document.getElementById(i)}
function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
/* suara (Web Speech API, zh-CN) */
var SYN=window.speechSynthesis,SPV=null;
function spVoice(){if(!SYN)return null;var v=SYN.getVoices()||[];for(var i=0;i<v.length;i++){if(/^zh[-_]CN|^cmn/i.test(v[i].lang))return v[i]}for(var j=0;j<v.length;j++){if(/^zh/i.test(v[j].lang))return v[j]}return null}
if(SYN&&SYN.addEventListener)SYN.addEventListener("voiceschanged",function(){SPV=spVoice()});
function toast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 16px;border-radius:12px;font:700 14px Calibri,Arial,sans-serif;z-index:9;max-width:90%;text-align:center";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none"},4000)}
var SPU=null;
var SPOK="";function pk(p){return p.l+"|"+(p.v?p.v.name:"")}
function spTry(t,btn,n){
  var vs=[];try{(SYN.getVoices()||[]).forEach(function(v){if(/^(zh|cmn)/i.test(v.lang))vs.push(v)})}catch(x){}
  var plans=[{l:"zh-CN"},{l:"zh-CN",v:vs[0]},{l:"cmn-Hans-CN"},{l:"zh_CN"},{l:"zh-CN",v:vs[1]},{l:"zh"}].filter(function(p,i){return i===0||p.v||!/zh-CN$/.test(p.l)||i>1});
  if(SPOK){plans=plans.filter(function(p){return pk(p)===SPOK}).concat(plans.filter(function(p){return pk(p)!==SPOK}))}
  var p=plans[n];if(!p){toast("Suara gagal. Mesin TTS tidak bisa memutar Mandarin di Chrome ini.");return}
  var u=new SpeechSynthesisUtterance(t);SPU=u;u.lang=p.l;u.rate=.9;u.volume=1;if(p.v){u.voice=p.v;u.lang=p.v.lang}
  var started=false,off=function(){if(btn)btn.classList.remove("on")};
  u.onstart=function(){started=true;SPOK=pk(p);if(btn)btn.classList.add("on")};
  u.onend=function(){started=true;off()};
  u.onerror=function(e){off();var er=e&&e.error;if(er==="canceled"||er==="interrupted")return;spTry(t,btn,n+1)};
  try{SYN.resume()}catch(x){}
  SYN.speak(u);
  setTimeout(function(){if(!started&&!SYN.speaking&&!SYN.pending&&SPU===u)spTry(t,btn,n+1)},1500);
}
var AUD=null;
function playAu(au,btn,fb){
  Array.prototype.forEach.call(document.querySelectorAll(".sp.on"),function(x){x.classList.remove("on")});
  try{if(SYN)SYN.cancel()}catch(x){}
  if(!AUD)AUD=new Audio();
  AUD.pause();
  var off=function(){if(btn)btn.classList.remove("on")};
  AUD.onended=off;AUD.onerror=function(){off();fb()};
  AUD.src="audio/"+au+".mp3";
  if(btn)btn.classList.add("on");
  var p=AUD.play();if(p&&p.catch)p.catch(function(){off();fb()});
}
function speak(text,btn,au){
  if(au){playAu(au,btn,function(){speak(text,btn)});return}
  if(!SYN){toast("Browser ini tidak mendukung suara");return}
  var t=String(text).replace(/…+|\.{2,}/g,"，").replace(/\s*[\/·]\s*/g,"，").replace(/[「」"]/g,"");
  Array.prototype.forEach.call(document.querySelectorAll(".sp.on"),function(x){x.classList.remove("on")});
  if(SYN.speaking||SYN.pending){SYN.cancel();setTimeout(function(){spTry(t,btn,0)},120)}else spTry(t,btn,0);
}
function spBtn(text,au){
  if(!SYN&&!au)return null;
  var b=el("button","sp");b.type="button";b.setAttribute("aria-label","Dengarkan: "+text);
  b.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  b.onclick=function(e){e.stopPropagation();speak(text,b,au)};
  return b;
}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function same(a,b){return norm(a).replace(/\s+/g,"")===norm(b).replace(/\s+/g,"")}
function chars(s){var o={};String(s||"").replace(/[\u4e00-\u9fff]/g,function(c){o[c]=1});return o}
function jac(a,b){var i=0,u=0,k;for(k in a){u++;if(b[k])i++}for(k in b)if(!a[k])u++;return u?i/u:0}
function toks(s){var o={};norm(s).split(/[^a-z0-9]+/).forEach(function(w){if(w.length>2)o[w]=1});return o}
function syn(a,b){return (a.syn||[]).some(function(c){return (b.syn||[]).indexOf(c)>-1})}
function sim(q,d){
  var s=jac(chars(q.hz),chars(d.hz))*5+jac(toks(q.id),toks(d.id))*4+jac(toks(q.py),toks(d.py))*2;
  if(/[?？]/.test(q.hz)===/[?？]/.test(d.hz))s+=1;
  return s+Math.max(0,1-Math.abs(q.hz.length-d.hz.length)/6)+Math.random()*0.8;
}
/* pilihan jawaban: hanya dari kosakata hari yang sama, dipilih yang mirip dengan soal */
function pickOpts(q,pool){
  var cq=chars(q.hz);
  var base=pool.filter(function(d){return d!==q&&!syn(q,d)&&d.hz!==q.hz&&d.py!==q.py&&!(q.hz.length>3&&jac(cq,chars(d.hz))>=.7)});
  var ranked;
  if(q.val!=null){
    var nums=base.filter(function(d){return d.val!=null&&d.grp===q.grp});
    if(nums.length>=3)ranked=nums.sort(function(a,b){return Math.abs(a.val-q.val)-Math.abs(b.val-q.val)+(Math.random()-.5)*.9}).slice(0,6);
  }
  if(!ranked)ranked=base.map(function(d){return[sim(q,d),d]}).sort(function(a,b){return b[0]-a[0]}).slice(0,10).map(function(x){return x[1]});
  ranked=shuf(ranked);
  var opts=[q],seen=[q];
  function ok(c){return !seen.some(function(s){return same(s.hz,c.hz)||syn(s,c)})}
  for(var i=0;i<ranked.length&&opts.length<4;i++){if(ok(ranked[i])){opts.push(ranked[i]);seen.push(ranked[i])}}
  shuf(pool).forEach(function(d){if(opts.length<4&&d!==q&&ok(d)){opts.push(d);seen.push(d)}});
  return shuf(opts);
}
var vi=0,cur=0,deck=[],rec=[],st={ok:0,all:0},total=0;
function dayPool(n){return DECK.filter(function(o){return o.day===n&&o.id&&o.py&&o.hz})}
function score(n){$("sc").textContent=(n>total?"Selesai":"Soal "+n+" dari "+total)+" · Benar "+st.ok;$("pgf").style.width=Math.min(st.all,total)/total*100+"%"}
function start(n){
  cur=n;var pool=dayPool(n);deck=shuf(pool);rec=[];total=pool.length;st={ok:0,all:0};
  Array.prototype.forEach.call(document.querySelectorAll(".dy"),function(b){b.setAttribute("aria-pressed",+b.dataset.n===n)});
  var d=DAYS[n-1];
  $("dinfo").textContent="";
  $("dinfo").appendChild(el("b",null,"Hari "+n+" · "+d.t));
  $("dinfo").appendChild(el("small",null,d.tahap+" · "+total+" kosakata"));
  ask();
}
function summary(){
  var box=$("quiz");box.textContent="";box._pick=null;score(total+1);
  box.appendChild(el("div","ask","Hari "+cur+" selesai"));
  box.appendChild(el("p","qt id","Benar "+st.ok+" dari "+total+" ("+Math.round(st.ok/total*100)+"%)"));
  var w=el("div","acts"),a=el("button","next","Ulangi hari ini");a.type="button";a.onclick=function(){start(cur)};w.appendChild(a);
  if(cur<DAYS.length){var b=el("button","alt2","Hari "+(cur+1)+" →");b.type="button";b.onclick=function(){start(cur+1);window.scrollTo(0,0)};w.appendChild(b)}
  box.appendChild(w);a.focus();
}
function ask(){show(st.all)}
function show(idx,dir){
  vi=idx;slide(dir);
  if(idx>=total){summary();return}
  score(idx+1);
  var q=deck[idx],pool=dayPool(cur),box=$("quiz");box.textContent="";
  var r=rec[idx]||(rec[idx]={opts:pickOpts(q,pool),pick:null}),opts=r.opts;
  box.appendChild(el("div","ask","Pilih Pinyin dan Hanzi yang tepat untuk:"));
  box.appendChild(el("p","qt id",q.id));
  var wrap=el("div","opts"),btns=[],res=el("div","res");
  opts.forEach(function(o,i){
    var b=el("button","opt ap");b.type="button";b.appendChild(el("span","k",String(i+1)));
    var t=el("span","t");t.appendChild(el("span","oh",o.hz));t.appendChild(el("span","oy",o.py));b.appendChild(t);
    b.onclick=function(){pick(i)};btns.push(b);var ow=el("div","ow");ow.appendChild(b);var ob=spBtn(o.hz,o.au);if(ob){ob.classList.add("lg");ow.appendChild(ob)}wrap.appendChild(ow);
  });
  function reveal(i){
    var good=opts[i]===q;
    btns.forEach(function(b,k){b.disabled=true;if(opts[k]===q)b.classList.add("ok");else if(k===i)b.classList.add("no");b.appendChild(el("span","oi",opts[k].id))});
    res.appendChild(el("div","v",good?"Benar.":"Belum tepat."));
    var rh=el("div","rh");rh.appendChild(el("div","hz",q.hz));var rb=spBtn(q.hz,q.au);if(rb)rh.appendChild(rb);res.appendChild(rh);res.appendChild(el("div","py",q.py));res.appendChild(el("div","id",q.id));
    if(q.words)res.appendChild(el("div","meta",q.words));
    if(q.note)res.appendChild(el("div","meta",q.note));
    var ac=el("div","acts"),n=null;
    if(idx===st.all-1){n=el("button","next",st.all>=total?"Lihat hasil":"Soal berikutnya");n.type="button";n.onclick=ask;ac.appendChild(n)}
    if(q.ex&&q.ex.length){var xb=el("button","alt2","Contoh kalimat");xb.type="button";xb.onclick=function(){xOpen(q)};ac.appendChild(xb)}
    if(ac.childNodes.length)res.appendChild(ac);
    return n;
  }
  function pick(i){
    if(r.pick!=null||idx!==st.all)return;
    r.pick=i;st.all++;if(opts[i]===q)st.ok++;
    var n=reveal(i);
    score(idx+1);if(n)n.focus();
  }
  box.appendChild(wrap);box.appendChild(res);
  if(r.pick!=null)reveal(r.pick);
  box._pick=(r.pick==null&&idx===st.all)?pick:null;
}
/* pop-up contoh kalimat */
var xm=$("xm"),xmb=$("xmb");
function xClose(){xm.hidden=true}
function xOpen(q){xmb.textContent="";var k=el("span","xk",q.hz+" · "+q.py);xmb.appendChild(k);
  q.ex.forEach(function(e,i){var r=el("div","gi ge b");r.style.setProperty("--c","var(--blue)");var t=el("span","gt");t.appendChild(el("span","xz",e[2]));t.appendChild(el("span","xp",e[1]));t.appendChild(el("span","xi",e[0]));r.appendChild(t);var b=spBtn(e[2],e[3]);if(b)r.appendChild(b);xmb.appendChild(r)});
  xm.hidden=false;xmb.scrollTop=0;$("xmx").focus()}
$("xmx").onclick=xClose;xm.onclick=function(e){if(e.target===xm)xClose()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!xm.hidden)xClose()});
DAYS.forEach(function(d){
  var b=el("button","dy "+d.col,String(d.n));b.type="button";b.dataset.n=d.n;b.setAttribute("aria-label","Hari "+d.n);b.setAttribute("aria-pressed","false");
  b.onclick=function(){start(d.n)};$("days").appendChild(b);
});
/* pop-up panduan pinyin */
(function(){var m=$("pm"),body=$("pmb");if(!m)return;
PG.forEach(function(s,si){var d=el("div","gs "+["b","r","y","g"][si%4]);d.appendChild(el("h2","",s.t));if(s.d)d.appendChild(el("p","gd",s.d));
  s.items.forEach(function(it){var r=el("div","gi");r.appendChild(el("span","gp",it[0]));if(it[1]){r.appendChild(el("span","gh",it[1]))}else r.classList.add("gn");r.appendChild(el("span","gt",it[2]));var b=it[1]?spBtn(it[1],it[3]):null;if(b)r.appendChild(b);d.appendChild(r)});body.appendChild(d)});
function open(){m.hidden=false;$("t3").setAttribute("aria-expanded","true");body.scrollTop=0;$("pmx").focus()}
function close(){m.hidden=true;$("t3").setAttribute("aria-expanded","false");$("t3").focus()}
$("t3").onclick=function(e){e.preventDefault();open()};
$("pmx").onclick=close;
m.onclick=function(e){if(e.target===m)close()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!m.hidden)close()});
if(location.hash==="#info"){open()}
})();
function slide(dir){
  if(!dir)return;var b=$("quiz");b.classList.remove("sl","sr");void b.offsetWidth;b.classList.add(dir>0?"sl":"sr");
  setTimeout(function(){b.classList.remove("sl","sr")},300);
}
/* geser kiri/kanan pada soal: kiri = berikutnya, kanan = sebelumnya */
(function(){
  var q=$("quiz"),x0=0,y0=0,t0=0,sw=0,on=false;
  q.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"&&e.button!==0)return;on=true;x0=e.clientX;y0=e.clientY;t0=Date.now()});
  q.addEventListener("pointercancel",function(){on=false});
  q.addEventListener("pointerup",function(e){
    if(!on)return;on=false;var dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-t0>900)return;
    sw=Date.now();
    if(dx>0){if(vi>0)show(vi-1,-1)}else if(vi<st.all)show(vi+1,1);
  });
  q.addEventListener("click",function(e){if(Date.now()-sw<500){e.stopPropagation();e.preventDefault()}},true);
})();
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;var n=parseInt(e.key,10);
  if(n>=1&&n<=4&&$("quiz")._pick)$("quiz")._pick(n-1);
});
$("rs").onclick=function(){start(cur)};
if(DAYS.length)start(1);
})();
</script>
</body>
</html>
