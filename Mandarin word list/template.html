<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamus Mandarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#F1F3F4;--line:#DADCE0;--ink:#202124;--mute:#5F6368;--blue:#4285F4;--red:#EA4335;--yel:#FBBC05;--grn:#34A853;--pri:#202124;--pri-ink:#ffffff;--link:#1A73E8;--pyc:#1A73E8;--ok:#188038;--ok-bg:#E6F4EA;--err:#C5221F;--err-bg:#FCE8E6;--mark:#FEEFC3;--hz:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;--font:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.hd{max-width:860px;margin:0 auto;padding:28px 20px 16px}
h1{margin:0;font:700 40px/1.15 var(--font);color:var(--ink)}
h1 .c0,h1 .c1,h1 .c2,h1 .c3{color:var(--ink)}
h1::after{content:"";display:block;width:72px;height:6px;border-radius:3px;background:linear-gradient(90deg,#4285F4 25%,#EA4335 0 50%,#FBBC05 0 75%,#34A853 0);margin-top:12px}
.wrap{max-width:860px;margin:0 auto;padding:8px 20px 48px}
.tabs{display:inline-flex;gap:6px}
.tab{font:700 16px var(--font);background:var(--card);color:var(--mute);border:0;border-radius:999px;padding:6px 20px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--blue);color:#ffffff}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{position:sticky;top:0;background:#ffffff;padding:14px 0 8px;z-index:2}
#q{width:100%;font:inherit;padding:11px 16px;border:2px solid var(--line);border-radius:12px;background:#ffffff;color:var(--ink)}
#q:focus{border-color:var(--blue);outline:none}
#q::placeholder{color:#80868B}
#info{color:var(--mute);font-size:15px;margin:8px 2px 0}
.card{background:var(--card);border-radius:16px;border-left:8px solid var(--blue);padding:16px 20px;margin-top:12px}
.card:has(.lb.g){border-left-color:var(--grn)}
.card:has(.lb.b){border-left-color:var(--blue)}
.card:has(.lb.y){border-left-color:var(--yel)}
.card:has(.lb.r){border-left-color:var(--red)}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:#ffffff;border-radius:10px;padding:8px 14px}
.row+.row{margin-top:6px}
.id{font-size:18px;font-weight:400;color:var(--ink)}
.hz{font:700 24px/1.3 var(--hz);color:var(--ink)}
.py{color:var(--pyc);font-weight:700;font-size:16px}
.meta{color:var(--mute);font-size:15px;margin-top:8px}
.lb{display:inline-block;font:700 14px/1 var(--font);border-radius:999px;padding:5px 12px;margin-bottom:10px;color:#ffffff}
.lb.g{background:var(--grn)}
.lb.b{background:var(--blue)}
.lb.y{background:var(--yel);color:var(--ink)}
.lb.r{background:var(--red)}
button.cp{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:700 14px var(--font);cursor:pointer;min-width:76px}
button.cp:hover{background:var(--line)}
button.cp.ok{background:var(--ok-bg);color:var(--ok)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:40px 12px;font-size:16px}
.score{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:15px;margin-top:12px}
.pg{height:6px;background:var(--card);border-radius:999px;margin-top:10px;overflow:hidden}
#pgf{height:100%;width:0;background:linear-gradient(90deg,#4285F4,#34A853);border-radius:999px;transition:width .3s}
.ask{color:var(--mute);font-size:15px;font-weight:700}
.qt{margin:6px 0 0;word-break:break-word}
.qt.hz{font:700 34px/1.3 var(--hz);color:var(--ink)}
.qt.py{font:700 22px/1.4 var(--font);color:var(--pyc)}
.qt.id{font:400 22px/1.4 var(--font);color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:#ffffff;color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font);background:var(--card);color:var(--mute)}
.opt .t{word-break:break-word}
.opt.hz .t{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt.py .t{color:var(--pyc);font-weight:700}
.opt.ok{background:var(--ok-bg);border-color:var(--grn)}
.opt.ok .t{color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--red)}
.opt.no .t{color:var(--err)}
.opt:disabled{cursor:default}
.res{margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
.res .v{font-weight:700;margin-bottom:6px}
button.next{margin-top:14px;background:var(--blue);color:#ffffff;border:0;border-radius:999px;padding:9px 22px;font:700 16px var(--font);cursor:pointer}
button.next:hover{background:#1A73E8}
button.lnk{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;font-size:15px;font-weight:700}
@media (max-width:480px){.hd,.wrap{padding-left:16px;padding-right:16px}h1{font-size:32px}.hz{font-size:22px}.qt.hz{font-size:30px}}
.exs{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.exh{font:700 13px var(--font);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ex{padding:8px 14px;margin-top:6px;background:#ffffff;border-radius:10px}
.ex:last-child{padding-bottom:8px}
.ex-id{color:var(--ink);font-size:16px}
.ex-py{color:var(--pyc);font-size:15px;font-weight:700}
.ex-hz{color:var(--ink);font:700 18px/1.45 var(--hz)}
.id.tog{cursor:pointer;display:inline-block}
.id.tog::after{content:" \25BE";color:#80868B;font-size:13px}
.id.tog.open::after{content:" \25B4"}
.id.tog:hover{color:var(--link)}
.exs[hidden]{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--mute);margin-top:14px}
.legend b{font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mode{text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mode b{font:700 15px var(--font);color:var(--mute)}
.mode span{font-size:14px;line-height:1.3}
.mode[aria-pressed="true"]{background:#E8F0FE;border-color:var(--blue)}
.mode[aria-pressed="true"] b{color:var(--blue)}
.opt.ap .t{display:flex;flex-direction:column}
.opt .oh{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt .oy{color:var(--pyc);font-weight:700;font-size:15px}
.opt.ok .oh,.opt.ok .oy{color:var(--ok)}.opt.no .oh,.opt.no .oy{color:var(--err)}
.opt.id .t{font-size:17px}
.wd{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.w{background:#ffffff;border-radius:10px;padding:6px 12px;text-align:center}
.wh{font:700 28px/1.3 var(--hz);color:var(--ink)}
.wp{color:var(--pyc);font-weight:700;font-size:15px}
@media (max-width:560px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:center;gap:10px}}
.nav{background:#202124;position:sticky;top:0;z-index:5}
.nav div{max-width:860px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
.nav a{color:#DADCE0;text-decoration:none;font:700 16px var(--font);padding:13px 16px 10px;border-bottom:4px solid transparent}
.nav a:hover{color:#ffffff}
.nav a.on{color:#ffffff;border-bottom-color:#4285F4}
.bar{top:48px}
</style>
</head>
<body>
<nav class="nav" aria-label="Menu utama"><div><a class="on" href="index.html" aria-current="page">Kamus</a><a href="deck.html">Deck Belajar</a></div></nav>
<header class="hd"><h1>Kamus Mandarin</h1><div class="legend"><span style="color:#202124"><b>Indonesia</b></span><span style="color:#1A73E8"><b>Pinyin</b></span><span style="color:#202124"><b>Hanzi</b></span></div></header>
<div class="wrap">
<div class="tabs" role="tablist">
<button class="tab" role="tab" id="t1" aria-selected="true" aria-controls="p1">Kamus</button>
<button class="tab" role="tab" id="t2" aria-selected="false" aria-controls="p2">Latihan</button>
</div>
<section id="p1" role="tabpanel" aria-labelledby="t1">
<div class="bar">
<input id="q" type="search" placeholder="Cari kata: Indonesia, pinyin, atau hanzi…" autocomplete="off">
<div id="info"></div>
</div>
<div id="list"></div>
</section>
<section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
<div class="modes" id="modes" role="group" aria-label="Jenis latihan"></div>
<div class="score"><span id="sc"></span><button class="lnk" id="rs" type="button">Sesi baru</button></div>
<div class="pg"><div id="pgf"></div></div>
<div class="card" id="quiz"></div>
</section>
</div>
<script>
(function(){
var DATA=[];
var DECK=[];
var rows=DATA.map(function(o){o.hay=norm([o.id,o.py,o.hz].join(" "));return o});
function $(i){return document.getElementById(i)}
function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

/* tabs */
[["t1","p1"],["t2","p2"]].forEach(function(p){
  $(p[0]).onclick=function(){
    [["t1","p1"],["t2","p2"]].forEach(function(x){var on=x[0]===p[0];$(x[0]).setAttribute("aria-selected",on);$(x[1]).hidden=!on});
  };
});

/* kamus */
function copy(text,btn){
  function done(){var t=btn.textContent;btn.textContent="Tersalin";btn.classList.add("ok");setTimeout(function(){btn.textContent=t;btn.classList.remove("ok")},1200)}
  function fb(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
}
function hl(parent,text,toks){
  if(!toks.length){parent.textContent=text;return}
  var n=norm(text);
  if(n.length!==text.length){parent.textContent=text;return}
  var mask=new Array(text.length).fill(false);
  toks.forEach(function(t){var re=new RegExp(esc(t),"g"),m;while((m=re.exec(n))){for(var k=0;k<t.length;k++)mask[m.index+k]=true;if(m.index===re.lastIndex)re.lastIndex++}});
  var i=0;
  while(i<text.length){
    var j=i;while(j<text.length&&mask[j]===mask[i])j++;
    var seg=text.slice(i,j);
    if(mask[i]){var m=document.createElement("mark");m.textContent=seg;parent.appendChild(m)}else parent.appendChild(document.createTextNode(seg));
    i=j;
  }
}
function tone(l){return /^Bukan/.test(l)?"r":/hati-hati|^Kurang|^Jarang/.test(l)?"y":/pabrik|^Formal/.test(l)?"b":"g"}
function line(label,text,toks,cls){
  var r=el("div","row"),b=el("div"),t=el("div",cls);
  hl(t,text,toks);b.appendChild(t);r.appendChild(b);
  var c=el("button","cp","Salin");c.type="button";c.setAttribute("aria-label","Salin "+label);c.onclick=function(){copy(text,c)};r.appendChild(c);
  return r;
}
function render(){
  var toks=norm($("q").value).split(/\s+/).filter(Boolean);
  var res=rows.filter(function(o){return toks.every(function(t){return o.hay.indexOf(t)>-1})});
  $("info").textContent=res.length+" dari "+rows.length+" entri";
  var L=$("list");L.textContent="";
  if(!res.length){L.appendChild(el("div","empty","Tidak ada hasil. Coba kata kunci lain."));return}
  var frag=document.createDocumentFragment();
  res.slice(0,100).forEach(function(o){
    var c=el("div","card");
    if(o.label)c.appendChild(el("div","lb "+tone(o.label),o.label));
    c.appendChild(line("Indonesia",o.id,toks,"id"));
    var h=line("Hanzi",o.hz,toks,"hz");
    var p=el("div","py");hl(p,o.py,toks);h.firstChild.appendChild(p);
    c.appendChild(h);
    if(o.words){var w=el("div","meta");w.textContent=o.words;c.appendChild(w)}
    if(o.note){var n=el("div","meta");n.textContent=o.note;c.appendChild(n)}
    if(o.ex&&o.ex.length){
      var box=el("div","exs");box.appendChild(el("div","exh","Contoh kalimat"));
      o.ex.forEach(function(e){
        var it=el("div","ex"),a=el("div","ex-id"),b=el("div","ex-py"),z=el("div","ex-hz");
        a.textContent=e[0];b.textContent=e[1];z.textContent=e[2];
        it.appendChild(a);it.appendChild(b);it.appendChild(z);box.appendChild(it);
      });
      box.hidden=true;
      c.appendChild(box);
      var idEl=c.querySelector(".id");
      if(idEl){
        idEl.classList.add("tog");idEl.setAttribute("role","button");idEl.setAttribute("tabindex","0");
        idEl.setAttribute("aria-expanded","false");
        var flip=function(){box.hidden=!box.hidden;idEl.classList.toggle("open",!box.hidden);idEl.setAttribute("aria-expanded",String(!box.hidden))};
        idEl.onclick=flip;
        idEl.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
      }
    }
    frag.appendChild(c);
  });
  L.appendChild(frag);
  if(res.length>100)L.appendChild(el("div","empty","Menampilkan 100 pertama. Persempit pencarian untuk hasil lain."));
}
$("q").addEventListener("input",render);
(function(){var h=document.querySelector("h1"),t=h.textContent,k=0;h.setAttribute("aria-label",t);h.textContent="";for(var i=0;i<t.length;i++){if(t[i]===" "){h.appendChild(document.createTextNode(" "));continue}var c=el("span","c"+(k++%4),t[i]);c.setAttribute("aria-hidden","true");h.appendChild(c)}})();
render();

/* latihan */
var SES=10,deck=[],st={ok:0,all:0},mode="a";
var MODES={
  a:{t:"A",d:"Indonesia → Pinyin & Hanzi",ask:"Pilih Pinyin dan Hanzi yang tepat untuk:"},
  b:{t:"B",d:"Hanzi per kata + Pinyin → Indonesia",ask:"Apa arti dalam bahasa Indonesia? (per kata)"},
  c:{t:"C",d:"Hanzi & Pinyin → Indonesia",ask:"Apa arti dalam bahasa Indonesia?"}
};
function wordsOf(o){
  var out=[],m,r1=/([一-鿿][一-鿿A-Za-z0-9\/]*)\s*\(([^)]+)\)\s*:/g,r2=/([^,=()]+?)\s*\(([^)]*[一-鿿][^)]*)\)\s*=/g;
  while((m=r1.exec(o.words||""))){out.push([m[1],m[2].trim()])}
  if(out.length)return out;
  while((m=r2.exec(o.words||""))){out.push([m[2].trim(),m[1].trim()])}
  return out;
}
var all=DECK.filter(function(o){return o.id&&o.py&&o.hz});
all.forEach(function(o){o.w=wordsOf(o)});
var poolB=all.filter(function(o){return o.w.length>=2});
function poolOf(){return mode==="b"?poolB:all}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function same(a,b){return norm(a).replace(/\s+/g,"")===norm(b).replace(/\s+/g,"")}
function nextItem(){if(!deck.length)deck=shuf(poolOf());return deck.pop()}
function score(n){$("sc").textContent=(n>SES?"Sesi selesai":"Soal "+n+" dari "+SES)+" · Benar "+st.ok;$("pgf").style.width=Math.min(st.all,SES)/SES*100+"%"}
function newSession(){st={ok:0,all:0};deck=[];ask()}
function setMode(m){
  mode=m;
  Array.prototype.forEach.call(document.querySelectorAll(".mode"),function(b){b.setAttribute("aria-pressed",b.dataset.m===m)});
  newSession();
}
(function(){
  var box=$("modes");
  Object.keys(MODES).forEach(function(k){
    var b=el("button","mode");b.type="button";b.dataset.m=k;b.setAttribute("aria-pressed",k===mode);
    b.appendChild(el("b",null,MODES[k].t));b.appendChild(el("span",null,MODES[k].d));
    b.onclick=function(){setMode(k)};box.appendChild(b);
  });
})();
function summary(){
  var box=$("quiz");box.textContent="";box._pick=null;score(SES+1);
  box.appendChild(el("div","ask","Sesi selesai"));
  box.appendChild(el("p","qt id","Benar "+st.ok+" dari "+SES+" ("+Math.round(st.ok/SES*100)+"%)"));
  var n=el("button","next","Mulai sesi baru");n.type="button";n.onclick=newSession;box.appendChild(n);n.focus();
}
function hzpy(h,p,cls){var s=el("span",cls||"hp");s.appendChild(el("span","oh",h));s.appendChild(el("span","oy",p));return s}
function ask(){
  if(st.all>=SES){summary();return}
  score(st.all+1);
  var q=nextItem(),M=MODES[mode],box=$("quiz");box.textContent="";
  box.appendChild(el("div","ask",M.ask));
  if(mode==="a"){box.appendChild(el("p","qt id",q.id))}
  else if(mode==="b"){
    var wd=el("div","wd");
    q.w.forEach(function(w){var c=el("div","w");c.appendChild(el("div","wh",w[0]));c.appendChild(el("div","wp",w[1]));wd.appendChild(c)});
    box.appendChild(wd);
  }else{box.appendChild(el("p","qt hz",q.hz));box.appendChild(el("p","qt py",q.py))}
  var cand=shuf(poolOf().filter(function(d){return d!==q&&d.hz!==q.hz&&d.py!==q.py&&!same(d.id,q.id)}));
  var opts=[q],seen=[q];
  for(var i=0;i<cand.length&&opts.length<4;i++){
    if(seen.some(function(s){return mode==="a"?same(s.hz,cand[i].hz):same(s.id,cand[i].id)}))continue;
    opts.push(cand[i]);seen.push(cand[i]);
  }
  opts=shuf(opts);
  var wrap=el("div","opts"),btns=[],done=false,res=el("div","res");
  opts.forEach(function(o,i){
    var b=el("button","opt "+(mode==="a"?"ap":"id"));b.type="button";
    b.appendChild(el("span","k",String(i+1)));
    var t=el("span","t");
    if(mode==="a"){t.appendChild(el("span","oh",o.hz));t.appendChild(el("span","oy",o.py))}else t.textContent=o.id;
    b.appendChild(t);b.onclick=function(){pick(i)};
    btns.push(b);wrap.appendChild(b);
  });
  function pick(i){
    if(done)return;done=true;st.all++;
    var good=opts[i]===q;if(good)st.ok++;
    btns.forEach(function(b,k){b.disabled=true;if(opts[k]===q)b.classList.add("ok");else if(k===i)b.classList.add("no")});
    res.appendChild(el("div","v",good?"Benar.":"Belum tepat."));
    res.appendChild(el("div","hz",q.hz));
    res.appendChild(el("div","py",q.py));
    res.appendChild(el("div","id",q.id));
    if(q.words)res.appendChild(el("div","meta",q.words));
    if(q.note)res.appendChild(el("div","meta",q.note));
    var n=el("button","next",st.all>=SES?"Lihat hasil":"Soal berikutnya");n.type="button";n.onclick=ask;res.appendChild(n);
    score(st.all);n.focus();
  }
  box.appendChild(wrap);box.appendChild(res);
  box._pick=pick;
}
document.addEventListener("keydown",function(e){
  if($("p2").hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=4&&$("quiz")._pick){$("quiz")._pick(n-1)}
});
$("rs").onclick=newSession;
if(all.length>=4){ask()}else $("quiz").appendChild(el("div","empty","Data belum cukup untuk kuis."));
})();
</script>
</body>
</html>
