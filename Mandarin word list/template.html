<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#ffffff;--card:#F1F3F4;--line:#DADCE0;--ink:#202124;--mute:#5F6368;--blue:#4285F4;--red:#EA4335;--yel:#FBBC05;--grn:#34A853;--pri:#202124;--pri-ink:#ffffff;--link:#1A73E8;--pyc:#1A73E8;--ok:#188038;--ok-bg:#E6F4EA;--err:#C5221F;--err-bg:#FCE8E6;--mark:#FEEFC3;--hz:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;--font:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.hd{max-width:860px;margin:0 auto;padding:28px 20px 16px}

h1::after{content:"";display:block;width:72px;height:6px;border-radius:3px;background:linear-gradient(90deg,#4285F4 25%,#EA4335 0 50%,#FBBC05 0 75%,#34A853 0);margin-top:12px}
.wrap{max-width:860px;margin:0 auto;padding:8px 20px 48px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
#tc{border:2px solid var(--line);background:#ffffff;padding:4px 16px}
#tc.on{border-color:var(--blue);color:var(--blue)}
.tab{font:700 16px var(--font);background:var(--card);color:var(--mute);border:0;border-radius:999px;padding:6px 20px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--blue);color:#ffffff}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{position:sticky;top:0;background:#ffffff;padding:14px 0 8px;z-index:2}
#q{width:100%;font:inherit;padding:11px 16px;border:2px solid var(--line);border-radius:12px;background:#ffffff;color:var(--ink)}
#q:focus{border-color:var(--blue);outline:none}
#q::placeholder{color:#80868B}
#info{color:var(--mute);font-size:15px;margin:8px 2px 0}
.card{background:var(--card);border-radius:16px;border-left:8px solid var(--blue);padding:16px 20px;margin-top:12px}
.card.cb{border-left-color:var(--blue)}.card.cr{border-left-color:var(--red)}.card.cy{border-left-color:var(--yel)}.card.cg{border-left-color:var(--grn)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cats[hidden]{display:none}
.ct{font:700 15px var(--font);color:#ffffff;border:3px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;background:var(--pri)}
.ct.b{background:var(--blue)}.ct.r{background:var(--red)}.ct.y{background:var(--yel);color:var(--ink)}.ct.g{background:var(--grn)}
.ct small{font-weight:400;opacity:.9;margin-left:4px}
.ct[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px #ffffff inset}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:#ffffff;border-radius:10px;padding:8px 14px}
.row+.row{margin-top:6px}
.id{font-size:18px;font-weight:400;color:var(--ink)}
.hz{font:700 24px/1.3 var(--hz);color:var(--ink)}
.py{color:var(--pyc);font-weight:700;font-size:16px}
.meta{color:var(--mute);font-size:15px;margin-top:8px}
.lb{display:inline-block;font:700 14px/1 var(--font);border-radius:999px;padding:5px 12px;margin-bottom:10px;color:#ffffff}
.lb.g{background:var(--grn)}
.lb.b{background:var(--blue)}
.lb.y{background:var(--yel);color:var(--ink)}
.lb.r{background:var(--red)}
button.cp{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:700 14px var(--font);cursor:pointer;min-width:76px}
button.cp:hover{background:var(--line)}
button.cp.ok{background:var(--ok-bg);color:var(--ok)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:40px 12px;font-size:16px}
.score{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:15px;margin-top:12px}
.pg{height:6px;background:var(--card);border-radius:999px;margin-top:10px;overflow:hidden}
#pgf{height:100%;width:0;background:linear-gradient(90deg,#4285F4,#34A853);border-radius:999px;transition:width .3s}
.ask{color:var(--mute);font-size:15px;font-weight:700}
.qt{margin:6px 0 0;word-break:break-word}
.qt.hz{font:700 34px/1.3 var(--hz);color:var(--ink)}
.qt.py{font:700 22px/1.4 var(--font);color:var(--pyc)}
.qt.id{font:400 22px/1.4 var(--font);color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:#ffffff;color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font);background:var(--card);color:var(--mute)}
.opt .t{word-break:break-word}
.opt.hz .t{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt.py .t{color:var(--pyc);font-weight:700}
.opt.ok{background:var(--ok-bg);border-color:var(--grn)}
.opt.ok .t{color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--red)}
.opt.no .t{color:var(--err)}
.opt:disabled{cursor:default}
.res{margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
.res .v{font-weight:700;margin-bottom:6px}
button.next{margin-top:14px;background:var(--blue);color:#ffffff;border:0;border-radius:999px;padding:9px 22px;font:700 16px var(--font);cursor:pointer}
button.next:hover{background:#1A73E8}
button.lnk{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;font-size:15px;font-weight:700}
@media (max-width:480px){.hd,.wrap{padding-left:16px;padding-right:16px}h1{font-size:32px}.hz{font-size:22px}.qt.hz{font-size:30px}}
.exs{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.exh{font:700 13px var(--font);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ex{padding:8px 14px;margin-top:6px;background:#ffffff;border-radius:10px}
.ex:last-child{padding-bottom:8px}
.ex-id{color:var(--ink);font-size:16px}
.ex-py{color:var(--pyc);font-size:15px;font-weight:700}
.ex-hz{color:var(--ink);font:700 18px/1.45 var(--hz)}
.id.tog{cursor:pointer;display:inline-block}
.id.tog::after{content:" \25BE";color:#80868B;font-size:13px}
.id.tog.open::after{content:" \25B4"}
.id.tog:hover{color:var(--link)}
.exs[hidden]{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--mute);margin-top:14px}
.legend b{font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mode{text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mode b{font:700 15px var(--font);color:var(--mute)}
.mode span{font-size:14px;line-height:1.3}
.mode[aria-pressed="true"]{background:#E8F0FE;border-color:var(--blue)}
.mode[aria-pressed="true"] b{color:var(--blue)}
.opt.ap .t{display:flex;flex-direction:column}
.opt .oh{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt .oy{color:var(--pyc);font-weight:700;font-size:15px}
.opt.ok .oh,.opt.ok .oy{color:var(--ok)}.opt.no .oh,.opt.no .oy{color:var(--err)}
.opt.id .t{font-size:17px}
.ow{display:flex;gap:8px;align-items:stretch}
.ow .opt{flex:1;min-width:0}
button.sp.lg{width:46px;height:auto;border-radius:10px;background:#ffffff}
button.sp.lg.on{background:var(--blue)}
.opt .oi{margin-left:auto;text-align:right;font-size:14px;line-height:1.3;color:var(--mute);max-width:42%;word-break:break-word}
.opt.ok .oi{color:var(--ok)}.opt.no .oi{color:var(--err)}
.wd{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.w{background:#ffffff;border-radius:10px;padding:6px 12px;text-align:center}
.wh{font:700 28px/1.3 var(--hz);color:var(--ink)}
.wp{color:var(--pyc);font-weight:700;font-size:15px}
@media (max-width:560px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:center;gap:10px}}
button.sp{flex:none;width:38px;height:34px;border:0;border-radius:999px;background:var(--card);color:var(--blue);cursor:pointer;display:inline-grid;place-items:center;padding:0}
button.sp.on{background:var(--blue);color:#ffffff}
.bt{display:flex;gap:6px;align-items:center;flex:none}
.exr{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rh{display:flex;gap:10px;align-items:center;justify-content:space-between}
a.tab{text-decoration:none;display:inline-block}
#t3{margin-left:auto;padding:6px 12px;display:inline-grid;place-items:center}
.gs{margin-top:16px}.gs h2{font:700 18px var(--font);margin:0 0 4px;color:var(--ink)}.gs .gd{color:var(--mute);font-size:15px;margin:0 0 8px}
.gi{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px 12px;margin-top:6px}
.gi .gp{font-weight:700;color:var(--pyc);min-width:76px;font-size:17px}.gi .gh{font:700 24px/1.2 var(--hz);min-width:auto}
.gi .gt{flex:1;font-size:15px;line-height:1.35;color:var(--ink)}
@media (max-width:400px){.tab{font-size:14px;padding:6px 11px}.tabs{gap:4px}#tc{padding:4px 8px!important;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
</style>
</head>
<body>
<header class="hd"><h1>Kamus Mandarin</h1></header>
<div class="wrap">
<div class="tabs" role="tablist">
<button class="tab" role="tab" id="t1" aria-selected="true" aria-controls="p1">Kamus</button>
<button class="tab" role="tab" id="t2" aria-selected="false" aria-controls="p2">Latihan</button>
<a class="tab" href="deck.html">30H Belajar</a>
<button class="tab" id="tc" type="button" aria-expanded="false" aria-controls="cats">Kategori ▾</button>
<button class="tab" role="tab" id="t3" aria-selected="false" aria-controls="p3" aria-label="Panduan pengucapan pinyin" title="Pengucapan pinyin"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></button>
</div>
<div class="cats" id="cats" role="group" aria-label="Kategori" hidden></div>
<section id="p1" role="tabpanel" aria-labelledby="t1">
<div class="bar">
<input id="q" type="search" placeholder="Cari kata: Indonesia, pinyin, atau hanzi…" autocomplete="off">
<div id="info"></div>
</div>
<div id="list"></div>
</section>
<section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
<div class="modes" id="modes" role="group" aria-label="Jenis latihan"></div>
<div class="score"><span id="sc"></span><button class="lnk" id="rs" type="button">Sesi baru</button></div>
<div class="pg"><div id="pgf"></div></div>
<div class="card" id="quiz"></div>
</section>
<section id="p3" role="tabpanel" aria-labelledby="t3" hidden>
<div id="pg3"></div>
</section>
</div>
<script>
(function(){
var DATA=[];
var DECK=[];
var CATS=[];
var PG=[];
var DEFLB="Umum: sering dipakai native dalam percakapan sehari-hari.";
var catCol={},cat="";CATS.forEach(function(c){catCol[c.name]=c.col});
var rows=DATA.map(function(o){o.hay=norm([o.id,o.py,o.hz].concat((o.alt||[]).map(function(a){return a.join(" ")})).join(" "));return o});
function $(i){return document.getElementById(i)}
function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
/* suara (Web Speech API, zh-CN) */
var SYN=window.speechSynthesis,SPV=null;
function spVoice(){if(!SYN)return null;var v=SYN.getVoices()||[];for(var i=0;i<v.length;i++){if(/^zh[-_]CN|^cmn/i.test(v[i].lang))return v[i]}for(var j=0;j<v.length;j++){if(/^zh/i.test(v[j].lang))return v[j]}return null}
if(SYN&&SYN.addEventListener)SYN.addEventListener("voiceschanged",function(){SPV=spVoice()});
function toast(m){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 16px;border-radius:12px;font:700 14px Calibri,Arial,sans-serif;z-index:9;max-width:90%;text-align:center";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none"},4000)}
var SPU=null;
var SPOK="";function pk(p){return p.l+"|"+(p.v?p.v.name:"")}
function spTry(t,btn,n){
  var vs=[];try{(SYN.getVoices()||[]).forEach(function(v){if(/^(zh|cmn)/i.test(v.lang))vs.push(v)})}catch(x){}
  var plans=[{l:"zh-CN"},{l:"zh-CN",v:vs[0]},{l:"cmn-Hans-CN"},{l:"zh_CN"},{l:"zh-CN",v:vs[1]},{l:"zh"}].filter(function(p,i){return i===0||p.v||!/zh-CN$/.test(p.l)||i>1});
  if(SPOK){plans=plans.filter(function(p){return pk(p)===SPOK}).concat(plans.filter(function(p){return pk(p)!==SPOK}))}
  var p=plans[n];if(!p){toast("Suara gagal. Mesin TTS tidak bisa memutar Mandarin di Chrome ini.");return}
  var u=new SpeechSynthesisUtterance(t);SPU=u;u.lang=p.l;u.rate=.9;u.volume=1;if(p.v){u.voice=p.v;u.lang=p.v.lang}
  var started=false,off=function(){if(btn)btn.classList.remove("on")};
  u.onstart=function(){started=true;SPOK=pk(p);if(btn)btn.classList.add("on")};
  u.onend=function(){started=true;off()};
  u.onerror=function(e){off();var er=e&&e.error;if(er==="canceled"||er==="interrupted")return;spTry(t,btn,n+1)};
  try{SYN.resume()}catch(x){}
  SYN.speak(u);
  setTimeout(function(){if(!started&&!SYN.speaking&&!SYN.pending&&SPU===u)spTry(t,btn,n+1)},1500);
}
var AUD=null;
function playAu(au,btn,fb){
  Array.prototype.forEach.call(document.querySelectorAll(".sp.on"),function(x){x.classList.remove("on")});
  try{if(SYN)SYN.cancel()}catch(x){}
  if(!AUD)AUD=new Audio();
  AUD.pause();
  var off=function(){if(btn)btn.classList.remove("on")};
  AUD.onended=off;AUD.onerror=function(){off();fb()};
  AUD.src="audio/"+au+".mp3";
  if(btn)btn.classList.add("on");
  var p=AUD.play();if(p&&p.catch)p.catch(function(){off();fb()});
}
function speak(text,btn,au){
  if(au){playAu(au,btn,function(){speak(text,btn)});return}
  if(!SYN){toast("Browser ini tidak mendukung suara");return}
  var t=String(text).replace(/…+|\.{2,}/g,"，").replace(/\s*[\/·]\s*/g,"，").replace(/[「」"]/g,"");
  Array.prototype.forEach.call(document.querySelectorAll(".sp.on"),function(x){x.classList.remove("on")});
  if(SYN.speaking||SYN.pending){SYN.cancel();setTimeout(function(){spTry(t,btn,0)},120)}else spTry(t,btn,0);
}
function spBtn(text,au){
  if(!SYN&&!au)return null;
  var b=el("button","sp");b.type="button";b.setAttribute("aria-label","Dengarkan: "+text);
  b.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  b.onclick=function(e){e.stopPropagation();speak(text,b,au)};
  return b;
}

/* tabs */
[["t1","p1"],["t2","p2"],["t3","p3"]].forEach(function(p){
  $(p[0]).onclick=function(){
    [["t1","p1"],["t2","p2"],["t3","p3"]].forEach(function(x){var on=x[0]===p[0];$(x[0]).setAttribute("aria-selected",on);$(x[1]).hidden=!on;if(x[0]==="t1"){$("tc").style.display=on?"":"none";if(!on)$("cats").hidden=true}});
  };
});

/* kamus */
function copy(text,btn){
  function done(){var t=btn.textContent;btn.textContent="Tersalin";btn.classList.add("ok");setTimeout(function(){btn.textContent=t;btn.classList.remove("ok")},1200)}
  function fb(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
}
function hl(parent,text,toks){
  if(!toks.length){parent.textContent=text;return}
  var n=norm(text);
  if(n.length!==text.length){parent.textContent=text;return}
  var mask=new Array(text.length).fill(false);
  toks.forEach(function(t){var re=new RegExp(esc(t),"g"),m;while((m=re.exec(n))){for(var k=0;k<t.length;k++)mask[m.index+k]=true;if(m.index===re.lastIndex)re.lastIndex++}});
  var i=0;
  while(i<text.length){
    var j=i;while(j<text.length&&mask[j]===mask[i])j++;
    var seg=text.slice(i,j);
    if(mask[i]){var m=document.createElement("mark");m.textContent=seg;parent.appendChild(m)}else parent.appendChild(document.createTextNode(seg));
    i=j;
  }
}
function tone(l){return /^Bukan/.test(l)?"r":/hati-hati|^Kurang|^Jarang/.test(l)?"y":/pabrik|^Formal/.test(l)?"b":"g"}
function line(label,text,toks,cls,sp,au){
  var r=el("div","row"),b=el("div"),t=el("div",cls);
  hl(t,text,toks);b.appendChild(t);r.appendChild(b);
  var c=el("button","cp","Salin");c.type="button";c.setAttribute("aria-label","Salin "+label);c.onclick=function(){copy(text,c)};
  var sb=sp?spBtn(text,au):null;if(sb){var w=el("div","bt");w.appendChild(sb);w.appendChild(c);r.appendChild(w)}else r.appendChild(c);
  return r;
}
function render(){
  var toks=norm($("q").value).split(/\s+/).filter(Boolean);
  var pool=cat?rows.filter(function(o){return o.cat===cat}):rows;
  var res=pool.filter(function(o){return toks.every(function(t){return o.hay.indexOf(t)>-1})});
  $("info").textContent=res.length+" dari "+pool.length+" entri"+(cat?" · "+cat:"");
  var L=$("list");L.textContent="";
  if(!res.length){L.appendChild(el("div","empty","Tidak ada hasil. Coba kata kunci lain."));return}
  var frag=document.createDocumentFragment();
  res.slice(0,100).forEach(function(o){
    var k=catCol[o.cat]||"b";
    var c=el("div","card c"+k);
    if(o.cat)c.appendChild(el("div","lb "+k,o.cat));
    c.appendChild(line("Indonesia",o.id,toks,"id"));
    var h=line("Hanzi",o.hz,toks,"hz",true,o.au);
    var p=el("div","py");hl(p,o.py,toks);h.firstChild.appendChild(p);
    c.appendChild(h);
    if(o.alt&&o.alt.length){var al=el("div","meta");al.appendChild(el("b",null,"Alternatif: "));
      o.alt.forEach(function(a,i){if(i)al.appendChild(document.createTextNode(" · "));var s=el("span");hl(s,a[0]+" ("+a[1]+")",toks);al.appendChild(s)});c.appendChild(al)}
    if(o.words){var w=el("div","meta");w.textContent=o.words;c.appendChild(w)}
    if(o.note){var n=el("div","meta");n.textContent=o.note;c.appendChild(n)}
    if(o.label&&o.label!==DEFLB){var lm=el("div","meta");lm.textContent=o.label;c.appendChild(lm)}
    if(o.ex&&o.ex.length){
      var box=el("div","exs");box.appendChild(el("div","exh","Contoh kalimat"));
      o.ex.forEach(function(e){
        var it=el("div","ex"),a=el("div","ex-id"),b=el("div","ex-py"),z=el("div","ex-hz");
        a.textContent=e[0];b.textContent=e[1];z.textContent=e[2];
        it.appendChild(a);it.appendChild(b);var zr=el("div","exr");zr.appendChild(z);var eb=spBtn(e[2],e[3]);if(eb)zr.appendChild(eb);it.appendChild(zr);box.appendChild(it);
      });
      box.hidden=true;
      c.appendChild(box);
      var idEl=c.querySelector(".id");
      if(idEl){
        idEl.classList.add("tog");idEl.setAttribute("role","button");idEl.setAttribute("tabindex","0");
        idEl.setAttribute("aria-expanded","false");
        var flip=function(){box.hidden=!box.hidden;idEl.classList.toggle("open",!box.hidden);idEl.setAttribute("aria-expanded",String(!box.hidden))};
        idEl.onclick=flip;
        idEl.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
      }
    }
    frag.appendChild(c);
  });
  L.appendChild(frag);
  if(res.length>100)L.appendChild(el("div","empty","Menampilkan 100 pertama. Persempit pencarian untuk hasil lain."));
}

  b.onclick=function(){cat=name;Array.prototype.forEach.call($("cats").children,function(x){x.setAttribute("aria-pressed",String(x.dataset.c===cat))});$("tc").classList.toggle("on",!!cat);$("cats").hidden=true;$("tc").setAttribute("aria-expanded","false");render()};

(function(){var h=document.querySelector("h1"),t=h.textContent,k=0;h.setAttribute("aria-label",t);h.textContent="";for(var i=0;i<t.length;i++){if(t[i]===" "){h.appendChild(document.createTextNode(" "));continue}var c=el("span","c"+(k++%4),t[i]);c.setAttribute("aria-hidden","true");h.appendChild(c)}})();

/* latihan */
var SES=10,deck=[],st={ok:0,all:0},mode="a";
var MODES={
  a:{t:"A",d:"Indonesia → Pinyin & Hanzi",ask:"Pilih Pinyin dan Hanzi yang tepat untuk:"},
  b:{t:"B",d:"Hanzi per kata + Pinyin → Indonesia",ask:"Apa arti dalam bahasa Indonesia? (per kata)"},
  c:{t:"C",d:"Hanzi & Pinyin → Indonesia",ask:"Apa arti dalam bahasa Indonesia?"}
};
function wordsOf(o){
  var out=[],m,r1=/([一-鿿][一-鿿A-Za-z0-9\/]*)\s*\(([^)]+)\)\s*:/g,r2=/([^,=()]+?)\s*\(([^)]*[一-鿿][^)]*)\)\s*=/g;
  while((m=r1.exec(o.words||""))){out.push([m[1],m[2].trim()])}
  if(out.length)return out;
  while((m=r2.exec(o.words||""))){out.push([m[2].trim(),m[1].trim()])}
  return out;
}
var all=DECK.filter(function(o){return o.id&&o.py&&o.hz});
all.forEach(function(o){o.w=wordsOf(o)});
var poolB=all.filter(function(o){return o.w.length>=2});
function poolOf(){return mode==="b"?poolB:all}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function same(a,b){return norm(a).replace(/\s+/g,"")===norm(b).replace(/\s+/g,"")}
function nextItem(){if(!deck.length)deck=shuf(poolOf());return deck.pop()}
function score(n){$("sc").textContent=(n>SES?"Sesi selesai":"Soal "+n+" dari "+SES)+" · Benar "+st.ok;$("pgf").style.width=Math.min(st.all,SES)/SES*100+"%"}
function newSession(){st={ok:0,all:0};deck=[];ask()}
function setMode(m){
  mode=m;
  Array.prototype.forEach.call(document.querySelectorAll(".mode"),function(b){b.setAttribute("aria-pressed",b.dataset.m===m)});
  newSession();
}
(function(){
  var box=$("modes");
  Object.keys(MODES).forEach(function(k){
    var b=el("button","mode");b.type="button";b.dataset.m=k;b.setAttribute("aria-pressed",k===mode);
    b.appendChild(el("b",null,MODES[k].t));b.appendChild(el("span",null,MODES[k].d));
    b.onclick=function(){setMode(k)};box.appendChild(b);
  });
})();
/* pilihan jawaban yang mirip dengan soal */
function chars(s){var o={};String(s||"").replace(/[一-鿿]/g,function(c){o[c]=1});return o}
function jac(a,b){var i=0,u=0,k;for(k in a){u++;if(b[k])i++}for(k in b)if(!a[k])u++;return u?i/u:0}
function toks(s){var o={};norm(s).split(/[^a-z0-9]+/).forEach(function(w){if(w.length>2)o[w]=1});return o}
function sim(q,d){
  var s=0;
  if(d.sit&&d.sit===q.sit)s+=2;
  s+=jac(chars(q.hz),chars(d.hz))*5;
  s+=jac(toks(q.id),toks(d.id))*4;
  s+=jac(toks(q.py),toks(d.py))*2;
  if(/[?？]/.test(q.hz)===/[?？]/.test(d.hz))s+=1;
  s+=Math.max(0,1-Math.abs(q.hz.length-d.hz.length)/6);
  return s+Math.random()*0.8;
}
function pickOpts(q){
  var cq=chars(q.hz),tq=toks(q.id);
  var syn=function(a,b){return (a.syn||[]).some(function(c){return (b.syn||[]).indexOf(c)>-1})};
  /* buang kandidat yang hampir sama artinya dengan soal (bisa ikut benar) */
  var base=poolOf().filter(function(d){return d!==q&&!syn(q,d)&&d.hz!==q.hz&&d.py!==q.py&&!same(d.id,q.id)&&!(q.hz.length>3&&jac(cq,chars(d.hz))>=.7)&&!(Object.keys(tq).length>1&&jac(tq,toks(d.id))>=.7)});
  var ranked;
  if(q.val!=null){
    var nums=base.filter(function(d){return d.val!=null&&d.grp===q.grp});
    if(nums.length>=3)ranked=nums.sort(function(a,b){return Math.abs(a.val-q.val)-Math.abs(b.val-q.val)+(Math.random()-.5)*.9}).slice(0,6);
  }
  if(!ranked&&q.grp){
    var same_g=base.filter(function(d){return d.grp===q.grp});
    if(same_g.length>=6)base=same_g;
  }
  if(!ranked)ranked=base.map(function(d){return[sim(q,d),d]}).sort(function(a,b){return b[0]-a[0]}).slice(0,10).map(function(x){return x[1]});
  ranked=shuf(ranked.slice(0,mode==="a"?8:8));
  var opts=[q],seen=[q];
  function dup(s,c){return mode==="a"?same(s.hz,c.hz):same(s.id,c.id)}
  for(var i=0;i<ranked.length&&opts.length<4;i++){
    if(seen.some(function(s){return dup(s,ranked[i])||syn(s,ranked[i])}))continue;
    opts.push(ranked[i]);seen.push(ranked[i]);
  }
  if(opts.length<4){ /* cadangan: acak dari pool */
    shuf(poolOf()).forEach(function(d){if(opts.length<4&&d!==q&&!seen.some(function(s){return dup(s,d)||syn(s,d)})){opts.push(d);seen.push(d)}});
  }
  return shuf(opts);
}
function summary(){
  var box=$("quiz");box.textContent="";box._pick=null;score(SES+1);
  box.appendChild(el("div","ask","Sesi selesai"));
  box.appendChild(el("p","qt id","Benar "+st.ok+" dari "+SES+" ("+Math.round(st.ok/SES*100)+"%)"));
  var n=el("button","next","Mulai sesi baru");n.type="button";n.onclick=newSession;box.appendChild(n);n.focus();
}
function hzpy(h,p,cls){var s=el("span",cls||"hp");s.appendChild(el("span","oh",h));s.appendChild(el("span","oy",p));return s}
function ask(){
  if(st.all>=SES){summary();return}
  score(st.all+1);
  var q=nextItem(),M=MODES[mode],box=$("quiz");box.textContent="";
  box.appendChild(el("div","ask",M.ask));
  if(mode==="a"){box.appendChild(el("p","qt id",q.id))}
  else if(mode==="b"){
    var wd=el("div","wd");
    q.w.forEach(function(w){var c=el("div","w");c.appendChild(el("div","wh",w[0]));c.appendChild(el("div","wp",w[1]));wd.appendChild(c)});
    box.appendChild(wd);
  }else{var qh=el("div","rh");qh.appendChild(el("p","qt hz",q.hz));var qb=spBtn(q.hz,q.au);if(qb)qh.appendChild(qb);box.appendChild(qh);box.appendChild(el("p","qt py",q.py))}
  var opts=pickOpts(q);

  var wrap=el("div","opts"),btns=[],done=false,res=el("div","res");
  opts.forEach(function(o,i){
    var b=el("button","opt "+(mode==="a"?"ap":"id"));b.type="button";
    b.appendChild(el("span","k",String(i+1)));
    var t=el("span","t");
    if(mode==="a"){t.appendChild(el("span","oh",o.hz));t.appendChild(el("span","oy",o.py))}else t.textContent=o.id;
    b.appendChild(t);b.onclick=function(){pick(i)};
    btns.push(b);if(mode==="a"){var ow=el("div","ow");ow.appendChild(b);var ob=spBtn(o.hz,o.au);if(ob){ob.classList.add("lg");ow.appendChild(ob)}wrap.appendChild(ow)}else wrap.appendChild(b);
  });
  function pick(i){
    if(done)return;done=true;st.all++;
    var good=opts[i]===q;if(good)st.ok++;
    btns.forEach(function(b,k){b.disabled=true;if(opts[k]===q)b.classList.add("ok");else if(k===i)b.classList.add("no");if(mode==="a")b.appendChild(el("span","oi",opts[k].id))});
    res.appendChild(el("div","v",good?"Benar.":"Belum tepat."));
    var rh=el("div","rh");rh.appendChild(el("div","hz",q.hz));var rb=spBtn(q.hz,q.au);if(rb)rh.appendChild(rb);res.appendChild(rh);
    res.appendChild(el("div","py",q.py));
    res.appendChild(el("div","id",q.id));
    if(q.words)res.appendChild(el("div","meta",q.words));
    if(q.note)res.appendChild(el("div","meta",q.note));
    var n=el("button","next",st.all>=SES?"Lihat hasil":"Soal berikutnya");n.type="button";n.onclick=ask;res.appendChild(n);
    score(st.all);n.focus();
  }
  box.appendChild(wrap);box.appendChild(res);
  box._pick=pick;
}

  s.items.forEach(function(it){var r=el("div","gi");r.appendChild(el("span","gp",it[0]));r.appendChild(el("span","gh",it[1]));r.appendChild(el("span","gt",it[2]));var b=spBtn(it[1],it[3]);if(b)r.appendChild(b);d.appendChild(r)});h.appendChild(d)})})();
