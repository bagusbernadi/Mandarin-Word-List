<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamus Mandarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surface:#f8fafc;--line:#e2e8f0;--ink:#0f172a;--mute:#64748b;--pri:#1e40af;--pri-ink:#ffffff;--link:#1d4ed8;--ok:#047857;--ok-bg:#ecfdf5;--info:#1d4ed8;--info-bg:#eff6ff;--warn:#b45309;--warn-bg:#fffbeb;--err:#b91c1c;--err-bg:#fef2f2;--mark:#fef08a;--hz:"Noto Sans SC","Microsoft YaHei",sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.hd{max-width:820px;margin:0 auto;padding:24px 20px 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font:700 22px/1.2 "Inter",sans-serif;letter-spacing:-.01em;color:var(--ink)}
h1 .c0,h1 .c1,h1 .c2,h1 .c3{color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:16px 20px 48px}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{font:600 14px "Inter",sans-serif;background:none;color:var(--mute);border:0;border-radius:7px;padding:7px 16px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:#ffffff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08),0 0 0 1px var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.bar{position:sticky;top:0;background:#ffffff;padding:14px 0 8px;z-index:2}
#q{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#ffffff;color:var(--ink)}
#q:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px #dbeafe}
#q::placeholder{color:#94a3b8}
#info{color:var(--mute);font-size:13px;margin:8px 2px 0}
.card{background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:10px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.row+.row{margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.id{font-size:16px;font-weight:600;color:#0f172a}
.hz{font:400 24px/1.35 var(--hz);color:#7c3aed}
.py{color:#0f766e;font-weight:600;font-size:14px}
.meta{color:var(--mute);font-size:13.5px;margin-top:8px}
.lb{display:inline-block;font:600 11.5px/1 "Inter",sans-serif;letter-spacing:.02em;border-radius:6px;padding:5px 8px;margin-bottom:10px;border:1px solid transparent}
.lb.g{background:var(--ok-bg);color:var(--ok);border-color:#a7f3d0}
.lb.b{background:var(--info-bg);color:var(--info);border-color:#bfdbfe}
.lb.y{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.lb.r{background:var(--err-bg);color:var(--err);border-color:#fecaca}
button.cp{flex:none;border:1px solid var(--line);background:#ffffff;color:var(--ink);border-radius:8px;padding:6px 12px;font:600 13px "Inter",sans-serif;cursor:pointer;min-width:76px}
button.cp:hover{background:var(--surface)}
button.cp.ok{background:var(--ok-bg);color:var(--ok);border-color:#a7f3d0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:40px 12px;font-size:14px}
.score{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13.5px;margin-top:8px}
.pg{height:4px;background:var(--line);border-radius:999px;margin-top:10px;overflow:hidden}
#pgf{height:100%;width:0;background:var(--pri);border-radius:999px;transition:width .3s}
.ask{color:var(--mute);font-size:13.5px;font-weight:500}
.qt{margin:6px 0 0;word-break:break-word}
.qt.hz{font:400 32px/1.35 var(--hz);color:#7c3aed}
.qt.py{font:600 20px/1.4 "Inter",sans-serif;color:#0f766e}
.qt.id{font:600 20px/1.4 "Inter",sans-serif;color:#0f172a}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:#ffffff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:#cbd5e1;background:var(--surface)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:600 12px "Inter",sans-serif;background:var(--surface);color:var(--mute);border:1px solid var(--line)}
.opt .t{word-break:break-word}
.opt.hz .t{font:400 20px/1.4 var(--hz);color:#7c3aed}
.opt.py .t{color:#0f766e;font-weight:600}
.opt.ok{background:var(--ok-bg);border-color:#a7f3d0}
.opt.ok .t{color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:#fecaca}
.opt.no .t{color:var(--err)}
.opt:disabled{cursor:default}
.res{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.res .v{font-weight:600;margin-bottom:6px}
button.next{margin-top:14px;background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:10px 18px;font:600 14px "Inter",sans-serif;cursor:pointer}
button.next:hover{background:#1e3a8a}
button.lnk{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
@media (max-width:480px){.hd,.wrap{padding-left:16px;padding-right:16px}.hz{font-size:22px}.qt.hz{font-size:28px}}
.exs{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.exh{font:600 11.5px "Inter",sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ex{padding:8px 0;border-bottom:1px solid #f1f5f9}
.ex:last-child{border-bottom:0;padding-bottom:0}
.ex-id{color:#0f172a;font-size:14px;font-weight:500}
.ex-py{color:#0f766e;font-size:13.5px;font-weight:600}
.ex-hz{color:#7c3aed;font:400 17px/1.45 var(--hz)}
.id.tog{cursor:pointer;display:inline-block}
.id.tog::after{content:" \25BE";color:#94a3b8;font-size:12px}
.id.tog.open::after{content:" \25B4"}
.id.tog:hover{color:#1e40af}
.exs[hidden]{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend b{font-weight:600}
</style>
</head>
<body>
<header class="hd"><h1>Kamus Mandarin</h1><div class="legend"><span style="color:#0f172a"><b>Indonesia</b></span><span style="color:#0f766e"><b>Pinyin</b></span><span style="color:#7c3aed"><b>Hanzi</b></span></div></header>
<div class="wrap">
<div class="tabs" role="tablist">
<button class="tab" role="tab" id="t1" aria-selected="true" aria-controls="p1">Kamus</button>
<button class="tab" role="tab" id="t2" aria-selected="false" aria-controls="p2">Latihan</button>
</div>
<section id="p1" role="tabpanel" aria-labelledby="t1">
<div class="bar">
<input id="q" type="search" placeholder="Cari di semua kolom: Indonesia, pinyin, hanzi, label…" autocomplete="off">
<div id="info"></div>
</div>
<div id="list"></div>
</section>
<section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
<div class="score"><span id="sc"></span><button class="lnk" id="rs" type="button">Sesi baru</button></div>
<div class="pg"><div id="pgf"></div></div>
<div class="card" id="quiz"></div>
</section>
</div>
<script>
(function(){
var DATA=[];
var rows=DATA.map(function(o){o.hay=norm([o.label,o.id,o.py,o.hz,o.words,o.note].concat((o.ex||[]).map(function(e){return e.join(" ")})).join(" "));return o});
function $(i){return document.getElementById(i)}
function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

/* tabs */
[["t1","p1"],["t2","p2"]].forEach(function(p){
  $(p[0]).onclick=function(){
    [["t1","p1"],["t2","p2"]].forEach(function(x){var on=x[0]===p[0];$(x[0]).setAttribute("aria-selected",on);$(x[1]).hidden=!on});
  };
});

/* kamus */
function copy(text,btn){
  function done(){var t=btn.textContent;btn.textContent="Tersalin";btn.classList.add("ok");setTimeout(function(){btn.textContent=t;btn.classList.remove("ok")},1200)}
  function fb(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
}
function hl(parent,text,toks){
  if(!toks.length){parent.textContent=text;return}
  var n=norm(text);
  if(n.length!==text.length){parent.textContent=text;return}
  var mask=new Array(text.length).fill(false);
  toks.forEach(function(t){var re=new RegExp(esc(t),"g"),m;while((m=re.exec(n))){for(var k=0;k<t.length;k++)mask[m.index+k]=true;if(m.index===re.lastIndex)re.lastIndex++}});
  var i=0;
  while(i<text.length){
    var j=i;while(j<text.length&&mask[j]===mask[i])j++;
    var seg=text.slice(i,j);
    if(mask[i]){var m=document.createElement("mark");m.textContent=seg;parent.appendChild(m)}else parent.appendChild(document.createTextNode(seg));
    i=j;
  }
}
function tone(l){return /^Bukan/.test(l)?"r":/hati-hati|^Kurang|^Jarang/.test(l)?"y":/pabrik|^Formal/.test(l)?"b":"g"}
function line(label,text,toks,cls){
  var r=el("div","row"),b=el("div"),t=el("div",cls);
  hl(t,text,toks);b.appendChild(t);r.appendChild(b);
  var c=el("button","cp","Salin");c.type="button";c.setAttribute("aria-label","Salin "+label);c.onclick=function(){copy(text,c)};r.appendChild(c);
  return r;
}
function render(){
  var toks=norm($("q").value).split(/\s+/).filter(Boolean);
  var res=rows.filter(function(o){return toks.every(function(t){return o.hay.indexOf(t)>-1})});
  $("info").textContent=res.length+" dari "+rows.length+" entri";
  var L=$("list");L.textContent="";
  if(!res.length){L.appendChild(el("div","empty","Tidak ada hasil. Coba kata kunci lain."));return}
  var frag=document.createDocumentFragment();
  res.slice(0,100).forEach(function(o){
    var c=el("div","card");
    if(o.label)c.appendChild(el("div","lb "+tone(o.label),o.label));
    c.appendChild(line("Indonesia",o.id,toks,"id"));
    var h=line("Hanzi",o.hz,toks,"hz");
    var p=el("div","py");hl(p,o.py,toks);h.firstChild.appendChild(p);
    c.appendChild(h);
    if(o.words){var w=el("div","meta");hl(w,o.words,toks);c.appendChild(w)}
    if(o.note){var n=el("div","meta");hl(n,o.note,toks);c.appendChild(n)}
    if(o.ex&&o.ex.length){
      var box=el("div","exs");box.appendChild(el("div","exh","Contoh kalimat"));
      o.ex.forEach(function(e){
        var it=el("div","ex"),a=el("div","ex-id"),b=el("div","ex-py"),z=el("div","ex-hz");
        hl(a,e[0],toks);hl(b,e[1],toks);hl(z,e[2],toks);
        it.appendChild(a);it.appendChild(b);it.appendChild(z);box.appendChild(it);
      });
      box.hidden=true;
      c.appendChild(box);
      var idEl=c.querySelector(".id");
      if(idEl){
        idEl.classList.add("tog");idEl.setAttribute("role","button");idEl.setAttribute("tabindex","0");
        idEl.setAttribute("aria-expanded","false");
        var flip=function(){box.hidden=!box.hidden;idEl.classList.toggle("open",!box.hidden);idEl.setAttribute("aria-expanded",String(!box.hidden))};
        idEl.onclick=flip;
        idEl.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
      }
    }
    frag.appendChild(c);
  });
  L.appendChild(frag);
  if(res.length>100)L.appendChild(el("div","empty","Menampilkan 100 pertama. Persempit pencarian untuk hasil lain."));
}
$("q").addEventListener("input",render);
(function(){var h=document.querySelector("h1"),t=h.textContent,k=0;h.setAttribute("aria-label",t);h.textContent="";for(var i=0;i<t.length;i++){if(t[i]===" "){h.appendChild(document.createTextNode(" "));continue}var c=el("span","c"+(k++%4),t[i]);c.setAttribute("aria-hidden","true");h.appendChild(c)}})();
render();

/* latihan */
var TN={hz:"Hanzi",py:"Pinyin",id:"Indonesia"},KEYS=["hz","py","id"];
var pool=rows.filter(function(o){return o.id&&o.py&&o.hz&&o.label!=="Bukan kalimat"});
var SES=10,deck=[],last="",st={ok:0,all:0};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function same(a,b){return norm(a).replace(/\s+/g,"")===norm(b).replace(/\s+/g,"")}
function nextItem(){if(!deck.length)deck=shuf(pool);return deck.pop()}
function score(n){$("sc").textContent=(n>SES?"Sesi selesai":"Soal "+n+" dari "+SES)+" · Benar "+st.ok;$("pgf").style.width=Math.min(st.all,SES)/SES*100+"%"}
function newSession(){st={ok:0,all:0};ask()}
function summary(){
  var box=$("quiz");box.textContent="";box._pick=null;score(SES+1);
  box.appendChild(el("div","ask","Sesi selesai"));
  box.appendChild(el("p","qt id","Benar "+st.ok+" dari "+SES+" ("+Math.round(st.ok/SES*100)+"%)"));
  var n=el("button","next","Mulai sesi baru");n.type="button";n.onclick=newSession;box.appendChild(n);n.focus();
}
function ask(){
  if(st.all>=SES){summary();return}
  score(st.all+1);
  var q=nextItem(),pairs=[];
  KEYS.forEach(function(a){KEYS.forEach(function(b){if(a!==b&&a+b!==last)pairs.push([a,b])})});
  var pr=pairs[Math.floor(Math.random()*pairs.length)],qt=pr[0],at=pr[1];last=qt+at;
  var cand=shuf(pool.filter(function(d){return d!==q&&d.hz!==q.hz&&d.py!==q.py&&d.id!==q.id&&!same(d[at],q[at])}));
  var opts=[q],seen=[q[at]];
  for(var i=0;i<cand.length&&opts.length<4;i++){
    if(seen.some(function(s){return same(s,cand[i][at])}))continue;
    opts.push(cand[i]);seen.push(cand[i][at]);
  }
  opts=shuf(opts);
  var box=$("quiz");box.textContent="";
  box.appendChild(el("div","ask","Pilih "+TN[at]+" yang tepat untuk "+TN[qt]+":"));
  box.appendChild(el("p","qt "+qt,q[qt]));
  var wrap=el("div","opts"),btns=[],done=false;
  var res=el("div","res");
  opts.forEach(function(o,i){
    var b=el("button","opt "+at);b.type="button";
    b.appendChild(el("span","k",String(i+1)));b.appendChild(el("span","t",o[at]));
    b.onclick=function(){pick(i)};
    btns.push(b);wrap.appendChild(b);
  });
  function pick(i){
    if(done)return;done=true;st.all++;
    var good=opts[i]===q;if(good)st.ok++;
    btns.forEach(function(b,k){b.disabled=true;if(opts[k]===q)b.classList.add("ok");else if(k===i)b.classList.add("no")});
    res.appendChild(el("div","v",good?"Benar.":"Belum tepat."));
    res.appendChild(el("div","hz",q.hz));
    res.appendChild(el("div","py",q.py));
    res.appendChild(el("div","id",q.id));
    if(q.words)res.appendChild(el("div","meta",q.words));
    if(q.note)res.appendChild(el("div","meta",q.note));
    var n=el("button","next",st.all>=SES?"Lihat hasil":"Soal berikutnya");n.type="button";n.onclick=ask;res.appendChild(n);
    score(st.all);n.focus();
  }
  box.appendChild(wrap);box.appendChild(res);
  box._pick=pick;
}
document.addEventListener("keydown",function(e){
  if($("p2").hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=4&&$("quiz")._pick){$("quiz")._pick(n-1)}
});
$("rs").onclick=newSession;
if(pool.length>=4){ask()}else $("quiz").appendChild(el("div","empty","Data belum cukup untuk kuis."));
})();
</script>
</body>
</html>
